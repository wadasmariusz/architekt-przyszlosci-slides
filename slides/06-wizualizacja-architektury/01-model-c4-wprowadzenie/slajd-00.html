<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slajd 0 - Model C4: wprowadzenie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../template.css">
    <style>
        .bg-image { --bg-url: url('../../../images/background-3.jpg'); }

        .eyebrow {
            font-size: 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--cyan-400);
            margin-bottom: 28px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.2s forwards;
        }

        .title {
            font-size: 160px;
            line-height: 1.02;
            margin-bottom: 28px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.4s forwards;
        }

        .subtitle {
            font-size: 44px;
            font-weight: 400;
            color: rgba(240,244,248,0.78);
            letter-spacing: -0.5px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.7s forwards;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <p class="eyebrow">Wizualizacja architektury</p>
            <h1 class="title">Model <span class="highlight">C4</span></h1>
            <p class="subtitle">Jak rozmawiać o architekturze, żeby się zrozumieć</p>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
