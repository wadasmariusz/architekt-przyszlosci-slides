<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 12 - Zalety EDA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 18%; left: 8%; animation-delay: 0.3s; }
        .particle:nth-child(4) { top: 68%; left: 88%; animation-delay: 1.8s; }
        .particle:nth-child(5) { top: 35%; left: 72%; animation-delay: 3.2s; }
        .particle:nth-child(6) { top: 78%; left: 18%; animation-delay: 4.8s; }
        .particle:nth-child(7) { top: 52%; left: 42%; animation-delay: 6.2s; }
        .particle:nth-child(8) { top: 15%; left: 62%; animation-delay: 2.3s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 70px 100px 150px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            color: var(--cyan-400);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.2s forwards;
        }

        .eyebrow i { font-size: 30px; }

        h1.title {
            color: #ffffff;
            font-size: 72px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.35s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 24px;
            font-weight: 300;
            color: var(--text-muted);
            margin-top: 10px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s forwards;
        }

        /* === Benefits list === */
        .benefits {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .benefit {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 24px 32px;
            border-radius: 18px;
            background: rgba(17,24,39,0.62);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(6px);
            transition: border-color 0.3s, background 0.3s, transform 0.3s;
            opacity: 0;
        }

        .benefit:nth-child(1) { animation: slideFromLeft 0.7s ease-out 0.6s forwards; }
        .benefit:nth-child(2) { animation: slideFromLeft 0.7s ease-out 0.8s forwards; }
        .benefit:nth-child(3) { animation: slideFromLeft 0.7s ease-out 1.0s forwards; }
        .benefit:nth-child(4) { animation: slideFromLeft 0.7s ease-out 1.2s forwards; }
        .benefit:nth-child(5) { animation: slideFromLeft 0.7s ease-out 1.4s forwards; }

        .benefit:hover {
            transform: translateY(-4px);
            border-color: rgba(6,182,212,0.3);
            background: rgba(6,182,212,0.06);
        }

        .benefit-icon {
            flex: 0 0 auto;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 2px solid;
        }

        .benefit:nth-child(1) .benefit-icon {
            background: rgba(6,182,212,0.12);
            color: var(--cyan-400);
            border-color: rgba(6,182,212,0.3);
        }

        .benefit:nth-child(2) .benefit-icon {
            background: rgba(16,185,129,0.12);
            color: #34d399;
            border-color: rgba(16,185,129,0.3);
        }

        .benefit:nth-child(3) .benefit-icon {
            background: rgba(245,158,11,0.12);
            color: #fbbf24;
            border-color: rgba(245,158,11,0.3);
        }

        .benefit:nth-child(4) .benefit-icon {
            background: rgba(139,92,246,0.12);
            color: #a78bfa;
            border-color: rgba(139,92,246,0.3);
        }

        .benefit:nth-child(5) .benefit-icon {
            background: rgba(244,63,94,0.12);
            color: #fb7185;
            border-color: rgba(244,63,94,0.3);
        }

        .benefit-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .benefit-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .benefit-desc {
            font-size: 20px;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">
                <h1 class="title">Główne<span class="highlight"> korzyści</span></h1>
            </div>

            <div class="benefits">
                <!-- 1. Luźne sprzężenie -->
                <div class="benefit">
                    <div class="benefit-icon"><i class="ti ti-link-off"></i></div>
                    <div class="benefit-text">
                        <div class="benefit-title">Luźne sprzężenie</div>
                    </div>
                </div>

                <!-- 2. Odporność -->
                <div class="benefit">
                    <div class="benefit-icon"><i class="ti ti-shield-check"></i></div>
                    <div class="benefit-text">
                        <div class="benefit-title">Odporność na awarie</div>
                    </div>
                </div>

                <!-- 3. Reakcja w czasie rzeczywistym -->
                <div class="benefit">
                    <div class="benefit-icon"><i class="ti ti-bolt"></i></div>
                    <div class="benefit-text">
                        <div class="benefit-title">Reakcja w czasie rzeczywistym</div>
                    </div>
                </div>

                <!-- 4. Brak kosztów pollingu -->
                <div class="benefit">
                    <div class="benefit-icon"><i class="ti ti-clock-off"></i></div>
                    <div class="benefit-text">
                        <div class="benefit-title">Zero kosztów pollingu</div>
                    </div>
                </div>

                <!-- 5. Łatwe rozszerzanie -->
                <div class="benefit">
                    <div class="benefit-icon"><i class="ti ti-puzzle"></i></div>
                    <div class="benefit-text">
                        <div class="benefit-title">Łatwe rozszerzanie systemu</div>
                    </div>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
