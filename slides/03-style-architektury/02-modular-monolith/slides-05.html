<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 05 - Klucz: granice biznesowe, nie techniczne</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.10) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 10%; left: 14%; animation-delay: 0s; }
        .particle:nth-child(4) { top: 72%; left: 88%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 25%; left: 70%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 85%; left: 18%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 48%; left: 52%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 16%; left: 64%; animation-delay: 2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 86px 130px 150px;
        }

        .header {
            text-align: center;
            max-width: 1180px;
            margin: 0 auto 56px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .eyebrow i {
            font-size: 32px;
        }

        h1 {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        h1 .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Two columns === */
        .columns {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: start;
            gap: 50px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .col--left {
            opacity: 0;
            animation: slideFromLeft 0.8s ease-out 0.6s forwards;
        }

        .col--right {
            opacity: 0;
            animation: slideFromRight 0.8s ease-out 0.9s forwards;
        }

        .col-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .col-header--bad {
            color: #f43f5e;
        }

        .col-header--good {
            color: #10b981;
        }

        .col-header i {
            font-size: 26px;
        }

        .col-label {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Folder tree */
        .tree-box {
            border-radius: 20px;
            padding: 36px 40px;
            backdrop-filter: blur(8px);
            font-family: 'Inter', monospace;
        }

        .tree-box--bad {
            background: rgba(244,63,94,0.04);
            border: 2px solid rgba(244,63,94,0.2);
        }

        .tree-box--good {
            background: rgba(16,185,129,0.04);
            border: 2px solid rgba(16,185,129,0.2);
        }

        .tree-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 26px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .tree-item:last-child {
            margin-bottom: 0;
        }

        .tree-item--bad {
            color: rgba(244,63,94,0.85);
            background: rgba(244,63,94,0.06);
        }

        .tree-item--good {
            color: rgba(16,185,129,0.85);
            background: rgba(16,185,129,0.06);
        }

        .tree-item i {
            font-size: 24px;
            flex: 0 0 auto;
        }

        .tree-item--bad i {
            color: rgba(244,63,94,0.6);
        }

        .tree-item--good i {
            color: rgba(16,185,129,0.6);
        }

        .tree-prefix {
            color: var(--text-muted);
            font-weight: 400;
            opacity: 0.5;
            margin-right: -8px;
        }

        /* Arrow between columns */
        .vs-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding-top: 120px;
            opacity: 0;
            animation: scaleIn 0.6s ease-out 1.2s forwards;
        }

        .vs-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid rgba(148,163,184,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-muted);
            background: rgba(17,24,39,0.7);
        }

        .vs-label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* === Bottom conclusion === */
        .conclusion {
            text-align: center;
            margin-top: 48px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.6s forwards;
        }

        .conclusion-box {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 20px 40px;
            border-radius: 16px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(6,182,212,0.2);
            backdrop-filter: blur(8px);
        }

        .conclusion-box i {
            font-size: 30px;
            color: var(--cyan-400);
        }

        .conclusion-box p {
            font-size: 25px;
            font-weight: 400;
            color: var(--text-muted);
        }

        .conclusion-box .hl {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">
                <h1>Granice <span class="highlight">biznesowe</span>, nie techniczne</h1>
            </div>

            <div class="columns">
                <!-- Anti-pattern: technical layers -->
                <div class="col col--left">
                    <div class="col-header col-header--bad">
                        <i class="ti ti-x"></i>
                        Architektura warstwowa
                    </div>
                    <div class="col-label">Podział wg warstw technicznych</div>
                    <div class="tree-box tree-box--bad">
                        <div class="tree-item tree-item--bad">
                            <i class="ti ti-folder"></i>
                            <span class="tree-prefix">/</span>controllers
                        </div>
                        <div class="tree-item tree-item--bad">
                            <i class="ti ti-folder"></i>
                            <span class="tree-prefix">/</span>services
                        </div>
                        <div class="tree-item tree-item--bad">
                            <i class="ti ti-folder"></i>
                            <span class="tree-prefix">/</span>repositories
                        </div>
                        <div class="tree-item tree-item--bad">
                            <i class="ti ti-folder"></i>
                            <span class="tree-prefix">/</span>entities
                        </div>
                    </div>
                </div>

                <!-- VS -->
                <div class="vs-col">
                    <div class="vs-circle">VS</div>
                </div>

                <!-- Good: business modules -->
                <div class="col col--right">
                    <div class="col-header col-header--good">
                        <i class="ti ti-check"></i>
                        Modularny monolit
                    </div>
                    <div class="col-label">Podział wg obszarów biznesowych</div>
                    <div class="tree-box tree-box--good">
                        <div class="tree-item tree-item--good">
                            <i class="ti ti-shopping-cart"></i>
                            <span class="tree-prefix">/</span>orders
                        </div>
                        <div class="tree-item tree-item--good">
                            <i class="ti ti-credit-card"></i>
                            <span class="tree-prefix">/</span>payments
                        </div>
                        <div class="tree-item tree-item--good">
                            <i class="ti ti-lock"></i>
                            <span class="tree-prefix">/</span>identity
                        </div>
                        <div class="tree-item tree-item--good">
                            <i class="ti ti-mail"></i>
                            <span class="tree-prefix">/</span>notifications
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
