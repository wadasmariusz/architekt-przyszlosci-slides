<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 04 - Dlaczego nie od razu mikroserwisy?</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.10) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 12%; left: 18%; animation-delay: 0s; }
        .particle:nth-child(4) { top: 68%; left: 82%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 28%; left: 72%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 78%; left: 15%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 45%; left: 55%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 18%; left: 42%; animation-delay: 2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 86px 130px 150px;
        }

        .header {
            text-align: center;
            max-width: 1180px;
            margin: 0 auto 60px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .eyebrow i {
            font-size: 32px;
        }

        h1 {
            font-size: 58px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        h1 .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Bubbles === */
        .bubbles {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 50px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .bubble {
            border-radius: 24px;
            padding: 44px 40px;
            backdrop-filter: blur(8px);
            position: relative;
        }

        .bubble--wrong {
            background: rgba(244,63,94,0.06);
            border: 2px solid rgba(244,63,94,0.25);
            opacity: 0;
            animation: slideFromLeft 0.8s ease-out 0.6s forwards;
        }

        .bubble--right {
            background: rgba(16,185,129,0.06);
            border: 2px solid rgba(16,185,129,0.25);
            opacity: 0;
            animation: slideFromRight 0.8s ease-out 0.9s forwards;
        }

        .bubble-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .bubble-label--wrong {
            color: #f43f5e;
        }

        .bubble-label--right {
            color: #10b981;
        }

        .bubble-label i {
            font-size: 22px;
        }

        .bubble-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .bubble-icon--wrong {
            background: rgba(244,63,94,0.12);
            color: #f43f5e;
        }

        .bubble-icon--right {
            background: rgba(16,185,129,0.12);
            color: #10b981;
        }

        .bubble-icon i {
            font-size: 36px;
        }

        .bubble-text {
            font-size: 28px;
            font-weight: 400;
            line-height: 1.5;
            color: var(--text-main);
        }

        .bubble-text strong {
            font-weight: 700;
        }

        .bubble--wrong .bubble-text strong {
            color: #f43f5e;
        }

        .bubble--right .bubble-text strong {
            color: #10b981;
        }

        /* Arrow between bubbles */
        .vs-arrow {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            animation: scaleIn 0.6s ease-out 1.2s forwards;
        }

        .vs-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid rgba(148,163,184,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-muted);
            background: rgba(17,24,39,0.7);
        }

        /* === Bottom conclusion === */
        .conclusion {
            text-align: center;
            margin-top: 50px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.6s forwards;
        }

        .conclusion-box {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 20px 40px;
            border-radius: 16px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(6,182,212,0.2);
            backdrop-filter: blur(8px);
        }

        .conclusion-box i {
            font-size: 30px;
            color: var(--cyan-400);
        }

        .conclusion-box p {
            font-size: 26px;
            font-weight: 600;
            color: var(--text-main);
        }

        .conclusion-box .hl {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">
                <h1>Dlaczego nie od razu <span class="highlight">mikroserwisy</span>?</h1>
            </div>

            <div class="bubbles">
                <!-- Wrong thesis -->
                <div class="bubble bubble--wrong">
                    <div class="bubble-label bubble-label--wrong">
                        <i class="ti ti-x"></i>
                        Bledny wniosek
                    </div>
                    <div class="bubble-icon bubble-icon--wrong">
                        <i class="ti ti-alert-triangle"></i>
                    </div>
                    <div class="bubble-text">
                        Mamy <strong>bałagan</strong> w kodzie, więc przejdźmy na <strong>mikroserwisy</strong>!
                    </div>
                </div>

                <!-- VS circle -->
                <div class="vs-arrow">
                    <div class="vs-circle">VS</div>
                </div>

                <!-- Right diagnosis -->
                <div class="bubble bubble--right">
                    <div class="bubble-label bubble-label--right">
                        <i class="ti ti-check"></i>
                        Właściwa diagnoza
                    </div>
                    <div class="bubble-icon bubble-icon--right">
                        <i class="ti ti-stethoscope"></i>
                    </div>
                    <div class="bubble-text">
                        Prawdziwy problem? <strong>Zły podział odpowiedzialności</strong> w kodzie.
                    </div>
                </div>
            </div>

            <!-- Conclusion -->
            <div class="conclusion">
                <div class="conclusion-box">
                    <i class="ti ti-target-arrow"></i>
                    <p><span class="hl">Modularny monolit</span> rozwiązuje problem u źródła.</p>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
