<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 10 - Pułapki i słabe strony</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --red-500: #ef4444;
            --red-rose: #f43f5e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background === */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244,63,94,0.08) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 18%; left: 14%; animation-delay: 0s; }
        .particle:nth-child(4) { top: 72%; left: 78%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 35%; left: 68%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 78%; left: 25%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 42%; left: 48%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 22%; left: 55%; animation-delay: 2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 86px 130px 150px;
        }

        .header {
            text-align: center;
            max-width: 1180px;
            margin: 0 auto 44px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--red-rose);
            margin-bottom: 18px;
        }

        .eyebrow i {
            font-size: 18px;
        }

        h1 {
            font-size: clamp(1.6rem, 3.5vw, 2.6rem);
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .highlight-warn {
            background: linear-gradient(135deg, var(--red-rose), var(--red-500));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Warning items === */
        .warnings {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .warn-item {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 16px 30px;
            border-radius: 16px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(239,68,68,0.15);
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: border-color 0.3s, background 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        .warn-item:hover {
            border-color: var(--red-rose);
            background: rgba(244,63,94,0.06);
            transform: translateX(8px);
            box-shadow: 0 4px 24px rgba(244,63,94,0.1);
        }

        .warn-item:nth-child(1) { animation: slideFromLeft 0.7s ease-out 0.6s forwards; }
        .warn-item:nth-child(2) { animation: slideFromLeft 0.7s ease-out 0.8s forwards; }
        .warn-item:nth-child(3) { animation: slideFromLeft 0.7s ease-out 1.0s forwards; }
        .warn-item:nth-child(4) { animation: slideFromLeft 0.7s ease-out 1.2s forwards; }
        .warn-item:nth-child(5) { animation: slideFromLeft 0.7s ease-out 1.4s forwards; }
        .warn-item:nth-child(6) { animation: slideFromLeft 0.7s ease-out 1.6s forwards; }
        .warn-item:nth-child(7) { animation: slideFromLeft 0.7s ease-out 1.8s forwards; }

        .warn-icon {
            flex: 0 0 auto;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(244,63,94,0.10);
            border: 1px solid rgba(244,63,94,0.25);
            color: var(--red-rose);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .warn-text {
            font-size: 20px;
            font-weight: 400;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .warn-text strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">
                <h1>Pułapki i <span class="highlight-warn">słabe strony</span></h1>
            </div>

            <div class="warnings">
                <div class="warn-item">
                    <div class="warn-icon">
                        <i class="ti ti-arrows-maximize"></i>
                    </div>
                    <div class="warn-text"><strong>Trudniejsze skalowanie</strong></div>
                </div>

                <div class="warn-item">
                    <div class="warn-icon">
                        <i class="ti ti-flame"></i>
                    </div>
                    <div class="warn-text"><strong>Silne współdzielenie procesu i zasobów</strong></div>
                </div>

                <div class="warn-item">
                    <div class="warn-icon">
                        <i class="ti ti-link-off"></i>
                    </div>
                    <div class="warn-text"><strong>Ryzyko ukrytych zależności</strong></div>
                </div>

                <div class="warn-item">
                    <div class="warn-icon">
                        <i class="ti ti-package"></i>
                    </div>
                    <div class="warn-text"><strong>Wspólne wdrożenie</strong></div>
                </div>

                <div class="warn-item">
                    <div class="warn-icon">
                        <i class="ti ti-hourglass"></i>
                    </div>
                    <div class="warn-text"><strong>Dłuższy czas buildów i testów</strong></div>
                </div>

                <div class="warn-item">
                    <div class="warn-icon">
                        <i class="ti ti-users-group"></i>
                    </div>
                    <div class="warn-text"><strong>Mniejsza niezależność zespołów</strong></div>
                </div>

                <div class="warn-item">
                    <div class="warn-icon">
                        <i class="ti ti-lock"></i>
                    </div>
                    <div class="warn-text"><strong>Ograniczona swoboda technologiczna</strong></div>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
