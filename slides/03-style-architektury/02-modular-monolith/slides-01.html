<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 01 - Modularny Monolit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 900px;
            height: 900px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .accent {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.12;
            z-index: 0;
        }

        .accent--left {
            width: 480px;
            height: 480px;
            top: 15%;
            left: 8%;
            background: var(--cyan-400);
        }

        .accent--right {
            width: 380px;
            height: 380px;
            right: 8%;
            bottom: 15%;
            background: #8b5cf6;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(5) { top: 10%; left: 14%; animation-delay: 0s; }
        .particle:nth-child(6) { top: 72%; left: 82%; animation-delay: 1.5s; }
        .particle:nth-child(7) { top: 22%; left: 78%; animation-delay: 3s; }
        .particle:nth-child(8) { top: 82%; left: 22%; animation-delay: 4.5s; }
        .particle:nth-child(9) { top: 48%; left: 42%; animation-delay: 6s; }
        .particle:nth-child(10) { top: 16%; left: 52%; animation-delay: 2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 1100px;
            padding: 0 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* === Honeycomb illustration === */
        .honeycomb {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-bottom: 48px;
            opacity: 0;
            animation: scaleIn 0.8s ease-out 0.2s forwards;
        }

        .hex-row {
            display: flex;
            gap: 8px;
        }

        .hex {
            width: 72px;
            height: 80px;
            position: relative;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            transition: all 0.3s ease;
        }

        .hex--cyan {
            background: rgba(34,211,238,0.15);
            border: none;
        }

        .hex--purple {
            background: rgba(139,92,246,0.12);
        }

        .hex--amber {
            background: rgba(245,158,11,0.12);
        }

        .hex--emerald {
            background: rgba(16,185,129,0.12);
        }

        .hex--dim {
            background: rgba(148,163,184,0.06);
        }

        .hex-inner {
            position: absolute;
            inset: 2px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hex--cyan .hex-inner {
            background: rgba(34,211,238,0.08);
        }

        .hex--purple .hex-inner {
            background: rgba(139,92,246,0.06);
        }

        .hex--amber .hex-inner {
            background: rgba(245,158,11,0.06);
        }

        .hex--emerald .hex-inner {
            background: rgba(16,185,129,0.06);
        }

        .hex--dim .hex-inner {
            background: rgba(148,163,184,0.03);
        }

        .hex i {
            font-size: 28px;
            position: relative;
            z-index: 2;
        }

        .hex--cyan i { color: var(--cyan-400); }
        .hex--purple i { color: #8b5cf6; }
        .hex--amber i { color: #f59e0b; }
        .hex--emerald i { color: #10b981; }
        .hex--dim i { color: rgba(148,163,184,0.3); }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.4s forwards;
        }

        .eyebrow i {
            font-size: 32px;
        }

        h1.title {
            margin-bottom: 36px;
            color: #ffffff;
            font-size: 64px;
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.6s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            max-width: 700px;
            color: var(--text-muted);
            font-size: clamp(1rem, 1.8vw, 1.35rem);
            font-weight: 300;
            line-height: 1.6;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.85s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="accent accent--left"></div>
        <div class="accent accent--right"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <!-- Honeycomb — metafora modułowości -->
            <div class="honeycomb">
                <div class="hex-row">
                    <div class="hex hex--dim"><div class="hex-inner"></div></div>
                    <div class="hex hex--cyan"><div class="hex-inner"><i class="ti ti-shopping-cart"></i></div></div>
                    <div class="hex hex--dim"><div class="hex-inner"></div></div>
                </div>
                <div class="hex-row">
                    <div class="hex hex--purple"><div class="hex-inner"><i class="ti ti-credit-card"></i></div></div>
                    <div class="hex hex--emerald"><div class="hex-inner"><i class="ti ti-lock"></i></div></div>
                    <div class="hex hex--amber"><div class="hex-inner"><i class="ti ti-mail"></i></div></div>
                </div>
                <div class="hex-row">
                    <div class="hex hex--dim"><div class="hex-inner"></div></div>
                    <div class="hex hex--dim"><div class="hex-inner"></div></div>
                    <div class="hex hex--dim"><div class="hex-inner"></div></div>
                </div>
            </div>

            <div class="eyebrow">
                <i class="ti ti-layout-grid"></i>
                Style architektury
            </div>

            <h1 class="title">Modularny <span class="highlight">Monolit</span></h1>

        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
