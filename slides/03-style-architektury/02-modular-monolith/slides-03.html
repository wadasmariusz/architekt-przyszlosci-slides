<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 03 - Monolit spaghetti vs modularny monolit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.10) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 8%; left: 22%; animation-delay: 0s; }
        .particle:nth-child(4) { top: 75%; left: 78%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 35%; left: 68%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 82%; left: 12%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 42%; left: 48%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 14%; left: 58%; animation-delay: 2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 86px 130px 150px;
        }

        .header {
            text-align: center;
            max-width: 1180px;
            margin: 0 auto 50px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .eyebrow i {
            font-size: 32px;
        }

        h1 {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        h1 .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 .bad {
            color: #f43f5e;
        }

        /* === Graph comparison === */
        .comparison {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 50px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .comparison-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .comparison-col--left {
            opacity: 0;
            animation: slideFromLeft 0.8s ease-out 0.6s forwards;
        }

        .comparison-col--right {
            opacity: 0;
            animation: slideFromRight 0.8s ease-out 0.8s forwards;
        }

        .col-label {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .col-label--bad {
            color: #f43f5e;
        }

        .col-label--good {
            color: #10b981;
        }

        .col-label i {
            font-size: 28px;
        }

        /* Graph containers */
        .graph-box {
            width: 420px;
            height: 380px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .graph-box--chaos {
            background: rgba(244,63,94,0.04);
            border: 2px solid rgba(244,63,94,0.2);
        }

        .graph-box--order {
            background: rgba(16,185,129,0.04);
            border: 2px solid rgba(16,185,129,0.2);
        }

        /* SVG graphs */
        .graph-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* Chaos graph */
        .chaos-line {
            stroke: rgba(244,63,94,0.4);
            stroke-width: 1.5;
            fill: none;
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: drawLine 1.2s ease-out forwards;
        }

        .chaos-line:nth-child(1) { animation-delay: 0.7s; }
        .chaos-line:nth-child(2) { animation-delay: 0.8s; }
        .chaos-line:nth-child(3) { animation-delay: 0.9s; }
        .chaos-line:nth-child(4) { animation-delay: 1.0s; }
        .chaos-line:nth-child(5) { animation-delay: 1.1s; }
        .chaos-line:nth-child(6) { animation-delay: 1.2s; }
        .chaos-line:nth-child(7) { animation-delay: 1.3s; }
        .chaos-line:nth-child(8) { animation-delay: 1.4s; }
        .chaos-line:nth-child(9) { animation-delay: 1.5s; }
        .chaos-line:nth-child(10) { animation-delay: 1.6s; }
        .chaos-line:nth-child(11) { animation-delay: 1.7s; }
        .chaos-line:nth-child(12) { animation-delay: 1.8s; }
        .chaos-line:nth-child(13) { animation-delay: 1.9s; }
        .chaos-line:nth-child(14) { animation-delay: 2.0s; }
        .chaos-line:nth-child(15) { animation-delay: 2.1s; }
        .chaos-line:nth-child(16) { animation-delay: 2.2s; }

        .chaos-node {
            fill: rgba(244,63,94,0.7);
            opacity: 0;
            animation: nodeAppear 0.4s ease-out forwards;
        }

        .chaos-node:nth-child(17) { animation-delay: 0.6s; }
        .chaos-node:nth-child(18) { animation-delay: 0.7s; }
        .chaos-node:nth-child(19) { animation-delay: 0.8s; }
        .chaos-node:nth-child(20) { animation-delay: 0.9s; }
        .chaos-node:nth-child(21) { animation-delay: 1.0s; }
        .chaos-node:nth-child(22) { animation-delay: 1.1s; }
        .chaos-node:nth-child(23) { animation-delay: 1.2s; }
        .chaos-node:nth-child(24) { animation-delay: 1.3s; }
        .chaos-node:nth-child(25) { animation-delay: 1.4s; }
        .chaos-node:nth-child(26) { animation-delay: 1.5s; }
        .chaos-node:nth-child(27) { animation-delay: 1.6s; }
        .chaos-node:nth-child(28) { animation-delay: 1.7s; }

        /* Order graph */
        .order-line {
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: drawLine 1s ease-out forwards;
        }

        .order-line--cyan { stroke: rgba(34,211,238,0.5); }
        .order-line--purple { stroke: rgba(139,92,246,0.5); }
        .order-line--amber { stroke: rgba(245,158,11,0.5); }
        .order-line--emerald { stroke: rgba(16,185,129,0.5); }
        .order-line--inter { stroke: rgba(148,163,184,0.25); stroke-dasharray: 6 4; }

        .order-line:nth-child(1) { animation-delay: 0.9s; }
        .order-line:nth-child(2) { animation-delay: 1.0s; }
        .order-line:nth-child(3) { animation-delay: 1.1s; }
        .order-line:nth-child(4) { animation-delay: 1.2s; }
        .order-line:nth-child(5) { animation-delay: 1.3s; }
        .order-line:nth-child(6) { animation-delay: 1.4s; }
        .order-line:nth-child(7) { animation-delay: 1.5s; }
        .order-line:nth-child(8) { animation-delay: 1.6s; }
        .order-line:nth-child(9) { animation-delay: 1.7s; }
        .order-line:nth-child(10) { animation-delay: 1.8s; }

        .order-node {
            opacity: 0;
            animation: nodeAppear 0.4s ease-out forwards;
        }

        .order-node--cyan { fill: rgba(34,211,238,0.8); }
        .order-node--purple { fill: rgba(139,92,246,0.8); }
        .order-node--amber { fill: rgba(245,158,11,0.8); }
        .order-node--emerald { fill: rgba(16,185,129,0.8); }

        .order-node:nth-child(11) { animation-delay: 0.9s; }
        .order-node:nth-child(12) { animation-delay: 1.0s; }
        .order-node:nth-child(13) { animation-delay: 1.1s; }
        .order-node:nth-child(14) { animation-delay: 1.2s; }
        .order-node:nth-child(15) { animation-delay: 1.3s; }
        .order-node:nth-child(16) { animation-delay: 1.4s; }
        .order-node:nth-child(17) { animation-delay: 1.5s; }
        .order-node:nth-child(18) { animation-delay: 1.6s; }
        .order-node:nth-child(19) { animation-delay: 1.7s; }
        .order-node:nth-child(20) { animation-delay: 1.8s; }
        .order-node:nth-child(21) { animation-delay: 1.9s; }
        .order-node:nth-child(22) { animation-delay: 2.0s; }

        /* Group boundaries */
        .group-boundary {
            fill: none;
            stroke-width: 1.5;
            stroke-dasharray: 8 4;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 2.2s forwards;
        }

        .group-boundary--cyan { stroke: rgba(34,211,238,0.25); }
        .group-boundary--purple { stroke: rgba(139,92,246,0.25); }
        .group-boundary--amber { stroke: rgba(245,158,11,0.25); }
        .group-boundary--emerald { stroke: rgba(16,185,129,0.25); }

        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        @keyframes nodeAppear {
            from { opacity: 0; transform: scale(0); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Arrow icon between graphs */
        .arrow-transform {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            opacity: 0;
            animation: scaleIn 0.6s ease-out 1.2s forwards;
        }

        .arrow-transform i {
            font-size: 42px;
            color: var(--cyan-400);
        }

        .arrow-label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* Bottom quote */
        .bottom-quote {
            text-align: center;
            margin-top: 40px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 2.4s forwards;
        }

        .bottom-quote p {
            font-size: 24px;
            font-weight: 300;
            color: var(--text-muted);
            font-style: italic;
        }

        .bottom-quote strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .bottom-quote .hl {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
            font-style: normal;
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">
                <h1><span class="bad">Spaghetti</span> vs <span class="highlight">porządek</span></h1>
            </div>

            <div class="comparison">
                <!-- Chaos graph -->
                <div class="comparison-col comparison-col--left">
                    <div class="col-label col-label--bad">
                        <i class="ti ti-alert-triangle"></i>
                        Przypadkowe zależności
                    </div>
                    <div class="graph-box graph-box--chaos">
                        <svg class="graph-svg" viewBox="0 0 420 380">
                            <!-- Chaotic connections crossing everywhere -->
                            <line class="chaos-line" x1="70" y1="60" x2="350" y2="180"/>
                            <line class="chaos-line" x1="200" y1="40" x2="80" y2="300"/>
                            <line class="chaos-line" x1="340" y1="50" x2="60" y2="200"/>
                            <line class="chaos-line" x1="100" y1="150" x2="360" y2="310"/>
                            <line class="chaos-line" x1="250" y1="80" x2="120" y2="340"/>
                            <line class="chaos-line" x1="50" y1="280" x2="330" y2="70"/>
                            <line class="chaos-line" x1="180" y1="320" x2="300" y2="50"/>
                            <line class="chaos-line" x1="370" y1="260" x2="70" y2="60"/>
                            <line class="chaos-line" x1="150" y1="100" x2="350" y2="330"/>
                            <line class="chaos-line" x1="280" y1="200" x2="60" y2="340"/>
                            <line class="chaos-line" x1="100" y1="150" x2="280" y2="200"/>
                            <line class="chaos-line" x1="200" y1="240" x2="340" y2="50"/>
                            <line class="chaos-line" x1="70" y1="60" x2="200" y2="240"/>
                            <line class="chaos-line" x1="250" y1="300" x2="150" y2="100"/>
                            <line class="chaos-line" x1="330" y1="70" x2="180" y2="320"/>
                            <line class="chaos-line" x1="60" y1="200" x2="370" y2="260"/>
                            <!-- Nodes -->
                            <circle class="chaos-node" cx="70" cy="60" r="9"/>
                            <circle class="chaos-node" cx="200" cy="40" r="9"/>
                            <circle class="chaos-node" cx="340" cy="50" r="9"/>
                            <circle class="chaos-node" cx="100" cy="150" r="9"/>
                            <circle class="chaos-node" cx="250" cy="80" r="9"/>
                            <circle class="chaos-node" cx="60" cy="200" r="9"/>
                            <circle class="chaos-node" cx="280" cy="200" r="9"/>
                            <circle class="chaos-node" cx="150" cy="100" r="9"/>
                            <circle class="chaos-node" cx="370" cy="260" r="9"/>
                            <circle class="chaos-node" cx="200" cy="240" r="9"/>
                            <circle class="chaos-node" cx="80" cy="300" r="9"/>
                            <circle class="chaos-node" cx="350" cy="330" r="9"/>
                        </svg>
                    </div>
                </div>

                <!-- Arrow transform -->
                <div class="arrow-transform">
                    <i class="ti ti-arrow-right"></i>
                    <span class="arrow-label">Refaktor</span>
                </div>

                <!-- Ordered graph -->
                <div class="comparison-col comparison-col--right">
                    <div class="col-label col-label--good">
                        <i class="ti ti-topology-star-ring-3"></i>
                        Kontrolowane granice
                    </div>
                    <div class="graph-box graph-box--order">
                        <svg class="graph-svg" viewBox="0 0 420 380">
                            <!-- Intra-group connections -->
                            <line class="order-line order-line--cyan" x1="90" y1="80" x2="160" y2="60"/>
                            <line class="order-line order-line--cyan" x1="90" y1="80" x2="130" y2="140"/>
                            <line class="order-line order-line--cyan" x1="160" y1="60" x2="130" y2="140"/>
                            <line class="order-line order-line--purple" x1="290" y1="70" x2="350" y2="100"/>
                            <line class="order-line order-line--purple" x1="290" y1="70" x2="320" y2="150"/>
                            <line class="order-line order-line--purple" x1="350" y1="100" x2="320" y2="150"/>
                            <line class="order-line order-line--amber" x1="80" y1="260" x2="150" y2="240"/>
                            <line class="order-line order-line--amber" x1="80" y1="260" x2="120" y2="320"/>
                            <line class="order-line order-line--emerald" x1="300" y1="270" x2="360" y2="250"/>
                            <line class="order-line order-line--emerald" x1="300" y1="270" x2="340" y2="330"/>
                            <!-- Inter-group connections (controlled) -->
                            <line class="order-line order-line--inter" x1="130" y1="140" x2="290" y2="70"/>
                            <line class="order-line order-line--inter" x1="150" y1="240" x2="300" y2="270"/>
                            <!-- Group boundaries -->
                            <ellipse class="group-boundary group-boundary--cyan" cx="127" cy="93" rx="75" ry="65"/>
                            <ellipse class="group-boundary group-boundary--purple" cx="320" cy="107" rx="70" ry="65"/>
                            <ellipse class="group-boundary group-boundary--amber" cx="117" cy="273" rx="70" ry="60"/>
                            <ellipse class="group-boundary group-boundary--emerald" cx="333" cy="283" rx="65" ry="60"/>
                            <!-- Nodes -->
                            <circle class="order-node order-node--cyan" cx="90" cy="80" r="9"/>
                            <circle class="order-node order-node--cyan" cx="160" cy="60" r="9"/>
                            <circle class="order-node order-node--cyan" cx="130" cy="140" r="9"/>
                            <circle class="order-node order-node--purple" cx="290" cy="70" r="9"/>
                            <circle class="order-node order-node--purple" cx="350" cy="100" r="9"/>
                            <circle class="order-node order-node--purple" cx="320" cy="150" r="9"/>
                            <circle class="order-node order-node--amber" cx="80" cy="260" r="9"/>
                            <circle class="order-node order-node--amber" cx="150" cy="240" r="9"/>
                            <circle class="order-node order-node--amber" cx="120" cy="320" r="9"/>
                            <circle class="order-node order-node--emerald" cx="300" cy="270" r="9"/>
                            <circle class="order-node order-node--emerald" cx="360" cy="250" r="9"/>
                            <circle class="order-node order-node--emerald" cx="340" cy="330" r="9"/>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bottom-quote">
                <p><span class="hl">kontrolowane granice</span> zamiast chaosu</p>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
