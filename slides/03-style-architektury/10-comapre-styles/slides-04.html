<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 04 - Koszt architektury</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 12%; left: 18%; animation-delay: 0.2s; }
        .particle:nth-child(4) { top: 70%; left: 78%; animation-delay: 1.7s; }
        .particle:nth-child(5) { top: 20%; left: 65%; animation-delay: 3.4s; }
        .particle:nth-child(6) { top: 80%; left: 15%; animation-delay: 4.2s; }
        .particle:nth-child(7) { top: 55%; left: 42%; animation-delay: 5.8s; }
        .particle:nth-child(8) { top: 8%; left: 50%; animation-delay: 2.3s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 80px 130px 160px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            max-width: 1180px;
            margin: 0 auto 40px;
        }

        h1.title {
            margin-bottom: 14px;
            color: #ffffff;
            font-size: 72px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 0;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.45s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Cost list === */
        .cost-list {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 26px;
            max-width: 1420px;
            width: 100%;
            margin: 30px auto 0;
            align-content: center;
        }

        .cost-item {
            position: relative;
            display: grid;
            grid-template-columns: 88px 1fr auto;
            align-items: center;
            gap: 28px;
            min-height: 190px;
            padding: 34px 42px;
            border-radius: 14px;
            background: rgba(17,24,39,0.68);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 24px 70px rgba(0,0,0,0.22);
            backdrop-filter: blur(10px);
            opacity: 0;
            overflow: hidden;
            animation: fadeUp 0.7s ease-out forwards;
        }

        .cost-item::before {
            content: '';
            position: absolute;
            inset: 0 auto 0 0;
            width: 6px;
            background: var(--accent);
            box-shadow: 0 0 28px var(--accent);
        }

        .cost-item:nth-child(1) { --accent: #22d3ee; animation-delay: 0.85s; }
        .cost-item:nth-child(2) { --accent: #8b5cf6; animation-delay: 1.0s; }
        .cost-item:nth-child(3) { --accent: #f43f5e; animation-delay: 1.15s; }
        .cost-item:nth-child(4) { --accent: #f59e0b; animation-delay: 1.3s; }

        .cost-icon {
            width: 88px;
            height: 88px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: color-mix(in srgb, var(--accent) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
            color: var(--accent);
            font-size: 46px;
        }

        .cost-name {
            color: #ffffff;
            font-size: 40px;
            font-weight: 800;
            line-height: 1.12;
        }

        .cost-value {
            min-width: 230px;
            text-align: right;
            color: var(--accent);
            font-size: 70px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 3px;
            text-shadow: 0 0 26px color-mix(in srgb, var(--accent) 36%, transparent);
        }

        .cost-value.low {
            letter-spacing: 0;
        }

        .cost-scale {
            max-width: 1420px;
            width: 100%;
            margin: 22px auto 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: #64748b;
            font-size: 22px;
            font-weight: 500;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 1.55s forwards;
        }

        .cost-scale i {
            color: rgba(245,158,11,0.75);
            font-size: 28px;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">
                <h1 class="title"><span class="highlight">Koszt</span> architektury</h1>
            </div>

            <div class="cost-list" aria-label="Koszt stylów architektonicznych">
                <div class="cost-item">
                    <div class="cost-icon"><i class="ti ti-stack-2"></i></div>
                    <div class="cost-name">Layered</div>
                    <div class="cost-value low">$</div>
                </div>

                <div class="cost-item">
                    <div class="cost-icon"><i class="ti ti-puzzle"></i></div>
                    <div class="cost-name">Monolit modularny</div>
                    <div class="cost-value low">$</div>
                </div>

                <div class="cost-item">
                    <div class="cost-icon"><i class="ti ti-hexagons"></i></div>
                    <div class="cost-name">Mikroserwisy</div>
                    <div class="cost-value">$$$$$</div>
                </div>

                <div class="cost-item">
                    <div class="cost-icon"><i class="ti ti-bolt"></i></div>
                    <div class="cost-name">Event-driven</div>
                    <div class="cost-value">$$$</div>
                </div>
            </div>

            <div class="cost-scale">
                <i class="ti ti-cash"></i>
                <span>Im więcej znaków $, tym większy typowy koszt całkowity</span>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
