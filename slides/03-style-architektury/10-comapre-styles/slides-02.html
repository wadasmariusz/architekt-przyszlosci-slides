<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 02 - Podział systemu: technical vs domain</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 18%; left: 8%; animation-delay: 0.5s; }
        .particle:nth-child(4) { top: 65%; left: 88%; animation-delay: 2s; }
        .particle:nth-child(5) { top: 28%; left: 68%; animation-delay: 3.5s; }
        .particle:nth-child(6) { top: 78%; left: 18%; animation-delay: 5s; }
        .particle:nth-child(7) { top: 42%; left: 52%; animation-delay: 1s; }
        .particle:nth-child(8) { top: 12%; left: 62%; animation-delay: 6.5s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 80px 130px 160px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            max-width: 1180px;
            margin: 0 auto 36px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i { font-size: 32px; }

        h1.title {
            margin-bottom: 14px;
            color: #ffffff;
            font-size: 72px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.45s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: clamp(1rem, 1.8vw, 1.2rem);
            font-weight: 300;
            line-height: 1.6;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.65s forwards;
        }

        /* === Two diagrams side by side === */
        .diagrams {
            display: grid;
            grid-template-columns: 1fr 60px 1fr;
            gap: 0;
            flex: 1;
            align-items: center;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
        }

        .diagram-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            opacity: 0;
        }

        .diagram-panel.left { animation: slideFromLeft 0.8s ease-out 0.9s forwards; }
        .diagram-panel.right { animation: slideFromRight 0.8s ease-out 1.1s forwards; }

        .panel-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            border-radius: 100px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .panel-label.technical {
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.25);
            color: #f59e0b;
        }

        .panel-label.domain {
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.25);
            color: #10b981;
        }

        .panel-label i { font-size: 22px; }

        /* === Box diagrams === */
        .box-diagram {
            width: 100%;
            max-width: 580px;
        }

        .box-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .box-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 24px;
            border-radius: 14px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            transition: border-color 0.3s, background 0.3s;
        }

        .box-row:hover {
            border-color: rgba(6,182,212,0.25);
            background: rgba(6,182,212,0.05);
        }

        .box-row i {
            flex: 0 0 auto;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .box-row.tech i {
            background: rgba(245,158,11,0.12);
            color: #f59e0b;
        }

        .box-row.dom i {
            background: rgba(16,185,129,0.12);
            color: #10b981;
        }

        .box-row span {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* === Separator === */
        .separator {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0;
            animation: scaleIn 0.6s ease-out 1.3s forwards;
        }

        .sep-line {
            width: 2px;
            height: 100px;
            background: linear-gradient(to bottom, transparent, rgba(148,163,184,0.3), transparent);
        }

        .sep-badge {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(17,24,39,0.9);
            border: 2px solid rgba(148,163,184,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: var(--text-muted);
        }

        /* === Architecture tags === */
        .arch-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 4px;
        }

        .arch-tag {
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .arch-tag.layered {
            background: rgba(34,211,238,0.1);
            border: 1px solid rgba(34,211,238,0.25);
            color: var(--cyan-400);
        }

        .arch-tag.event {
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.25);
            color: #f59e0b;
        }

        .arch-tag.modular {
            background: rgba(139,92,246,0.1);
            border: 1px solid rgba(139,92,246,0.25);
            color: #8b5cf6;
        }

        .arch-tag.micro {
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.25);
            color: #10b981;
        }

        /* === Footer comment === */
        .footer-comment {
            text-align: center;
            margin-top: auto;
            padding-top: 20px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.6s forwards;
        }

        .footer-comment p {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 400;
            color: #64748b;
            font-style: italic;
        }

        .footer-comment i {
            font-size: 18px;
            color: rgba(6,182,212,0.5);
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">
                <div class="eyebrow">
                    <i class="ti ti-layout-grid"></i>
                    Podział systemu
                </div>
                <h1 class="title"><span class="highlight">Technical</span> vs <span class="highlight">domain</span></h1>
            </div>

            <div class="diagrams">
                <!-- Left: Technical partition -->
                <div class="diagram-panel left">
                    <div class="panel-label technical">
                        <i class="ti ti-settings"></i>
                        Podział techniczny
                    </div>
                    <div class="box-diagram">
                        <div class="box-stack">
                            <div class="box-row tech">
                                <i class="ti ti-api"></i>
                                <span>API / Controllers</span>
                            </div>
                            <div class="box-row tech">
                                <i class="ti ti-code"></i>
                                <span>Serwisy / Logika</span>
                            </div>
                            <div class="box-row tech">
                                <i class="ti ti-database"></i>
                                <span>Repozytoria / Dane</span>
                            </div>
                            <div class="box-row tech">
                                <i class="ti ti-send"></i>
                                <span>Broker / Konsumenci</span>
                            </div>
                        </div>
                    </div>
                    <div class="arch-tags">
                        <span class="arch-tag layered">Layered</span>
                        <span class="arch-tag event">Event-driven</span>
                    </div>
                </div>

                <!-- Separator -->
                <div class="separator">
                    <div class="sep-line"></div>
                    <div class="sep-badge">vs</div>
                    <div class="sep-line"></div>
                </div>

                <!-- Right: Domain partition -->
                <div class="diagram-panel right">
                    <div class="panel-label domain">
                        <i class="ti ti-building-community"></i>
                        Podział domenowy
                    </div>
                    <div class="box-diagram">
                        <div class="box-stack">
                            <div class="box-row dom">
                                <i class="ti ti-book"></i>
                                <span>Katalog</span>
                            </div>
                            <div class="box-row dom">
                                <i class="ti ti-shopping-cart"></i>
                                <span>Koszyk</span>
                            </div>
                            <div class="box-row dom">
                                <i class="ti ti-credit-card"></i>
                                <span>Płatności</span>
                            </div>
                            <div class="box-row dom">
                                <i class="ti ti-truck-delivery"></i>
                                <span>Wysyłka</span>
                            </div>
                        </div>
                    </div>
                    <div class="arch-tags">
                        <span class="arch-tag modular">Modular monolith</span>
                        <span class="arch-tag micro">Microservices</span>
                    </div>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
