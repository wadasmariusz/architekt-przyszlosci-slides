<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 13 - Responsywność systemu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 18%; left: 8%; animation-delay: 0.3s; }
        .particle:nth-child(4) { top: 72%; left: 88%; animation-delay: 1.8s; }
        .particle:nth-child(5) { top: 28%; left: 76%; animation-delay: 3.2s; }
        .particle:nth-child(6) { top: 82%; left: 16%; animation-delay: 5.0s; }
        .particle:nth-child(7) { top: 45%; left: 52%; animation-delay: 6.5s; }
        .particle:nth-child(8) { top: 16%; left: 64%; animation-delay: 2.3s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 80px 130px 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            max-width: 1180px;
            margin: 0 auto 44px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i { font-size: 32px; }

        h1.title {
            margin-bottom: 14px;
            color: #ffffff;
            font-size: 68px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.45s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: clamp(1rem, 1.8vw, 1.2rem);
            font-weight: 300;
            line-height: 1.6;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.65s forwards;
        }

        /* === Main layout — two diagrams side by side === */
        .main-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            max-width: 1500px;
            width: 100%;
            flex: 1;
            align-items: start;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.85s forwards;
        }

        /* === Diagram panel === */
        .diagram-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 28px 28px;
            border-radius: 20px;
            background: rgba(17,24,39,0.55);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(6px);
        }

        .diagram-panel--sync { border-color: rgba(139,92,246,0.2); }
        .diagram-panel--async { border-color: rgba(16,185,129,0.2); }

        .panel-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .panel-label--sync { color: #8b5cf6; }
        .panel-label--async { color: #10b981; }

        .panel-label i { font-size: 22px; }

        .panel-title {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 28px;
            text-align: center;
            line-height: 1.3;
        }

        /* === SVG diagrams === */
        .diagram-svg {
            width: 100%;
            max-width: 560px;
            height: 280px;
        }

        .node-rect {
            rx: 10;
            ry: 10;
            stroke-width: 1.5;
        }

        .node-text {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .arrow-line {
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: drawLine 1.4s ease-out 1.1s forwards;
        }

        .arrow-line--delayed { animation-delay: 1.4s; }
        .arrow-line--delayed2 { animation-delay: 1.7s; }
        .arrow-line--delayed3 { animation-delay: 2.0s; }

        .arrow-head {
            stroke-width: 1.5;
        }

        .label-small {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 400;
        }

        /* Sync colors */
        .sync-node { fill: rgba(139,92,246,0.12); stroke: rgba(139,92,246,0.4); }
        .sync-text { fill: #c4b5fd; }
        .sync-arrow { stroke: rgba(139,92,246,0.5); }
        .sync-label { fill: #a78bfa; }
        .sync-head { fill: rgba(139,92,246,0.5); stroke: rgba(139,92,246,0.5); }

        /* Async colors */
        .async-node { fill: rgba(16,185,129,0.12); stroke: rgba(16,185,129,0.4); }
        .async-text { fill: #6ee7b7; }
        .async-arrow { stroke: rgba(16,185,129,0.5); }
        .async-label { fill: #34d399; }
        .async-head { fill: rgba(16,185,129,0.5); stroke: rgba(16,185,129,0.5); }

        .broker-node { fill: rgba(245,158,11,0.12); stroke: rgba(245,158,11,0.4); }
        .broker-text { fill: #fcd34d; }

        .user-node { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.2); }
        .user-text { fill: var(--text-main); }

        /* Wait indicator */
        .wait-bar {
            rx: 4; ry: 4;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 2.2s forwards;
        }

        .wait-bar--sync { fill: rgba(239,68,68,0.2); stroke: rgba(239,68,68,0.35); stroke-width: 1; }
        .wait-bar--async { fill: rgba(16,185,129,0.15); stroke: rgba(16,185,129,0.3); stroke-width: 1; }

        .wait-label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 2.4s forwards;
        }

        .wait-label--sync { fill: #ef4444; }
        .wait-label--async { fill: #10b981; }

        /* === Bottom key message === */
        .bottom-note {
            max-width: 1500px;
            width: 100%;
            margin-top: 32px;
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 2.6s forwards;
        }

        .note-box {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 32px;
            border-radius: 14px;
            background: rgba(6,182,212,0.05);
            border: 1px solid rgba(6,182,212,0.15);
            font-size: 17px;
            font-weight: 400;
            color: var(--text-muted);
        }

        .note-box i {
            font-size: 22px;
            color: var(--cyan-400);
        }

        .note-box strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">
                <div class="eyebrow">
                    <i class="ti ti-clock-bolt"></i>
                    Responsywność
                </div>
                <h1 class="title"><span class="highlight">Responsywność</span> systemu</h1>
                <p class="subtitle">„Nowocześniejsze" nie znaczy automatycznie „szybsze dla użytkownika"</p>
            </div>

            <div class="main-area">
                <!-- Sync panel — microservices request-response chain -->
                <div class="diagram-panel diagram-panel--sync">
                    <div class="panel-label panel-label--sync">
                        <i class="ti ti-arrows-right-left"></i>
                        Mikroserwisy — synchroniczny łańcuch
                    </div>
                    <svg class="diagram-svg" viewBox="0 0 560 280">
                        <!-- User node -->
                        <rect class="node-rect user-node" x="10" y="110" width="90" height="44" />
                        <text class="node-text user-text" x="55" y="132">Użytkownik</text>

                        <!-- Service A -->
                        <rect class="node-rect sync-node" x="140" y="110" width="90" height="44" />
                        <text class="node-text sync-text" x="185" y="132">Serwis A</text>

                        <!-- Service B -->
                        <rect class="node-rect sync-node" x="270" y="110" width="90" height="44" />
                        <text class="node-text sync-text" x="315" y="132">Serwis B</text>

                        <!-- Service C -->
                        <rect class="node-rect sync-node" x="400" y="110" width="90" height="44" />
                        <text class="node-text sync-text" x="445" y="132">Serwis C</text>

                        <!-- Arrows -->
                        <line class="arrow-line sync-arrow" x1="100" y1="132" x2="136" y2="132" />
                        <polygon class="arrow-head sync-head" points="136,128 144,132 136,136" />

                        <line class="arrow-line sync-arrow arrow-line--delayed" x1="230" y1="132" x2="266" y2="132" />
                        <polygon class="arrow-head sync-head" points="266,128 274,132 266,136" />

                        <line class="arrow-line sync-arrow arrow-line--delayed2" x1="360" y1="132" x2="396" y2="132" />
                        <polygon class="arrow-head sync-head" points="396,128 404,132 396,136" />

                        <!-- Wait labels -->
                        <text class="label-small sync-label" x="115" y="106">czeka</text>
                        <text class="label-small sync-label" x="245" y="106">czeka</text>
                        <text class="label-small sync-label" x="375" y="106">czeka</text>

                        <!-- Wait bar -->
                        <rect class="wait-bar wait-bar--sync" x="10" y="180" width="480" height="24" />
                        <text class="wait-label wait-label--sync" x="250" y="196" text-anchor="middle">Użytkownik czeka na cały łańcuch A → B → C</text>

                        <!-- Response arrows (dashed, going back) -->
                        <line class="arrow-line sync-arrow arrow-line--delayed3" x1="400" y1="154" x2="100" y2="154" stroke-dasharray="6 4" />
                        <text class="label-small sync-label" x="250" y="170" text-anchor="middle">response po zakończeniu całego łańcucha</text>
                    </svg>
                </div>

                <!-- Async panel — event-driven accept + process later -->
                <div class="diagram-panel diagram-panel--async">
                    <div class="panel-label panel-label--async">
                        <i class="ti ti-bolt"></i>
                        Event-driven — przyjmij i przetwarzaj
                    </div>
                    <svg class="diagram-svg" viewBox="0 0 560 280">
                        <!-- User node -->
                        <rect class="node-rect user-node" x="10" y="60" width="90" height="44" />
                        <text class="node-text user-text" x="55" y="82">Użytkownik</text>

                        <!-- API / Command handler -->
                        <rect class="node-rect async-node" x="150" y="60" width="120" height="44" />
                        <text class="node-text async-text" x="210" y="82">API / Handler</text>

                        <!-- Arrow user -> API -->
                        <line class="arrow-line async-arrow" x1="100" y1="82" x2="146" y2="82" />
                        <polygon class="arrow-head async-head" points="146,78 154,82 146,86" />

                        <!-- Quick response back -->
                        <line class="arrow-line async-arrow arrow-line--delayed" x1="150" y1="104" x2="100" y2="104" stroke-dasharray="6 4" />
                        <text class="label-small async-label" x="125" y="120" text-anchor="middle">202 Accepted</text>

                        <!-- Short wait bar -->
                        <rect class="wait-bar wait-bar--async" x="10" y="138" width="120" height="22" />
                        <text class="wait-label wait-label--async" x="70" y="153" text-anchor="middle">krótkie czekanie</text>

                        <!-- Event broker -->
                        <rect class="node-rect broker-node" x="320" y="60" width="110" height="44" />
                        <text class="node-text broker-text" x="375" y="82">Event Bus</text>

                        <!-- Arrow API -> Broker -->
                        <line class="arrow-line async-arrow arrow-line--delayed" x1="270" y1="82" x2="316" y2="82" />
                        <polygon class="arrow-head async-head" points="316,78 324,82 316,86" />
                        <text class="label-small async-label" x="293" y="72" text-anchor="middle">event</text>

                        <!-- Consumer 1 -->
                        <rect class="node-rect async-node" x="320" y="140" width="110" height="38" />
                        <text class="node-text async-text" x="375" y="160" font-size="12">Konsument 1</text>

                        <!-- Consumer 2 -->
                        <rect class="node-rect async-node" x="320" y="196" width="110" height="38" />
                        <text class="node-text async-text" x="375" y="216" font-size="12">Konsument 2</text>

                        <!-- Arrows broker -> consumers -->
                        <line class="arrow-line async-arrow arrow-line--delayed2" x1="375" y1="104" x2="375" y2="136" />
                        <polygon class="arrow-head async-head" points="371,136 375,144 379,136" />

                        <line class="arrow-line async-arrow arrow-line--delayed3" x1="375" y1="178" x2="375" y2="192" />
                        <polygon class="arrow-head async-head" points="371,192 375,200 379,192" />

                        <!-- Async processing label -->
                        <text class="label-small async-label" x="470" y="160" font-size="10">przetwarzanie</text>
                        <text class="label-small async-label" x="470" y="174" font-size="10">asynchroniczne</text>
                    </svg>
                </div>
            </div>

            <!-- Bottom key message -->
            <div class="bottom-note">
                <div class="note-box">
                    <i class="ti ti-bolt"></i>
                    Event-driven wygrywa tam, gdzie <strong>użytkownik nie musi czekać na pełne zakończenie procesu</strong>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
