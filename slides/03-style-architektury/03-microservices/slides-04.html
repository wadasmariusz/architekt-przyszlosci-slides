<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 04 - Skąd się wzięły mikroserwisy?</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 12%; left: 22%; animation-delay: 0s; }
        .particle:nth-child(4) { top: 72%; left: 78%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 35%; left: 70%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 78%; left: 12%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 45%; left: 55%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 18%; left: 42%; animation-delay: 2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 80px 130px 160px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i {
            font-size: 32px;
        }

        h1.title {
            color: #ffffff;
            font-size: 68px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.45s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Timeline === */
        .timeline {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 40px;
        }

        .timeline-track {
            position: absolute;
            top: 63%;
            left: 160px;
            right: 160px;
            height: 3px;
            background: rgba(255,255,255,0.06);
            transform: translateY(-50%);
        }

        .timeline-track-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--cyan-700), var(--cyan-400));
            border-radius: 2px;
            animation: trackGrow 1.8s ease-out 0.8s forwards;
        }

        @keyframes trackGrow {
            to { width: 100%; }
        }

        .timeline-items {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 1400px;
            position: relative;
            z-index: 2;
        }

        .timeline-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 280px;
            opacity: 0;
        }

        .timeline-item:nth-child(1) { animation: fadeUp 0.8s ease-out 1.0s forwards; }
        .timeline-item:nth-child(2) { animation: fadeUp 0.8s ease-out 1.4s forwards; }
        .timeline-item:nth-child(3) { animation: fadeUp 0.8s ease-out 1.8s forwards; }
        .timeline-item:nth-child(4) { animation: fadeUp 0.8s ease-out 2.2s forwards; }

        .timeline-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--dark-bg);
            border: 3px solid var(--cyan-400);
            margin-bottom: 24px;
            position: relative;
            z-index: 3;
        }

        .timeline-dot::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(34,211,238,0.1);
        }

        .timeline-year {
            font-size: 18px;
            font-weight: 800;
            color: var(--cyan-400);
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .timeline-card {
            border-radius: 16px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(6,182,212,0.15);
            backdrop-filter: blur(8px);
            padding: 24px;
            text-align: center;
            width: 100%;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timeline-card-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(34,211,238,0.1);
            color: var(--cyan-400);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 14px;
        }

        .timeline-card h3 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .timeline-card p {
            font-size: 18px;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .timeline-card p strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* === Bottom quote === */
        .bottom-quote {
            text-align: center;
            margin-top: 40px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 2.6s forwards;
        }

        .bottom-quote p {
            font-size: 22px;
            font-weight: 300;
            color: var(--text-muted);
            font-style: italic;
        }

        .bottom-quote p strong {
            color: var(--cyan-400);
            font-weight: 600;
            font-style: normal;
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">
                <div class="eyebrow">
                    <i class="ti ti-history"></i>
                    Geneza
                </div>
                <h1 class="title">Skąd się wzięły <span class="highlight">mikroserwisy</span>?</h1>
            </div>

            <div class="timeline">
                <div class="timeline-track">
                    <div class="timeline-track-fill"></div>
                </div>

                <div class="timeline-items">
                    <div class="timeline-item">
                        <div class="timeline-card">
                            <div class="timeline-card-icon">
                                <i class="ti ti-book"></i>
                            </div>
                            <h3>DDD & BC</h3>
                            <p>Eric Evans publikuje <strong>Domain-Driven Design</strong></p>
                        </div>
                        <div class="timeline-dot"></div>
                        <div class="timeline-year">2003</div>
                    </div>

                    <div class="timeline-item">
                        <div class="timeline-card">
                            <div class="timeline-card-icon">
                                <i class="ti ti-building"></i>
                            </div>
                            <h3>Netflix & Amazon</h3>
                            <p>Jednoczesna praca<strong> tysiący inżynierów</strong></p>
                        </div>
                        <div class="timeline-dot"></div>
                        <div class="timeline-year">~2009</div>
                    </div>

                    <div class="timeline-item">
                        <div class="timeline-card">
                            <div class="timeline-card-icon">
                                <i class="ti ti-file-text"></i>
                            </div>
                            <h3>Fowler & Lewis</h3>
                            <p><strong>Nazywają i opisują</strong> to jako styl architektoniczny</p>
                        </div>
                        <div class="timeline-dot"></div>
                        <div class="timeline-year">2014</div>
                    </div>

                    <div class="timeline-item">
                        <div class="timeline-card">
                            <div class="timeline-card-icon">
                                <i class="ti ti-world"></i>
                            </div>
                            <h3>Mainstream</h3>
                            <p>Styl przyjmowany <strong>masowo</strong></p>
                        </div>
                        <div class="timeline-dot"></div>
                        <div class="timeline-year">2015+</div>
                    </div>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
