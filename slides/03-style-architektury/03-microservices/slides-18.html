<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 18 - Pułapka #2: Złożoność rozproszona</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --red: #ef4444;
            --rose: #f43f5e;
            --orange: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 750px;
            height: 750px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245,158,11,0.07) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 18%; left: 12%; animation-delay: 0.5s; }
        .particle:nth-child(4) { top: 72%; left: 88%; animation-delay: 2.1s; }
        .particle:nth-child(5) { top: 28%; left: 72%; animation-delay: 3.4s; }
        .particle:nth-child(6) { top: 82%; left: 22%; animation-delay: 4.8s; }
        .particle:nth-child(7) { top: 42%; left: 45%; animation-delay: 5.9s; }
        .particle:nth-child(8) { top: 15%; left: 55%; animation-delay: 1.6s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 76px 130px 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            color: var(--orange);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i { font-size: 32px; }

        .title {
            font-size: 72px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-top: 16px;
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.45s forwards;
        }

        .hl-orange { color: var(--orange); }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Hasło === */
        .motto {
            max-width: 960px;
            margin-top: 24px;
            font-size: 1.15rem;
            font-weight: 300;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.65s forwards;
        }

        .motto strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* === Comparison === */
        .comparison {
            display: grid;
            grid-template-columns: 1fr 60px 1fr;
            gap: 0;
            align-items: start;
            margin-top: 40px;
            width: 100%;
            max-width: 1240px;
        }

        .col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .col-label {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 4px;
        }

        /* Monolit side */
        .mono-col {
            opacity: 0;
            animation: slideFromLeft 0.8s ease-out 0.9s forwards;
        }

        .mono-diagram {
            position: relative;
            width: 380px;
            height: 280px;
        }

        .mono-app {
            position: absolute;
            top: 20px;
            left: 60px;
            width: 260px;
            height: 140px;
            border-radius: 16px;
            background: rgba(17,24,39,0.8);
            border: 1px solid rgba(6,182,212,0.2);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mono-app i {
            font-size: 28px;
            color: var(--cyan-400);
        }

        .mono-app span {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .mono-modules {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .mono-mod {
            width: 50px;
            height: 20px;
            border-radius: 4px;
            background: rgba(6,182,212,0.12);
            border: 1px solid rgba(6,182,212,0.2);
        }

        .mono-db {
            position: absolute;
            bottom: 10px;
            left: 120px;
            width: 140px;
            height: 56px;
            border-radius: 12px;
            background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .mono-db i {
            font-size: 22px;
            color: #10b981;
        }

        .mono-db span {
            font-size: 0.75rem;
            font-weight: 600;
            color: #10b981;
        }

        .mono-arrow {
            position: absolute;
            top: 162px;
            left: 190px;
            font-size: 20px;
            color: rgba(16,185,129,0.5);
        }

        .mono-tx-label {
            position: absolute;
            top: 170px;
            left: 222px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #10b981;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Divider */
        .divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 340px;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 1.1s forwards;
        }

        .divider-line {
            width: 2px;
            flex: 1;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.12), transparent);
        }

        .divider-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--orange);
            font-size: 18px;
            font-weight: 800;
            margin: 12px 0;
        }

        /* Mikroserwisy side */
        .micro-col {
            opacity: 0;
            animation: slideFromRight 0.8s ease-out 0.9s forwards;
        }

        .micro-diagram {
            position: relative;
            width: 420px;
            height: 280px;
        }

        .micro-svc {
            position: absolute;
            width: 90px;
            height: 54px;
            border-radius: 10px;
            background: rgba(17,24,39,0.8);
            border: 1px solid rgba(245,158,11,0.25);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            z-index: 2;
        }

        .micro-svc i {
            font-size: 16px;
            color: var(--orange);
        }

        .micro-svc span {
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .micro-svc-1 { top: 0; left: 165px; }
        .micro-svc-2 { top: 90px; left: 30px; }
        .micro-svc-3 { top: 90px; left: 300px; }
        .micro-svc-4 { top: 180px; left: 165px; }

        .micro-db {
            position: absolute;
            width: 56px;
            height: 32px;
            border-radius: 6px;
            background: rgba(245,158,11,0.06);
            border: 1px solid rgba(245,158,11,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .micro-db i {
            font-size: 14px;
            color: rgba(245,158,11,0.6);
        }

        .micro-db-1 { top: 6px; left: 272px; }
        .micro-db-2 { top: 96px; left: 135px; }
        .micro-db-3 { top: 96px; right: -12px; }
        .micro-db-4 { top: 186px; left: 272px; }

        .micro-diagram svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .net-line {
            stroke: rgba(245,158,11,0.3);
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 6 4;
            stroke-dashoffset: 500;
            animation: drawNet 1.5s ease-out forwards;
        }

        .net-line:nth-child(1) { animation-delay: 1.3s; }
        .net-line:nth-child(2) { animation-delay: 1.5s; }
        .net-line:nth-child(3) { animation-delay: 1.7s; }
        .net-line:nth-child(4) { animation-delay: 1.9s; }
        .net-line:nth-child(5) { animation-delay: 2.1s; }
        .net-line:nth-child(6) { animation-delay: 2.3s; }

        @keyframes drawNet {
            to { stroke-dashoffset: 0; }
        }

        .net-label {
            font-size: 8px;
            font-weight: 700;
            fill: rgba(245,158,11,0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 2.6s forwards;
        }

        /* === Bottom: 4 concepts === */
        .concepts {
            display: flex;
            gap: 24px;
            margin-top: 36px;
            max-width: 1240px;
        }

        .concept {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 22px;
            border-radius: 14px;
            background: rgba(17,24,39,0.65);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(6px);
            opacity: 0;
        }

        .concept:nth-child(1) { animation: bounceIn 0.7s ease-out 1.8s forwards; }
        .concept:nth-child(2) { animation: bounceIn 0.7s ease-out 2.0s forwards; }
        .concept:nth-child(3) { animation: bounceIn 0.7s ease-out 2.2s forwards; }
        .concept:nth-child(4) { animation: bounceIn 0.7s ease-out 2.4s forwards; }

        .concept i {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(245,158,11,0.1);
            color: var(--orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .concept-text {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .concept-text strong {
            color: var(--text-main);
            font-weight: 700;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            60% { opacity: 1; transform: translateY(-6px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="eyebrow">
                <i class="ti ti-alert-triangle"></i>
                Pułapka #2
            </div>

            <div class="title"><span class="hl-orange">Złożoność rozproszona</span></div>

            <div class="motto">
                Mikroserwisy nie eliminują złożoności. Przenoszą ją <strong>z kodu do sieci</strong>.
            </div>

            <!-- Comparison: Monolit vs Mikroserwisy -->
            <div class="comparison">
                <!-- Left: Monolit -->
                <div class="col mono-col">
                    <div class="col-label">Monolit</div>
                    <div class="mono-diagram">
                        <div class="mono-app">
                            <i class="ti ti-server-bolt"></i>
                            <span>Aplikacja</span>
                            <div class="mono-modules">
                                <div class="mono-mod"></div>
                                <div class="mono-mod"></div>
                                <div class="mono-mod"></div>
                                <div class="mono-mod"></div>
                            </div>
                        </div>
                        <div class="mono-arrow">↓</div>
                        <div class="mono-tx-label">1 transakcja</div>
                        <div class="mono-db">
                            <i class="ti ti-database"></i>
                            <span>1 baza</span>
                        </div>
                    </div>
                </div>

                <!-- Divider -->
                <div class="divider">
                    <div class="divider-line"></div>
                    <div class="divider-icon">vs</div>
                    <div class="divider-line"></div>
                </div>

                <!-- Right: Mikroserwisy -->
                <div class="col micro-col">
                    <div class="col-label">Mikroserwisy</div>
                    <div class="micro-diagram">
                        <svg viewBox="0 0 420 280">
                            <!-- Network connections between services -->
                            <line class="net-line" x1="210" y1="54" x2="75" y2="90" />
                            <line class="net-line" x1="210" y1="54" x2="345" y2="90" />
                            <line class="net-line" x1="75" y1="144" x2="210" y2="180" />
                            <line class="net-line" x1="345" y1="144" x2="210" y2="180" />
                            <line class="net-line" x1="75" y1="117" x2="345" y2="117" />
                            <line class="net-line" x1="210" y1="54" x2="210" y2="180" />

                            <!-- Labels -->
                            <text class="net-label" x="128" y="68">HTTP</text>
                            <text class="net-label" x="272" y="68">gRPC</text>
                            <text class="net-label" x="192" y="110">Kafka</text>
                            <text class="net-label" x="120" y="170">retry</text>
                            <text class="net-label" x="292" y="170">timeout</text>
                        </svg>

                        <div class="micro-svc micro-svc-1">
                            <i class="ti ti-server-bolt"></i>
                            <span>Zamówienia</span>
                        </div>
                        <div class="micro-svc micro-svc-2">
                            <i class="ti ti-server-bolt"></i>
                            <span>Płatności</span>
                        </div>
                        <div class="micro-svc micro-svc-3">
                            <i class="ti ti-server-bolt"></i>
                            <span>Katalog</span>
                        </div>
                        <div class="micro-svc micro-svc-4">
                            <i class="ti ti-server-bolt"></i>
                            <span>Dostawy</span>
                        </div>

                        <div class="micro-db micro-db-1">
                            <i class="ti ti-database"></i>
                        </div>
                        <div class="micro-db micro-db-2">
                            <i class="ti ti-database"></i>
                        </div>
                        <div class="micro-db micro-db-3">
                            <i class="ti ti-database"></i>
                        </div>
                        <div class="micro-db micro-db-4">
                            <i class="ti ti-database"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom: 4 things you must handle -->
            <div class="concepts">
                <div class="concept">
                    <i class="ti ti-arrows-split"></i>
                    <div class="concept-text"><strong>Distributed</strong><br>transactions</div>
                </div>
                <div class="concept">
                    <i class="ti ti-clock"></i>
                    <div class="concept-text"><strong>Timeouty</strong><br>i retries</div>
                </div>
                <div class="concept">
                    <i class="ti ti-shield-off"></i>
                    <div class="concept-text"><strong>Circuit</strong><br>breakery</div>
                </div>
                <div class="concept">
                    <i class="ti ti-refresh"></i>
                    <div class="concept-text"><strong>Eventual</strong><br>consistency</div>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
