<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 12 - Zaleta #1: Niezależne wdrożenie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green: #10b981;
            --orange: #f59e0b;
            --rose: #f43f5e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 60px;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 750px;
            height: 750px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.10) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 10%; left: 18%; animation-delay: 0.2s; }
        .particle:nth-child(4) { top: 68%; left: 78%; animation-delay: 2.0s; }
        .particle:nth-child(5) { top: 35%; left: 72%; animation-delay: 3.4s; }
        .particle:nth-child(6) { top: 82%; left: 15%; animation-delay: 4.8s; }
        .particle:nth-child(7) { top: 48%; left: 55%; animation-delay: 6.2s; }
        .particle:nth-child(8) { top: 22%; left: 38%; animation-delay: 1.6s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 0 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
        }

        .left {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i { font-size: 32px; }

        .title {
            font-size: 72px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.45s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .points {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 8px;
        }

        .point {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 20px 26px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            background: rgba(17,24,39,0.62);
            color: var(--text-muted);
            font-size: 28px;
            font-weight: 400;
            backdrop-filter: blur(6px);
            opacity: 0;
        }

        .point:nth-child(1) { animation: fadeUp 0.7s ease-out 0.7s forwards; }
        .point:nth-child(2) { animation: fadeUp 0.7s ease-out 0.95s forwards; }
        .point:nth-child(3) { animation: fadeUp 0.7s ease-out 1.2s forwards; }

        .point i {
            flex: 0 0 auto;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .point:nth-child(1) i {
            background: rgba(244,63,94,0.12);
            color: var(--rose);
        }

        .point:nth-child(2) i {
            background: rgba(16,185,129,0.12);
            color: var(--green);
        }

        .point:nth-child(3) i {
            background: rgba(34,211,238,0.12);
            color: var(--cyan-400);
        }

        .point strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* === Diagram === */
        .diagram {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 60px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.6s forwards;
        }

        .diagram-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .diagram-label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #475569;
        }

        .monolith-box {
            width: 520px;
            height: 130px;
            border-radius: 16px;
            border: 2px solid rgba(244,63,94,0.3);
            background: rgba(244,63,94,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            position: relative;
        }

        .monolith-box .team {
            width: 90px;
            height: 80px;
            border-radius: 10px;
            background: rgba(244,63,94,0.12);
            border: 1px solid rgba(244,63,94,0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .monolith-box .team i {
            font-size: 20px;
            color: var(--rose);
        }

        .monolith-deploy {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--rose);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .monolith-deploy i { font-size: 20px; }

        .arrow-down {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            font-size: 28px;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 1.0s forwards;
        }

        .vs-label {
            font-size: 1.2rem;
            font-weight: 800;
            color: #475569;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 1.0s forwards;
            flex-shrink: 0;
        }

        .micro-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .micro-service {
            width: 100px;
            height: 100px;
            border-radius: 14px;
            border: 1px solid rgba(16,185,129,0.3);
            background: rgba(16,185,129,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
            position: relative;
        }

        .micro-service i {
            font-size: 22px;
            color: var(--green);
        }

        .micro-service .deploy-arrow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--green);
            font-size: 16px;
            opacity: 0;
            animation: deployPulse 2.5s ease-in-out infinite;
        }

        .micro-service:nth-child(1) .deploy-arrow { animation-delay: 0.3s; }
        .micro-service:nth-child(2) .deploy-arrow { animation-delay: 1.1s; }
        .micro-service:nth-child(3) .deploy-arrow { animation-delay: 0.7s; }
        .micro-service:nth-child(4) .deploy-arrow { animation-delay: 1.8s; }
        .micro-service:nth-child(5) .deploy-arrow { animation-delay: 0.0s; }

        @keyframes deployPulse {
            0% { opacity: 0; transform: translateX(-50%) translateY(6px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            40% { opacity: 1; transform: translateX(-50%) translateY(0); }
            60% { opacity: 0; transform: translateX(-50%) translateY(-8px); }
            100% { opacity: 0; transform: translateX(-50%) translateY(6px); }
        }

        .micro-deploy {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--green);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .micro-deploy i { font-size: 20px; }

        /* === Conclusion === */
        .conclusion {
            position: absolute;
            bottom: 340px;
            left: 170px;
            right: 560px;
            z-index: 10;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.5s forwards;
        }

        .conclusion-box {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 22px 30px;
            border-radius: 16px;
            background: rgba(6,182,212,0.06);
            border: 1px solid rgba(6,182,212,0.2);
        }

        .conclusion-box i {
            font-size: 28px;
            color: var(--cyan-400);
            flex-shrink: 0;
        }

        .conclusion-text {
            font-size: 1.05rem;
            font-weight: 300;
            color: var(--text-muted);
            font-style: italic;
            line-height: 1.5;
        }

        .conclusion-text strong {
            color: var(--cyan-400);
            font-weight: 800;
            font-style: normal;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
                <div class="title">Niezależne <span class="highlight">wdrożenie</span></div>

            <div class="diagram">
                <div class="diagram-section">
                    <div class="diagram-label">Modularny monolit</div>
                    <div class="monolith-box">
                        <div class="team"><i class="ti ti-users"></i>Zespół A</div>
                        <div class="team"><i class="ti ti-users"></i>Zespół B</div>
                        <div class="team"><i class="ti ti-users"></i>Zespół C</div>
                        <div class="team"><i class="ti ti-users"></i>Zespół D</div>
                        <div class="team"><i class="ti ti-users"></i>Zespół E</div>
                    </div>
                    <div class="monolith-deploy">
                        <i class="ti ti-arrow-narrow-down"></i>
                        1 wspólny deploy
                    </div>
                </div>

                <div class="vs-label">VS</div>

                <div class="diagram-section">
                    <div class="diagram-label">Mikroserwisy</div>
                    <div class="micro-row">
                        <div class="micro-service">
                            <div class="deploy-arrow"><i class="ti ti-arrow-narrow-down"></i></div>
                            <i class="ti ti-users"></i>
                            Zespół A
                        </div>
                        <div class="micro-service">
                            <div class="deploy-arrow"><i class="ti ti-arrow-narrow-down"></i></div>
                            <i class="ti ti-users"></i>
                            Zespół B
                        </div>
                        <div class="micro-service">
                            <div class="deploy-arrow"><i class="ti ti-arrow-narrow-down"></i></div>
                            <i class="ti ti-users"></i>
                            Zespół C
                        </div>
                        <div class="micro-service">
                            <div class="deploy-arrow"><i class="ti ti-arrow-narrow-down"></i></div>
                            <i class="ti ti-users"></i>
                            Zespół D
                        </div>
                        <div class="micro-service">
                            <div class="deploy-arrow"><i class="ti ti-arrow-narrow-down"></i></div>
                            <i class="ti ti-users"></i>
                            Zespół E
                        </div>
                    </div>
                    <div class="micro-deploy">
                        <i class="ti ti-check"></i>
                        Każdy deployuje niezależnie
                    </div>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
