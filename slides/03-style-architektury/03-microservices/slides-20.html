<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 20 - Kiedy warto rozmawiać o mikroserwisach?</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --emerald: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 18%; left: 12%; animation-delay: 0.5s; }
        .particle:nth-child(4) { top: 72%; left: 88%; animation-delay: 2.0s; }
        .particle:nth-child(5) { top: 28%; left: 72%; animation-delay: 3.5s; }
        .particle:nth-child(6) { top: 82%; left: 18%; animation-delay: 4.8s; }
        .particle:nth-child(7) { top: 45%; left: 55%; animation-delay: 6.2s; }
        .particle:nth-child(8) { top: 15%; left: 58%; animation-delay: 1.6s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 76px 130px 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            color: var(--emerald);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i { font-size: 32px; }

        .title {
            font-size: 72px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-top: 16px;
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.45s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 300;
            color: var(--text-muted);
            margin-top: 10px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.6s forwards;
        }

        /* === Checklist === */
        .checklist {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 44px;
            width: 100%;
            max-width: 1050px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 22px 30px;
            border-radius: 16px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(16,185,129,0.12);
            backdrop-filter: blur(8px);
            opacity: 0;
            animation: slideFromLeft 0.7s ease-out forwards;
        }

        .check-item:nth-child(1) { animation-delay: 0.8s; }
        .check-item:nth-child(2) { animation-delay: 1.0s; }
        .check-item:nth-child(3) { animation-delay: 1.2s; }
        .check-item:nth-child(4) { animation-delay: 1.4s; }
        .check-item:nth-child(5) { animation-delay: 1.6s; }

        .check-icon {
            flex: 0 0 auto;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--emerald);
            font-size: 24px;
        }

        .check-text {
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .check-text strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .check-text em {
            color: var(--emerald);
            font-style: italic;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="title">Kiedy warto rozmawiać o <span class="highlight">mikroserwisach</span>?</div>

            <div class="checklist">
                <div class="check-item">
                    <div class="check-icon"><i class="ti ti-check"></i></div>
                    <div class="check-text"><strong>Wiele zespołów się wzajemnie blokuje</strong></div>
                </div>

                <div class="check-item">
                    <div class="check-icon"><i class="ti ti-check"></i></div>
                    <div class="check-text"><strong>Deploy raz na miesiąc, okienka serwisowe, spotkania koordynacyjne</strong></div>
                </div>

                <div class="check-item">
                    <div class="check-icon"><i class="ti ti-check"></i></div>
                    <div class="check-text"><strong>Aplikacja zarabia, ma użytkowników, ma ruch</strong></div>
                </div>

                <div class="check-item">
                    <div class="check-icon"><i class="ti ti-check"></i></div>
                    <div class="check-text"><strong>Wysoka dostępność = wymaganie</strong></div>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
