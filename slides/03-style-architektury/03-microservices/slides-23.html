<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 23 - Strangler Fig — wprowadzenie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --emerald: #10b981;
            --emerald-dim: rgba(16,185,129,0.12);
            --amber: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16,185,129,0.07) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 22%; left: 8%; animation-delay: 0.3s; }
        .particle:nth-child(4) { top: 68%; left: 82%; animation-delay: 1.8s; }
        .particle:nth-child(5) { top: 35%; left: 78%; animation-delay: 3.2s; }
        .particle:nth-child(6) { top: 78%; left: 14%; animation-delay: 5.0s; }
        .particle:nth-child(7) { top: 48%; left: 55%; animation-delay: 6.5s; }
        .particle:nth-child(8) { top: 12%; left: 62%; animation-delay: 2.3s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 80px 130px 150px;
        }

        .header {
            text-align: center;
            max-width: 1180px;
            margin: 0 auto 40px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            color: var(--emerald);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .title {
            font-size: 72px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-top: 16px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hl-emerald {
            color: var(--emerald);
            font-weight: 600;
        }

        /* === Two-column layout === */
        .main-area {
            display: grid;
            grid-template-columns: 1fr 2fr;
            align-items: center;
            gap: 80px;
            max-width: 1660px;
            margin: 0 auto;
        }

        /* === Left: steps === */
        .steps {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 22px 28px;
            border-radius: 18px;
            background: rgba(17,24,39,0.62);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(6px);
            opacity: 0;
            animation: slideFromLeft 0.8s ease-out forwards;
        }

        .step:nth-child(1) { animation-delay: 0.7s; }
        .step:nth-child(2) { animation-delay: 0.9s; }
        .step:nth-child(3) { animation-delay: 1.1s; }
        .step:nth-child(4) { animation-delay: 1.3s; }

        .step-num {
            flex: 0 0 auto;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: var(--dark-bg);
            background: linear-gradient(135deg, var(--emerald), #059669);
            box-shadow: 0 0 18px rgba(16,185,129,0.25);
        }

        .step-text {
            font-size: 26px;
            font-weight: 400;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .step-text strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* === Analogy bar === */
        .analogy {
            margin-top: 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 28px;
            border-radius: 16px;
            background: rgba(6,182,212,0.06);
            border: 1px solid rgba(6,182,212,0.2);
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.6s forwards;
        }

        .analogy i {
            font-size: 28px;
            color: var(--cyan-400);
        }

        .analogy-text {
            font-size: 24px;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.45;
        }

        .analogy-text strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* === Right: SVG illustration === */
        .illustration {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: scaleIn 1s ease-out 0.6s forwards;
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.3); }
            60% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">
                <div class="title"><span class="highlight">Strangler Fig</span> - Figowiec dusicielski</div>
            </div>

            <div class="main-area">
                <div class="left-col">
                    <div class="steps">
                        <div class="step">
                            <div class="step-num">1</div>
                            <div class="step-text"><strong>Kiełkuje</strong> w koronie innego drzewa</div>
                        </div>
                        <div class="step">
                            <div class="step-num">2</div>
                            <div class="step-text"><strong>Obrasta</strong> je powoli od zewnątrz</div>
                        </div>
                        <div class="step">
                            <div class="step-num">3</div>
                            <div class="step-text"><strong>Zapuszcza korzenie</strong> w dół</div>
                        </div>
                        <div class="step">
                            <div class="step-num">4</div>
                            <div class="step-text">Stopniowo <strong>zastępuje</strong> gospodarza</div>
                        </div>
                    </div>
                    
                </div>

                <div class="illustration">
                    <img src="iamges/strangler-fig.png" alt="Strangler Fig — etapy oplatania drzewa gospodarza" style="max-width: 100%; max-height: 620px; width: auto; height: auto; border-radius: 18px;">
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
