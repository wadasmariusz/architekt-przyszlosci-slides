<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 09 - Koszt koordynacji</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 18%; left: 14%; animation-delay: 0.5s; }
        .particle:nth-child(4) { top: 65%; left: 82%; animation-delay: 2.0s; }
        .particle:nth-child(5) { top: 35%; left: 68%; animation-delay: 3.5s; }
        .particle:nth-child(6) { top: 82%; left: 22%; animation-delay: 5.0s; }
        .particle:nth-child(7) { top: 48%; left: 44%; animation-delay: 6.5s; }
        .particle:nth-child(8) { top: 22%; left: 55%; animation-delay: 1.2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 80px 130px 150px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            color: #f43f5e;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i { font-size: 32px; }

        .title {
            font-size: 72px;
            font-weight: 800;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.45s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Timeline === */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 0;
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            padding-left: 60px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 24px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, rgba(244,63,94,0.4) 0%, rgba(239,68,68,0.6) 100%);
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.7s forwards;
        }

        .timeline-item {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 16px 28px;
            border-radius: 16px;
            background: rgba(17,24,39,0.6);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(6px);
            margin-bottom: 16px;
            position: relative;
            opacity: 0;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -48px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #f43f5e;
            background: var(--dark-bg);
        }

        .timeline-item:nth-child(1) { animation: slideFromLeft 0.7s ease-out 0.9s forwards; }
        .timeline-item:nth-child(2) { animation: slideFromLeft 0.7s ease-out 1.2s forwards; }
        .timeline-item:nth-child(3) { animation: slideFromLeft 0.7s ease-out 1.5s forwards; }

        .timeline-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .timeline-item:nth-child(1) .timeline-icon {
            background: rgba(245,158,11,0.12);
            color: #f59e0b;
        }

        .timeline-item:nth-child(2) .timeline-icon {
            background: rgba(239,68,68,0.12);
            color: #ef4444;
        }

        .timeline-item:nth-child(3) .timeline-icon {
            background: rgba(139,92,246,0.12);
            color: #8b5cf6;
        }

        .timeline-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timeline-label {
            font-size: 26px;
            font-weight: 600;
            color: var(--text-main);
        }

        .timeline-desc {
            font-size: 20px;
            font-weight: 300;
            color: var(--text-muted);
        }

        .timeline-waiting {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 14px;
            border-radius: 8px;
            background: rgba(245,158,11,0.08);
            border: 1px solid rgba(245,158,11,0.2);
            font-size: 16px;
            font-weight: 600;
            color: #f59e0b;
            margin-left: auto;
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* === Effect box === */
        .effect {
            max-width: 1100px;
            margin: 12px auto 0;
            padding-left: 60px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 2.0s forwards;
        }

        .effect-box {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 24px 36px;
            border-radius: 16px;
            background: rgba(239,68,68,0.05);
            border: 1px solid rgba(239,68,68,0.2);
        }

        .effect-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(239,68,68,0.12);
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .effect-text {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-main);
        }

        .effect-text strong {
            color: #ef4444;
            font-weight: 800;
        }

        .effect-text .dim {
            color: var(--text-muted);
            font-weight: 300;
            font-size: 24px;
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">
                <div class="title">Koszt <span class="highlight">koordynacji</span></div>
            </div>

            <!-- Timeline -->
            <div class="timeline">
                <div class="timeline-item">
                    <div class="timeline-icon"><i class="ti ti-clock-pause"></i></div>
                    <div class="timeline-text">
                        <span class="timeline-label">Zespół A skończył funkcję</span>
                    </div>
                    <div class="timeline-waiting"><i class="ti ti-hourglass"></i> czekam na B...</div>
                </div>

                <div class="timeline-item">
                    <div class="timeline-icon"><i class="ti ti-urgent"></i></div>
                    <div class="timeline-text">
                        <span class="timeline-label">Zespół C ma pilny bugfix</span>
                    </div>
                    <div class="timeline-waiting"><i class="ti ti-hourglass"></i> okienko za 3 tyg.</div>
                </div>

                <div class="timeline-item">
                    <div class="timeline-icon"><i class="ti ti-users-group"></i></div>
                    <div class="timeline-text">
                        <span class="timeline-label">Spotkanie koordynacyjne</span>
                    </div>
                    <div class="timeline-waiting"><i class="ti ti-hourglass"></i> koordynacja...</div>
                </div>
            </div>

            <!-- Effect -->
            <div class="effect">
                <div class="effect-box">
                    <div class="effect-icon"><i class="ti ti-alert-triangle"></i></div>
                    <div class="effect-text">
                        Deploy <strong>raz na kilka tygodni</strong> ...
                    </div>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
