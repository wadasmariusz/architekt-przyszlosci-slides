<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 29 - Wnioski</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --emerald: #10b981;
            --amber: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 14%; left: 8%; animation-delay: 0.3s; }
        .particle:nth-child(4) { top: 68%; left: 90%; animation-delay: 1.8s; }
        .particle:nth-child(5) { top: 32%; left: 78%; animation-delay: 3.2s; }
        .particle:nth-child(6) { top: 78%; left: 18%; animation-delay: 5.0s; }
        .particle:nth-child(7) { top: 52%; left: 48%; animation-delay: 6.2s; }
        .particle:nth-child(8) { top: 22%; left: 64%; animation-delay: 2.4s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 1200px;
            padding: 0 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        /* === Statement block === */
        .statement {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.6s forwards;
        }

        .statement-line {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.3;
            color: var(--text-main);
        }

        .statement-line.bold-accent {
            font-size: 54px;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .highlight-amber {
            background: linear-gradient(135deg, var(--amber), #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .statement-sub {
            font-size: 32px;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* === Divider === */
        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--cyan-400), var(--cyan-600));
            border-radius: 2px;
            margin: 40px 0;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 1.2s forwards;
        }

        /* === Call to action === */
        .cta {
            display: flex;
            gap: 32px;
            margin-top: 0;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.5s forwards;
        }

        .cta-step {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 28px;
            border-radius: 16px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(6,182,212,0.15);
            backdrop-filter: blur(8px);
            transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        .cta-step:hover {
            border-color: var(--cyan-500);
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(6,182,212,0.12);
        }

        .cta-num {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--dark-bg);
            flex-shrink: 0;
        }

        .cta-step:nth-child(1) .cta-num {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            box-shadow: 0 0 16px rgba(34,211,238,0.3);
        }

        .cta-step:nth-child(2) .cta-num {
            background: linear-gradient(135deg, var(--amber), #d97706);
            box-shadow: 0 0 16px rgba(245,158,11,0.3);
        }

        .cta-step:nth-child(3) .cta-num {
            background: linear-gradient(135deg, var(--emerald), #059669);
            box-shadow: 0 0 16px rgba(16,185,129,0.3);
        }

        .cta-text {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="eyebrow"><i class="ti ti-flag"></i> Wnioski</div>

            <div class="statement">
                <div class="statement-line bold-accent"><span class="highlight-amber">Mikroserwisy są kosztowne.</span></div>
                <div class="statement-sub">Bierzesz je, gdy masz <strong style="color: var(--text-main); font-weight: 600;">mocne argumenty</strong>.</div>
                <div class="statement-sub">Gdy masz — nie zatrzymuj developmentu. Użyj <span class="highlight" style="font-weight: 600;">Strangler Fig</span>.</div>
            </div>

            <div class="divider"></div>

            <div class="cta">
                <div class="cta-step">
                    <div class="cta-num">1</div>
                    <div class="cta-text">Zacznij od jednego serwisu</div>
                </div>
                <div class="cta-step">
                    <div class="cta-num">2</div>
                    <div class="cta-text">Udowodnij podejście</div>
                </div>
                <div class="cta-step">
                    <div class="cta-num">3</div>
                    <div class="cta-text">Potem skaluj</div>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
