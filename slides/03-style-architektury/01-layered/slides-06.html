<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 06 - Jak wygląda projekt w architekturze warstwowej?</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 65%);
            top: 50%;
            left: 30%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 12%; left: 20%; animation-delay: 0s; }
        .particle:nth-child(4) { top: 72%; left: 80%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 22%; left: 72%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 82%; left: 14%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 55%; left: 46%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 18%; left: 56%; animation-delay: 2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Layout === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 60px 80px 160px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
            color: var(--cyan-400);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i { font-size: 28px; }

        h1 {
            font-size: 50px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
            color: #ffffff;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.4s forwards;
        }

        h1 .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Two-column layout === */
        .columns {
            display: flex;
            gap: 80px;
            flex: 1;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.5s forwards;
        }

        /* === Left: folder tree === */
        .tree-panel {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(6, 182, 212, 0.15);
            border-radius: 20px;
            padding: 40px 44px;
            backdrop-filter: blur(12px);
            min-width: 460px;
        }

        .tree-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 28px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        }

        .tree-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            font-weight: 500;
            opacity: 0;
        }

        .tree-item:nth-child(2) { animation: slideRight 0.5s ease-out 0.7s forwards; }
        .tree-item:nth-child(3) { animation: slideRight 0.5s ease-out 0.85s forwards; }
        .tree-item:nth-child(4) { animation: slideRight 0.5s ease-out 1.0s forwards; }
        .tree-item:nth-child(5) { animation: slideRight 0.5s ease-out 1.15s forwards; }
        .tree-item:nth-child(6) { animation: slideRight 0.5s ease-out 1.3s forwards; }

        .tree-item i {
            font-size: 24px;
            width: 32px;
            text-align: center;
        }

        .tree-item:nth-child(2) i { color: #818cf8; }
        .tree-item:nth-child(3) i { color: var(--cyan-400); }
        .tree-item:nth-child(4) i { color: #a78bfa; }
        .tree-item:nth-child(5) i { color: #fbbf24; }
        .tree-item:nth-child(6) i { color: #34d399; }

        .tree-item:nth-child(2) .folder-name { color: #818cf8; }
        .tree-item:nth-child(3) .folder-name { color: var(--cyan-400); }
        .tree-item:nth-child(4) .folder-name { color: #a78bfa; }
        .tree-item:nth-child(5) .folder-name { color: #fbbf24; }
        .tree-item:nth-child(6) .folder-name { color: #34d399; }

        .folder-name {
            font-weight: 500;
        }

        /* === Right: descriptions === */
        .desc-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 520px;
        }

        .desc-card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 22px 28px;
            border-radius: 16px;
            background: rgba(17, 24, 39, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.08);
            opacity: 0;
        }

        .desc-card:nth-child(1) { animation: slideLeft 0.5s ease-out 0.9s forwards; }
        .desc-card:nth-child(2) { animation: slideLeft 0.5s ease-out 1.05s forwards; }
        .desc-card:nth-child(3) { animation: slideLeft 0.5s ease-out 1.2s forwards; }
        .desc-card:nth-child(4) { animation: slideLeft 0.5s ease-out 1.35s forwards; }
        .desc-card:nth-child(5) { animation: slideLeft 0.5s ease-out 1.5s forwards; }

        .desc-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .desc-card:nth-child(1) .desc-dot { background: #818cf8; }
        .desc-card:nth-child(2) .desc-dot { background: var(--cyan-400); }
        .desc-card:nth-child(3) .desc-dot { background: #a78bfa; }
        .desc-card:nth-child(4) .desc-dot { background: #fbbf24; }
        .desc-card:nth-child(5) .desc-dot { background: #34d399; }

        .desc-text {
            font-size: 20px;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .desc-text strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* === Bottom note === */
        .bottom-note {
            margin-top: 40px;
            font-size: 22px;
            font-weight: 300;
            color: var(--text-muted);
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.7s forwards;
            border-top: 1px solid rgba(6,182,212,0.15);
            padding-top: 24px;
        }

        .bottom-note strong {
            color: var(--cyan-400);
            font-weight: 600;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideLeft {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">
                <h1>Jak wygląda projekt w <span class="highlight">architekturze warstwowej</span>?</h1>
            </div>

            <div class="columns">
                <!-- Left: folder tree -->
                <div class="tree-panel">
                    <div class="tree-title">src/</div>
                    <div class="tree-item">
                        <i class="ti ti-folder-filled"></i>
                        <span class="folder-name">controllers/</span>
                    </div>
                    <div class="tree-item">
                        <i class="ti ti-folder-filled"></i>
                        <span class="folder-name">services/</span>
                    </div>
                    <div class="tree-item">
                        <i class="ti ti-folder-filled"></i>
                        <span class="folder-name">repositories/</span>
                    </div>
                    <div class="tree-item">
                        <i class="ti ti-folder-filled"></i>
                        <span class="folder-name">models/</span>
                    </div>
                    <div class="tree-item">
                        <i class="ti ti-folder-filled"></i>
                        <span class="folder-name">infrastructure/</span>
                    </div>
                </div>
            </div>

            <div class="bottom-note">
                Projekt jest organizowany według <strong>odpowiedzialności technicznych</strong>.
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
