<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 01 - Architektura warstwowa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 900px;
            height: 900px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .accent {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.12;
            z-index: 0;
        }

        .accent--left {
            width: 480px;
            height: 480px;
            top: 12%;
            left: 5%;
            background: var(--cyan-400);
        }

        .accent--right {
            width: 380px;
            height: 380px;
            right: 10%;
            bottom: 12%;
            background: #8b5cf6;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(5) { top: 12%; left: 8%; animation-delay: 0s; }
        .particle:nth-child(6) { top: 68%; left: 88%; animation-delay: 1.5s; }
        .particle:nth-child(7) { top: 25%; left: 72%; animation-delay: 3s; }
        .particle:nth-child(8) { top: 78%; left: 18%; animation-delay: 4.5s; }
        .particle:nth-child(9) { top: 45%; left: 55%; animation-delay: 6s; }
        .particle:nth-child(10) { top: 18%; left: 58%; animation-delay: 2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 0 170px;
            display: grid;
            grid-template-columns: 1fr 560px;
            align-items: center;
            gap: 100px;
        }

        .copy {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i {
            font-size: 32px;
        }

        h1.title {
            max-width: 860px;
            margin-bottom: 36px;
            color: #ffffff;
            font-size: 82px;
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.45s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            max-width: 620px;
            color: var(--text-muted);
            font-size: clamp(1rem, 1.8vw, 1.35rem);
            font-weight: 300;
            line-height: 1.6;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.7s forwards;
        }

        /* === Layers diagram === */
        .layers-diagram {
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.3s forwards;
        }

        .layer {
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 32px 36px;
            border-radius: 18px;
            backdrop-filter: blur(8px);
            opacity: 0;
        }

        .layer:nth-child(1) {
            background: rgba(34,211,238,0.1);
            border: 1px solid rgba(34,211,238,0.3);
            animation: slideFromRight 0.7s ease-out 0.5s forwards;
        }

        .layer:nth-child(2) {
            background: rgba(139,92,246,0.1);
            border: 1px solid rgba(139,92,246,0.3);
            animation: slideFromRight 0.7s ease-out 0.75s forwards;
        }

        .layer:nth-child(3) {
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.3);
            animation: slideFromRight 0.7s ease-out 1.0s forwards;
        }

        .layer-icon {
            flex: 0 0 auto;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .layer:nth-child(1) .layer-icon {
            background: rgba(34,211,238,0.15);
            color: var(--cyan-400);
        }

        .layer:nth-child(2) .layer-icon {
            background: rgba(139,92,246,0.15);
            color: #8b5cf6;
        }

        .layer:nth-child(3) .layer-icon {
            background: rgba(245,158,11,0.15);
            color: #f59e0b;
        }

        .layer-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .layer-name {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.02em;
        }

        .layer-desc {
            font-size: 18px;
            font-weight: 300;
            color: var(--text-muted);
        }

        /* Arrows between layers */
        .layer-arrow {
            display: flex;
            justify-content: center;
            opacity: 0;
        }

        .layer-arrow:nth-of-type(2) {
            animation: fadeIn 0.5s ease-out 0.9s forwards;
        }

        .layer-arrow:nth-of-type(4) {
            animation: fadeIn 0.5s ease-out 1.15s forwards;
        }

        .layer-arrow i {
            font-size: 28px;
            color: rgba(148,163,184,0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="accent accent--left"></div>
        <div class="accent accent--right"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <main class="content">
            <section class="copy">
                <div class="eyebrow">
                    <i class="ti ti-stack-2"></i>
                    Style architektury
                </div>

                <h1 class="title">Architektura <span class="highlight">warstwowa</span></h1>

                <p class="subtitle">
                    Klasyczny sposób organizacji aplikacji według odpowiedzialności technicznych
                </p>
            </section>

            <section class="layers-diagram" aria-label="Diagram warstw">
                <div class="layer">
                    <div class="layer-icon"><i class="ti ti-device-desktop"></i></div>
                    <div class="layer-text">
                        <span class="layer-name">Prezentacja</span>
                        <span class="layer-desc">Interfejs użytkownika i API</span>
                    </div>
                </div>

                <div class="layer-arrow"><i class="ti ti-arrows-down"></i></div>

                <div class="layer">
                    <div class="layer-icon"><i class="ti ti-settings"></i></div>
                    <div class="layer-text">
                        <span class="layer-name">Logika biznesowa</span>
                        <span class="layer-desc">Reguły i przypadki użycia</span>
                    </div>
                </div>

                <div class="layer-arrow"><i class="ti ti-arrows-down"></i></div>

                <div class="layer">
                    <div class="layer-icon"><i class="ti ti-database"></i></div>
                    <div class="layer-text">
                        <span class="layer-name">Dostęp do danych</span>
                        <span class="layer-desc">Persystencja i odczyt</span>
                    </div>
                </div>
            </section>
        </main>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
