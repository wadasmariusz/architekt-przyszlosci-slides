<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 09 - Ograniczenia architektury warstwowej</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --rose-500: #f43f5e;
            --orange-500: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244,63,94,0.06) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 18%; left: 12%; animation-delay: 0.5s; }
        .particle:nth-child(4) { top: 65%; left: 88%; animation-delay: 2s; }
        .particle:nth-child(5) { top: 28%; left: 78%; animation-delay: 3.5s; }
        .particle:nth-child(6) { top: 78%; left: 22%; animation-delay: 5s; }
        .particle:nth-child(7) { top: 48%; left: 42%; animation-delay: 6.5s; }
        .particle:nth-child(8) { top: 14%; left: 55%; animation-delay: 1s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Layout === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 70px 130px 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            max-width: 1180px;
            margin: 0 auto 50px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            color: var(--rose-500);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i { font-size: 32px; }

        h1 {
            font-size: 50px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
            color: #ffffff;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.4s forwards;
        }

        h1 .highlight {
            background: linear-gradient(135deg, var(--rose-500), var(--orange-500));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Limitation items === */
        .limitations {
            display: flex;
            flex-direction: column;
            gap: 22px;
            max-width: 1100px;
            width: 100%;
        }

        .limit-item {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 26px 32px;
            border-radius: 16px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(244,63,94,0.12);
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: border-color 0.3s, background 0.3s, transform 0.3s;
        }

        .limit-item:hover {
            border-color: var(--rose-500);
            background: rgba(244,63,94,0.05);
            transform: translateX(8px);
        }

        .limit-item:nth-child(1) { animation: slideFromLeft 0.7s ease-out 0.5s forwards; }
        .limit-item:nth-child(2) { animation: slideFromLeft 0.7s ease-out 0.7s forwards; }
        .limit-item:nth-child(3) { animation: slideFromLeft 0.7s ease-out 0.9s forwards; }
        .limit-item:nth-child(4) { animation: slideFromLeft 0.7s ease-out 1.1s forwards; }
        .limit-item:nth-child(5) { animation: slideFromLeft 0.7s ease-out 1.3s forwards; }

        .limit-icon {
            flex: 0 0 auto;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            background: rgba(244,63,94,0.08);
            border: 1.5px solid rgba(244,63,94,0.2);
            color: var(--rose-500);
        }

        .limit-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .limit-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .limit-desc {
            font-size: 16px;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .limit-badge {
            margin-left: auto;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .badge-warning {
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.25);
            color: var(--orange-500);
        }

        .badge-danger {
            background: rgba(244,63,94,0.1);
            border: 1px solid rgba(244,63,94,0.25);
            color: var(--rose-500);
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="header">

                <h1><span class="highlight">Ograniczenia</span> architektury warstwowej</h1>
            </div>

            <div class="limitations">
                <!-- 1 -->
                <div class="limit-item">
                    <div class="limit-icon"><i class="ti ti-layout-columns"></i></div>
                    <div class="limit-text">
                        <div class="limit-title">Organizacja według techniki, nie biznesu</div>
                    </div>
                    <span class="limit-badge badge-danger">kluczowe</span>
                </div>

                <!-- 2 -->
                <div class="limit-item">
                    <div class="limit-icon"><i class="ti ti-puzzle"></i></div>
                    <div class="limit-text">
                        <div class="limit-title">Rozproszony kod domenowy</div>
                    </div>
                    <span class="limit-badge badge-danger">kluczowe</span>
                </div>

                <!-- 3 -->
                <div class="limit-item">
                    <div class="limit-icon"><i class="ti ti-stack-2"></i></div>
                    <div class="limit-text">
                        <div class="limit-title">Tendencja do przeładowania warstwy serwisów</div>
                    </div>
                    <span class="limit-badge badge-warning">pułapka</span>
                </div>

                <!-- 4 -->
                <div class="limit-item">
                    <div class="limit-icon"><i class="ti ti-border-none"></i></div>
                    <div class="limit-text">
                        <div class="limit-title">Słabe granice biznesowe</div>
                    </div>
                    <span class="limit-badge badge-warning">ryzyko</span>
                </div>

                <!-- 5 -->
                <div class="limit-item">
                    <div class="limit-icon"><i class="ti ti-trending-up"></i></div>
                    <div class="limit-text">
                        <div class="limit-title">Utrudniona ewolucja architektury</div>
                    </div>
                    <span class="limit-badge badge-warning">skala</span>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
