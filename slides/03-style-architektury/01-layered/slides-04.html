<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 04 - Sedno architektury warstwowej</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 12%; left: 8%; animation-delay: 0s; }
        .particle:nth-child(4) { top: 72%; left: 88%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 22%; left: 82%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 82%; left: 22%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 55%; left: 45%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 18%; left: 55%; animation-delay: 2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Layout === */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 1200px;
            padding: 0 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i { font-size: 32px; }

        .statement {
            font-size: 58px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
            color: #ffffff;
            max-width: 1000px;
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.4s forwards;
        }

        .statement .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Tiles === */
        .tiles {
            display: flex;
            gap: 36px;
            justify-content: center;
        }

        .tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 40px 44px;
            border-radius: 20px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(6,182,212,0.12);
            backdrop-filter: blur(8px);
            width: 320px;
            opacity: 0;
            transition: border-color 0.3s, background 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        .tile:hover {
            border-color: var(--cyan-500);
            background: rgba(6,182,212,0.06);
            transform: translateY(-6px);
            box-shadow: 0 8px 32px rgba(6,182,212,0.12);
        }

        .tile:nth-child(1) { animation: bounceIn 0.7s ease-out 0.7s forwards; }
        .tile:nth-child(2) { animation: bounceIn 0.7s ease-out 0.9s forwards; }
        .tile:nth-child(3) { animation: bounceIn 0.7s ease-out 1.1s forwards; }

        .tile-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .tile:nth-child(1) .tile-icon {
            background: rgba(34,211,238,0.12);
            color: var(--cyan-400);
        }

        .tile:nth-child(2) .tile-icon {
            background: rgba(139,92,246,0.12);
            color: #8b5cf6;
        }

        .tile:nth-child(3) .tile-icon {
            background: rgba(245,158,11,0.12);
            color: #f59e0b;
        }

        .tile-name {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .tile-desc {
            font-size: 18px;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            60% { opacity: 1; transform: translateY(-6px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <div class="eyebrow">
                <i class="ti ti-focus-2"></i>
                Kluczowa idea
            </div>

            <div class="statement">
                Oddzielamy różne rodzaje<br><span class="highlight">odpowiedzialności technicznych</span>
            </div>

            <div class="tiles">
                <div class="tile">
                    <div class="tile-icon">
                        <i class="ti ti-device-desktop"></i>
                    </div>
                    <div class="tile-name">Prezentacja</div>
                    <div class="tile-desc">Kontakt ze światem zewnętrznym — interfejs i API</div>
                </div>

                <div class="tile">
                    <div class="tile-icon">
                        <i class="ti ti-settings"></i>
                    </div>
                    <div class="tile-name">Logika aplikacyjna</div>
                    <div class="tile-desc">Koordynacja przypadków użycia i reguł biznesowych</div>
                </div>

                <div class="tile">
                    <div class="tile-icon">
                        <i class="ti ti-database"></i>
                    </div>
                    <div class="tile-name">Dostęp do danych</div>
                    <div class="tile-desc">Persystencja, odczyt i zapis informacji</div>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
