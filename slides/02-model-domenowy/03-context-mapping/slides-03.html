<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 03 - Gdzie pojawia się problem</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --dark-bg: #030712;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --orange-500: #f59e0b;
            --violet-500: #8b5cf6;
            --rose-500: #f43f5e;
            --emerald-500: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 1000px;
            height: 1000px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .accent {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.12;
            z-index: 0;
        }

        .accent--left {
            width: 520px;
            height: 520px;
            top: 8%;
            left: 7%;
            background: var(--cyan-400);
        }

        .accent--right {
            width: 430px;
            height: 430px;
            right: 13%;
            bottom: 9%;
            background: var(--rose-500);
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(5) { top: 14%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(6) { top: 72%; left: 86%; animation-delay: 1.5s; }
        .particle:nth-child(7) { top: 30%; left: 78%; animation-delay: 3s; }
        .particle:nth-child(8) { top: 82%; left: 22%; animation-delay: 4.5s; }
        .particle:nth-child(9) { top: 48%; left: 51%; animation-delay: 6s; }
        .particle:nth-child(10) { top: 20%; left: 62%; animation-delay: 2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 0 170px;
            display: grid;
            grid-template-columns: 1fr 670px;
            align-items: center;
            gap: 82px;
        }

        .copy {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i {
            font-size: 32px;
        }

        h1.title {
            max-width: 870px;
            margin-bottom: 42px;
            color: #ffffff;
            font-size: 78px;
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.45s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(6,182,212,0.22);
        }

        .points {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
            max-width: 820px;
        }

        .point {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 20px 26px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            background: rgba(17,24,39,0.62);
            color: var(--text-muted);
            font-size: 30px;
            font-weight: 600;
            line-height: 1.25;
            opacity: 0;
            backdrop-filter: blur(6px);
        }

        .point:nth-child(1) { animation: fadeUp 0.7s ease-out 0.75s forwards; }
        .point:nth-child(2) { animation: fadeUp 0.7s ease-out 0.95s forwards; }
        .point:nth-child(3) { animation: fadeUp 0.7s ease-out 1.15s forwards; }

        .point i {
            flex: 0 0 auto;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(6,182,212,0.11);
            color: var(--cyan-400);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .point strong {
            color: #ffffff;
            font-weight: 600;
        }

        .integration-map {
            position: relative;
            width: 670px;
            height: 650px;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.5s forwards;
        }

        .map-frame {
            position: absolute;
            inset: 22px 8px 62px;
            border: 2px solid rgba(148,163,184,0.18);
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(15,23,42,0.84), rgba(3,7,18,0.66));
            box-shadow: 0 28px 80px rgba(0,0,0,0.34);
        }

        .context {
            position: absolute;
            width: 178px;
            height: 112px;
            border: 2px solid rgba(6,182,212,0.42);
            border-radius: 18px;
            background: rgba(17,24,39,0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            padding: 0 20px;
            opacity: 0;
            animation: contextIn 0.55s ease-out forwards;
        }

        .context i {
            color: var(--cyan-400);
            font-size: 30px;
        }

        .context strong {
            color: #ffffff;
            font-size: 24px;
            line-height: 1;
        }

        .context span {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .context--a { top: 80px; left: 54px; animation-delay: 0.75s; }
        .context--b { top: 80px; right: 52px; border-color: rgba(245,158,11,0.46); animation-delay: 0.95s; }
        .context--b i { color: var(--orange-500); }
        .context--c { top: 306px; left: 54px; border-color: rgba(139,92,246,0.46); animation-delay: 1.15s; }
        .context--c i { color: var(--violet-500); }
        .context--d { top: 306px; right: 52px; border-color: rgba(16,185,129,0.46); animation-delay: 1.35s; }
        .context--d i { color: var(--emerald-500); }

        @keyframes contextIn {
            from { opacity: 0; transform: scale(0.72) translateY(18px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .arrows {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .arrows svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .arrow {
            fill: none;
            stroke: rgba(148,163,184,0.36);
            stroke-width: 2;
            stroke-dasharray: 620;
            stroke-dashoffset: 620;
            animation: drawArrow 1.35s ease-out forwards;
        }

        .arrow--hot {
            stroke: rgba(244,63,94,0.78);
            stroke-width: 3;
        }

        .arrow:nth-child(2) { animation-delay: 1.55s; }
        .arrow:nth-child(3) { animation-delay: 1.75s; }
        .arrow:nth-child(4) { animation-delay: 1.95s; }
        .arrow:nth-child(5) { animation-delay: 2.15s; }

        @keyframes drawArrow {
            to { stroke-dashoffset: 0; }
        }

        .delay {
            position: absolute;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border: 1px solid rgba(244,63,94,0.38);
            border-radius: 999px;
            background: rgba(244,63,94,0.1);
            color: #fecdd3;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 0.45s ease-out forwards;
        }

        .delay i {
            color: var(--rose-500);
            font-size: 19px;
        }

        .delay--one { top: 146px; left: 276px; animation-delay: 2.25s; }
        .delay--two { top: 264px; right: 132px; animation-delay: 2.45s; }
        .delay--three { top: 426px; left: 252px; animation-delay: 2.65s; }

        .backlog {
            position: absolute;
            left: 50%;
            bottom: 30px;
            width: 330px;
            transform: translateX(-50%);
            padding: 18px 22px;
            border: 1px solid rgba(245,158,11,0.36);
            border-radius: 18px;
            background: rgba(245,158,11,0.08);
            opacity: 0;
            animation: backlogIn 0.7s ease-out 2.85s forwards;
        }

        .backlog-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            color: var(--orange-500);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .queue {
            display: grid;
            gap: 7px;
        }

        .queue span {
            display: block;
            height: 12px;
            border-radius: 999px;
            background: rgba(245,158,11,0.2);
        }

        .queue span:nth-child(1) { width: 92%; }
        .queue span:nth-child(2) { width: 74%; }
        .queue span:nth-child(3) { width: 86%; }
        .queue span:nth-child(4) { width: 56%; }

        @keyframes backlogIn {
            from { opacity: 0; transform: translate(-50%, 24px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="accent accent--left"></div>
        <div class="accent accent--right"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <main class="content">
            <section class="copy" aria-label="Gdzie pojawia się problem">
                <div class="eyebrow"><i class="ti ti-route"></i> Integracje</div>
                <h1 class="title">Problem pojawia się <span class="highlight">na styku kontekstów</span></h1>

                <div class="points">
                    <div class="point">
                        <i class="ti ti-arrows-exchange"></i>
                        <span>Konteksty muszą się <strong>integrować</strong></span>
                    </div>
                    <div class="point">
                        <i class="ti ti-users-group"></i>
                        <span>Zależności między <strong>zespołami</strong></span>
                    </div>
                    <div class="point">
                        <i class="ti ti-stack-pop"></i>
                        <span>Bottlenecki w <strong>backlogach</strong></span>
                    </div>
                </div>
            </section>

            <section class="integration-map" aria-label="Strzałki między kontekstami z oznaczonym opóźnieniem">
                <div class="map-frame"></div>

                <div class="arrows">
                    <svg viewBox="0 0 670 650" preserveAspectRatio="xMidYMid meet">
                        <defs>
                            <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
                                <path d="M0,0 L10,5 L0,10 Z" fill="rgba(148,163,184,0.72)" />
                            </marker>
                            <marker id="arrowhead-hot" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
                                <path d="M0,0 L10,5 L0,10 Z" fill="rgba(244,63,94,0.9)" />
                            </marker>
                        </defs>
                        <path class="arrow" marker-end="url(#arrowhead)" d="M232 136 C294 112 354 112 434 136" />
                        <path class="arrow arrow--hot" marker-end="url(#arrowhead-hot)" d="M489 192 C520 247 520 302 489 356" />
                        <path class="arrow" marker-end="url(#arrowhead)" d="M438 416 C358 448 292 448 232 416" />
                        <path class="arrow arrow--hot" marker-end="url(#arrowhead-hot)" d="M146 356 C112 301 112 248 146 192" />
                    </svg>
                </div>

                <div class="context context--a">
                    <i class="ti ti-box"></i>
                    <strong>Kontekst A</strong>
                    <span>Zespół A</span>
                </div>
                <div class="context context--b">
                    <i class="ti ti-box"></i>
                    <strong>Kontekst B</strong>
                    <span>Zespół B</span>
                </div>
                <div class="context context--c">
                    <i class="ti ti-box"></i>
                    <strong>Kontekst C</strong>
                    <span>Zespół C</span>
                </div>
                <div class="context context--d">
                    <i class="ti ti-box"></i>
                    <strong>Kontekst D</strong>
                    <span>Zespół D</span>
                </div>

                <div class="delay delay--one"><i class="ti ti-clock-hour-4"></i> Czekanie</div>
                <div class="delay delay--two"><i class="ti ti-lock"></i> Blokada</div>
                <div class="delay delay--three"><i class="ti ti-hourglass-high"></i> Opóźnienie</div>

                <div class="backlog">
                    <div class="backlog-title"><i class="ti ti-stack-2"></i> Backlog rośnie</div>
                    <div class="queue">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </section>
        </main>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
