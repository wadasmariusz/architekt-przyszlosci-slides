<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 16 - Open Host Service</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --dark-bg: #030712;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 1100px;
            height: 1100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 60%);
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.85; }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 82px 130px 150px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            max-width: 1260px;
            margin: 0 auto 60px;
        }

        h1.title {
            color: #ffffff;
            font-size: 78px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1px;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.3s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 27px;
            font-weight: 400;
            line-height: 1.4;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.55s forwards;
        }

        /* ── Diagram ── */
        .diagram {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.8s forwards;
        }

        /* ── Central API hub ── */
        .api-hub {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(3,7,18,0.78);
            border: 2px solid rgba(34,211,238,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow:
                0 0 0 16px rgba(34,211,238,0.04),
                0 0 0 32px rgba(34,211,238,0.02),
                0 32px 80px rgba(0,0,0,0.3);
            z-index: 4;
            position: relative;
            opacity: 0;
            animation: scaleIn 0.6s ease-out 1.0s forwards;
        }

        .api-hub i {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            color: var(--cyan-400);
            font-size: 36px;
            background: rgba(255,255,255,0.05);
        }

        .api-hub strong {
            color: #ffffff;
            font-size: 30px;
            font-weight: 800;
        }

        .api-hub .version-tag {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 16px;
            border-radius: 999px;
            background: rgba(34,211,238,0.1);
            border: 1px solid rgba(34,211,238,0.28);
            color: #a5f3fc;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        .api-hub span.desc {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 600;
            margin-top: 8px;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ── Consumer nodes ── */
        .consumers {
            position: absolute;
            width: 1000px;
            height: 560px;
        }

        .consumer {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            border-radius: 20px;
            background: rgba(17,24,39,0.88);
            border: 1px solid rgba(34,211,238,0.18);
            box-shadow: 0 16px 50px rgba(0,0,0,0.25);
            opacity: 0;
            animation: fadeUp 0.5s ease-out forwards;
        }

        .consumer i {
            color: var(--cyan-400);
            font-size: 24px;
        }

        .consumer-name {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
        }

        .consumer-tag {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-left: 4px;
        }

        .consumer--1 { left: -60px;  top: 50%;  transform: translateY(-50%); animation-delay: 1.2s; }
        .consumer--2 { left: 20px;   top: 40px;  animation-delay: 1.35s; }
        .consumer--3 { left: 50%;    top: -10px; transform: translateX(-50%); animation-delay: 1.5s; }
        .consumer--4 { right: 20px;  top: 40px;  animation-delay: 1.65s; }
        .consumer--5 { right: -60px; top: 50%;  transform: translateY(-50%); animation-delay: 1.8s; }

        /* ── Connection lines ── */
        .connections {
            position: absolute;
            width: 1000px;
            height: 560px;
            z-index: 2;
        }

        .conn {
            fill: none;
            stroke: rgba(34,211,238,0.2);
            stroke-width: 2;
            stroke-dasharray: 8 6;
            animation: dashDrift 12s linear infinite;
        }

        @keyframes dashDrift {
            to { stroke-dashoffset: -140; }
        }

        /* ── Callout ── */
        .callout {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 32px;
            border-radius: 999px;
            background: rgba(17,24,39,0.94);
            border: 1px solid rgba(34,211,238,0.2);
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            white-space: nowrap;
            opacity: 0;
            animation: fadeUpCenter 0.65s ease-out 2.1s forwards;
        }

        .callout i {
            color: var(--cyan-400);
            font-size: 28px;
        }

        .callout span {
            color: var(--cyan-400);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUpCenter {
            from { opacity: 0; transform: translate(-50%, 24px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 100;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <main class="content">
            <header class="header">
                <h1 class="title"><span class="highlight">Open Host Service</span></h1>
                <p class="subtitle">Jeden kontrakt dla wielu. Publiczne API z wersjonowaniem zamiast prywatnych integracji.</p>
            </header>

            <section class="diagram">
                <svg class="connections" viewBox="0 0 1000 560">
                    <line class="conn" x1="120" y1="280" x2="400" y2="280" />
                    <line class="conn" x1="190" y1="90"  x2="420" y2="230" />
                    <line class="conn" x1="500" y1="40"  x2="500" y2="200" />
                    <line class="conn" x1="810" y1="90"  x2="580" y2="230" />
                    <line class="conn" x1="880" y1="280" x2="600" y2="280" />
                </svg>

                <div class="consumers">
                    <div class="consumer consumer--1"><i class="ti ti-shopping-cart"></i><span class="consumer-name">Sprzedaż</span><span class="consumer-tag">consumer</span></div>
                    <div class="consumer consumer--2"><i class="ti ti-users"></i><span class="consumer-name">HR</span><span class="consumer-tag">consumer</span></div>
                    <div class="consumer consumer--3"><i class="ti ti-report-money"></i><span class="consumer-name">Finanse</span><span class="consumer-tag">consumer</span></div>
                    <div class="consumer consumer--4"><i class="ti ti-device-mobile"></i><span class="consumer-name">Mobile</span><span class="consumer-tag">consumer</span></div>
                    <div class="consumer consumer--5"><i class="ti ti-headset"></i><span class="consumer-name">Support</span><span class="consumer-tag">consumer</span></div>
                </div>

                <div class="api-hub">
                    <i class="ti ti-api"></i>
                    <strong>Dokumenty API</strong>
                    <div class="version-tag">v2.1</div>
                </div>

                <div class="callout"><i class="ti ti-shield-check"></i> Jeden <span>wersjonowany</span> kontrakt</div>
            </section>
        </main>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
