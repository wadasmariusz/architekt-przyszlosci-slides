<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 12 - Partnership</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --dark-bg: #030712;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --orange-500: #f59e0b;
            --emerald-500: #10b981;
            --violet-500: #8b5cf6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 22% 36%, rgba(34,211,238,0.14), transparent 31%),
                radial-gradient(circle at 78% 36%, rgba(16,185,129,0.12), transparent 31%),
                radial-gradient(circle at 50% 72%, rgba(139,92,246,0.10), transparent 36%),
                radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 84px 130px 150px;
        }

        .header {
            text-align: center;
            max-width: 1220px;
            margin: 0 auto 42px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i { font-size: 32px; }

        h1.title {
            color: #ffffff;
            font-size: 82px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: 0;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.45s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--emerald-500));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 27px;
            font-weight: 400;
            line-height: 1.4;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.7s forwards;
        }

        .partnership-map {
            position: relative;
            width: 1380px;
            height: 592px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeIn 0.75s ease-out 0.95s forwards;
        }

        .shared-field {
            position: absolute;
            left: 410px;
            right: 410px;
            top: 92px;
            height: 384px;
            border-radius: 46px;
            background:
                linear-gradient(180deg, rgba(15,23,42,0.88), rgba(3,7,18,0.78)),
                radial-gradient(circle at 50% 12%, rgba(34,211,238,0.14), transparent 54%);
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow:
                0 32px 90px rgba(0,0,0,0.34),
                inset 0 0 0 1px rgba(34,211,238,0.08);
        }

        .shared-field::before,
        .shared-field::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 312px;
            height: 4px;
            transform: translateY(-50%);
            background: linear-gradient(90deg, transparent, rgba(34,211,238,0.7), rgba(16,185,129,0.7), transparent);
            box-shadow: 0 0 26px rgba(34,211,238,0.36);
        }

        .shared-field::before { right: 100%; }
        .shared-field::after { left: 100%; }

        .team {
            position: absolute;
            top: 114px;
            width: 330px;
            height: 340px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            background:
                radial-gradient(circle at 50% 35%, rgba(255,255,255,0.08), transparent 32%),
                rgba(3,7,18,0.58);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 26px 70px rgba(0,0,0,0.32);
        }

        .team--left {
            left: 34px;
            animation: teamInLeft 0.65s ease-out 1.05s both;
        }

        .team--right {
            right: 34px;
            animation: teamInRight 0.65s ease-out 1.05s both;
        }

        .team::after {
            content: '';
            position: absolute;
            inset: 20px;
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,0.14);
        }

        .team-icon {
            width: 92px;
            height: 92px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            font-size: 46px;
            background: rgba(255,255,255,0.05);
            position: relative;
            z-index: 1;
        }

        .team--left .team-icon { color: var(--cyan-400); }
        .team--right .team-icon { color: var(--emerald-500); }

        .team h2 {
            position: relative;
            z-index: 1;
            color: #ffffff;
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0;
            margin-bottom: 10px;
        }

        .team p {
            position: relative;
            z-index: 1;
            color: var(--text-muted);
            font-size: 21px;
            font-weight: 600;
            line-height: 1.25;
            max-width: 220px;
        }

        .rituals {
            position: absolute;
            inset: 54px 58px;
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            gap: 22px;
        }

        .ritual {
            position: relative;
            display: grid;
            grid-template-columns: 62px 1fr 62px;
            align-items: center;
            min-height: 78px;
            border-radius: 26px;
            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            opacity: 0;
            animation: fadeUp 0.55s ease-out forwards;
        }

        .ritual:nth-child(1) { animation-delay: 1.35s; }
        .ritual:nth-child(2) { animation-delay: 1.55s; }
        .ritual:nth-child(3) { animation-delay: 1.75s; }

        .ritual::before {
            content: '';
            position: absolute;
            left: 62px;
            right: 62px;
            top: 50%;
            height: 2px;
            transform: translateY(-50%);
            background: linear-gradient(90deg, rgba(34,211,238,0.7), rgba(16,185,129,0.7));
        }

        .ritual i {
            position: relative;
            z-index: 1;
            justify-self: center;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(3,7,18,0.72);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .ritual i:first-child { color: var(--cyan-400); }
        .ritual i:last-child { color: var(--emerald-500); }

        .ritual strong {
            position: relative;
            z-index: 2;
            justify-self: center;
            padding: 10px 18px;
            border-radius: 999px;
            color: #ffffff;
            background: rgba(3,7,18,0.9);
            font-size: 24px;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
        }

        .dependency {
            position: absolute;
            left: 50%;
            bottom: 60px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            color: #fef3c7;
            font-size: 22px;
            font-weight: 800;
            line-height: 1;
            padding: 16px 24px;
            border-radius: 999px;
            background: rgba(245,158,11,0.12);
            border: 1px solid rgba(245,158,11,0.32);
            opacity: 0;
            animation: fadeUpCenter 0.65s ease-out 2.05s forwards;
        }

        .dependency i {
            color: var(--orange-500);
            font-size: 26px;
        }

        .takeaway {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 30px;
            border-radius: 999px;
            background: rgba(17,24,39,0.94);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            white-space: nowrap;
            opacity: 0;
            animation: fadeUpCenter 0.7s ease-out 2.25s forwards;
        }

        .takeaway i {
            color: var(--cyan-400);
            font-size: 28px;
        }

        .takeaway span {
            color: var(--cyan-400);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUpCenter {
            from { opacity: 0; transform: translate(-50%, 24px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes teamInLeft {
            from { opacity: 0; transform: translateX(-32px) scale(0.96); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        @keyframes teamInRight {
            from { opacity: 0; transform: translateX(32px) scale(0.96); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 100;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <main class="content">
            <header class="header">
                <h1 class="title">Dwa zespoły działają jak <span class="highlight">jeden system</span></h1>
            </header>

            <section class="partnership-map" aria-label="Dwa zespoły połączone symetrycznie">
                <div class="shared-field">
                    <div class="rituals">
                        <div class="ritual">
                            <i class="ti ti-users-group"></i>
                            <strong>Wspólne planowanie</strong>
                            <i class="ti ti-users-group"></i>
                        </div>
                        <div class="ritual">
                            <i class="ti ti-git-merge"></i>
                            <strong>Wspólne decyzje</strong>
                            <i class="ti ti-git-merge"></i>
                        </div>
                        <div class="ritual">
                            <i class="ti ti-rocket"></i>
                            <strong>Wspólne deploymenty</strong>
                            <i class="ti ti-rocket"></i>
                        </div>
                    </div>
                </div>

                <article class="team team--left">
                    <div class="team-icon"><i class="ti ti-code"></i></div>
                    <h2>Zespół A</h2>
                </article>

                <article class="team team--right">
                    <div class="team-icon"><i class="ti ti-sitemap"></i></div>
                    <h2>Zespół B</h2>
                </article>

                <div class="dependency"><i class="ti ti-link"></i> wysoka zależność, wysoka synchronizacja</div>
                <div class="takeaway"><i class="ti ti-handshake"></i> Partnership to<span>wspólna odpowiedzialność</span></div>
            </section>
        </main>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
