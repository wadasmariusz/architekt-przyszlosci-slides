<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 01 - Problem</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --dark-bg: #030712;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --orange-500: #f59e0b;
            --violet-500: #8b5cf6;
            --rose-500: #f43f5e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 1000px;
            height: 1000px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .accent {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.12;
            z-index: 0;
        }

        .accent--left {
            width: 520px;
            height: 520px;
            top: 8%;
            left: 7%;
            background: var(--cyan-400);
        }

        .accent--right {
            width: 420px;
            height: 420px;
            right: 13%;
            bottom: 9%;
            background: var(--rose-500);
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(5) { top: 14%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(6) { top: 72%; left: 86%; animation-delay: 1.5s; }
        .particle:nth-child(7) { top: 30%; left: 78%; animation-delay: 3s; }
        .particle:nth-child(8) { top: 82%; left: 22%; animation-delay: 4.5s; }
        .particle:nth-child(9) { top: 48%; left: 51%; animation-delay: 6s; }
        .particle:nth-child(10) { top: 20%; left: 62%; animation-delay: 2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 0 170px;
            display: grid;
            grid-template-columns: 1fr 620px;
            align-items: center;
            gap: 110px;
        }

        .copy {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i {
            font-size: 32px;
        }

        h1.title {
            max-width: 860px;
            margin-bottom: 42px;
            color: #ffffff;
            font-size: 82px;
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.45s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(6,182,212,0.22);
        }

        .points {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
            max-width: 800px;
        }

        .point {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 20px 26px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            background: rgba(17,24,39,0.62);
            color: var(--text-muted);
            font-size: 30px;
            font-weight: 600;
            line-height: 1.25;
            opacity: 0;
            backdrop-filter: blur(6px);
        }

        .point:nth-child(1) { animation: fadeUp 0.7s ease-out 0.75s forwards; }
        .point:nth-child(2) { animation: fadeUp 0.7s ease-out 0.95s forwards; }
        .point:nth-child(3) { animation: fadeUp 0.7s ease-out 1.15s forwards; }

        .point i {
            flex: 0 0 auto;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(6,182,212,0.11);
            color: var(--cyan-400);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .point strong {
            color: #ffffff;
            font-weight: 600;
        }

        .network {
            position: relative;
            width: 620px;
            height: 620px;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.5s forwards;
        }

        .network svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .link {
            stroke: rgba(148,163,184,0.34);
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 760;
            stroke-dashoffset: 760;
            animation: drawLink 1.5s ease-out forwards;
        }

        .link--hot {
            stroke: rgba(244,63,94,0.72);
            stroke-width: 3;
        }

        .link:nth-child(1) { animation-delay: 0.8s; }
        .link:nth-child(2) { animation-delay: 0.95s; }
        .link:nth-child(3) { animation-delay: 1.1s; }
        .link:nth-child(4) { animation-delay: 1.25s; }
        .link:nth-child(5) { animation-delay: 1.4s; }
        .link:nth-child(6) { animation-delay: 1.55s; }
        .link:nth-child(7) { animation-delay: 1.7s; }
        .link:nth-child(8) { animation-delay: 1.85s; }
        .link:nth-child(9) { animation-delay: 2s; }

        @keyframes drawLink {
            to { stroke-dashoffset: 0; }
        }

        .team {
            position: absolute;
            width: 134px;
            height: 96px;
            border: 2px solid rgba(6,182,212,0.34);
            border-radius: 16px;
            background: rgba(17,24,39,0.86);
            box-shadow: 0 18px 50px rgba(0,0,0,0.32);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0;
            animation: teamIn 0.55s ease-out forwards, teamPulse 3.5s ease-in-out infinite;
        }

        .team i {
            color: var(--cyan-400);
            font-size: 28px;
        }

        .team span {
            color: #e2e8f0;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .team--a { top: 38px; left: 236px; animation-delay: 0.2s, 2.6s; }
        .team--b { top: 175px; left: 32px; border-color: rgba(245,158,11,0.48); animation-delay: 0.35s, 2.8s; }
        .team--b i { color: var(--orange-500); }
        .team--c { top: 174px; right: 28px; border-color: rgba(139,92,246,0.48); animation-delay: 0.5s, 3s; }
        .team--c i { color: var(--violet-500); }
        .team--d { bottom: 95px; left: 94px; animation-delay: 0.65s, 3.2s; }
        .team--e { bottom: 84px; right: 82px; border-color: rgba(244,63,94,0.48); animation-delay: 0.8s, 3.4s; }
        .team--e i { color: var(--rose-500); }

        @keyframes teamIn {
            from { opacity: 0; transform: scale(0.72) translateY(18px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes teamPulse {
            0%, 100% { box-shadow: 0 18px 50px rgba(0,0,0,0.32), 0 0 0 rgba(6,182,212,0); }
            50% { box-shadow: 0 18px 50px rgba(0,0,0,0.32), 0 0 26px rgba(6,182,212,0.16); }
        }

        .warning {
            position: absolute;
            top: 266px;
            left: 223px;
            width: 174px;
            height: 88px;
            border: 1px solid rgba(244,63,94,0.38);
            border-radius: 18px;
            background: rgba(244,63,94,0.1);
            color: #fecdd3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            animation: warningIn 0.6s ease-out 2.15s forwards;
        }

        .warning i {
            color: var(--rose-500);
            font-size: 30px;
        }

        @keyframes warningIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            z-index: 100;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="accent accent--left"></div>
        <div class="accent accent--right"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <main class="content">
            <section class="copy" aria-label="Problem">
                <div class="eyebrow"><i class="ti ti-map-2"></i> Context Mapping</div>
                <h1 class="title">Problem nie zaczyna się w <span class="highlight">kodzie</span></h1>

                <div class="points">
                    <div class="point">
                        <i class="ti ti-stack-2"></i>
                        <span>Systemy są <strong>złożone</strong></span>
                    </div>
                    <div class="point">
                        <i class="ti ti-users-group"></i>
                        <span>Wiele zespołów, wiele <strong>zależności</strong></span>
                    </div>
                    <div class="point">
                        <i class="ti ti-building-community"></i>
                        <span>Problemy nie są techniczne — są <strong>organizacyjne</strong></span>
                    </div>
                </div>
            </section>

            <section class="network" aria-label="Chaotyczna sieć zależności zespołów">
                <svg viewBox="0 0 620 620" preserveAspectRatio="xMidYMid meet">
                    <path class="link" d="M303 134 C262 170 203 186 99 223" />
                    <path class="link" d="M318 134 C364 172 431 183 526 222" />
                    <path class="link link--hot" d="M99 223 C210 262 342 248 526 222" />
                    <path class="link" d="M99 223 C124 313 150 394 161 475" />
                    <path class="link link--hot" d="M526 222 C461 314 431 388 462 482" />
                    <path class="link" d="M161 475 C270 431 350 430 462 482" />
                    <path class="link" d="M303 134 C278 253 236 342 161 475" />
                    <path class="link link--hot" d="M303 134 C379 244 437 346 462 482" />
                    <path class="link" d="M99 223 C253 333 391 342 526 222" />
                </svg>

                <div class="team team--a"><i class="ti ti-users"></i><span>Zespół A</span></div>
                <div class="team team--b"><i class="ti ti-users"></i><span>Zespół B</span></div>
                <div class="team team--c"><i class="ti ti-users"></i><span>Zespół C</span></div>
                <div class="team team--d"><i class="ti ti-users"></i><span>Zespół D</span></div>
                <div class="team team--e"><i class="ti ti-users"></i><span>Zespół E</span></div>
                <div class="warning"><i class="ti ti-alert-triangle"></i> Chaos</div>
            </section>
        </main>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
