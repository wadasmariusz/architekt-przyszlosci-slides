<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 05 - Context Mapping</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --dark-bg: #030712;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --orange-500: #f59e0b;
            --violet-500: #8b5cf6;
            --emerald-500: #10b981;
            --rose-500: #f43f5e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 1100px;
            height: 1100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 60%);
            top: 54%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.12); opacity: 0.85; }
        }

        .accent {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.12;
            z-index: 0;
        }

        .accent--left {
            width: 520px;
            height: 520px;
            top: 10%;
            left: 8%;
            background: var(--cyan-400);
        }

        .accent--right {
            width: 420px;
            height: 420px;
            right: 12%;
            bottom: 14%;
            background: var(--violet-500);
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(5) { top: 14%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(6) { top: 72%; left: 86%; animation-delay: 1.5s; }
        .particle:nth-child(7) { top: 30%; left: 78%; animation-delay: 3s; }
        .particle:nth-child(8) { top: 82%; left: 22%; animation-delay: 4.5s; }
        .particle:nth-child(9) { top: 48%; left: 51%; animation-delay: 6s; }
        .particle:nth-child(10) { top: 20%; left: 62%; animation-delay: 2s; }

        @keyframes float {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20%, 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 86px 120px 150px;
        }

        .header {
            text-align: center;
            max-width: 1100px;
            margin: 0 auto 40px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i {
            font-size: 32px;
        }

        h1.title {
            color: #ffffff;
            font-size: 78px;
            font-weight: 800;
            line-height: 1.06;
            letter-spacing: -1px;
            margin-bottom: 18px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.45s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 28px;
            font-weight: 400;
            line-height: 1.4;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.7s forwards;
        }

        .map-wrap {
            position: relative;
            width: 1240px;
            height: 620px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeIn 0.9s ease-out 0.95s forwards;
        }

        .map-surface {
            position: absolute;
            inset: 26px 18px 0;
            border: 2px solid rgba(148,163,184,0.14);
            border-radius: 34px;
            background: linear-gradient(135deg, rgba(15,23,42,0.82), rgba(3,7,18,0.68));
            box-shadow: 0 28px 80px rgba(0,0,0,0.34);
        }

        .map-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .relation {
            fill: none;
            stroke-width: 3;
            stroke-dasharray: 760;
            stroke-dashoffset: 760;
            animation: drawLine 1.2s ease-out forwards;
        }

        .relation--cyan { stroke: rgba(34,211,238,0.6); }
        .relation--orange { stroke: rgba(245,158,11,0.68); }
        .relation--violet { stroke: rgba(139,92,246,0.72); }
        .relation--emerald { stroke: rgba(16,185,129,0.72); }
        .relation--rose { stroke: rgba(244,63,94,0.72); }

        .relation:nth-child(2) { animation-delay: 1.2s; }
        .relation:nth-child(3) { animation-delay: 1.45s; }
        .relation:nth-child(4) { animation-delay: 1.7s; }
        .relation:nth-child(5) { animation-delay: 1.95s; }

        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        .context {
            position: absolute;
            width: 240px;
            min-height: 122px;
            padding: 22px 24px;
            border-radius: 24px;
            background: rgba(17,24,39,0.88);
            border: 2px solid rgba(6,182,212,0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.22);
            opacity: 0;
            animation: contextIn 0.6s ease-out forwards;
        }

        .context:nth-of-type(1) { animation-delay: 1.05s; }
        .context:nth-of-type(2) { animation-delay: 1.25s; }
        .context:nth-of-type(3) { animation-delay: 1.45s; }
        .context:nth-of-type(4) { animation-delay: 1.65s; }

        @keyframes contextIn {
            from { opacity: 0; transform: scale(0.88) translateY(18px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .context--sales {
            top: 72px;
            left: 92px;
            border-color: rgba(34,211,238,0.38);
        }

        .context--booking {
            top: 72px;
            right: 92px;
            border-color: rgba(245,158,11,0.4);
        }

        .context--payments {
            left: 180px;
            bottom: 86px;
            border-color: rgba(139,92,246,0.42);
        }

        .context--support {
            right: 180px;
            bottom: 86px;
            border-color: rgba(16,185,129,0.42);
        }

        .context-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .context-head i {
            font-size: 30px;
        }

        .context--sales .context-head i { color: var(--cyan-400); }
        .context--booking .context-head i { color: var(--orange-500); }
        .context--payments .context-head i { color: var(--violet-500); }
        .context--support .context-head i { color: var(--emerald-500); }

        .context-head strong {
            font-size: 30px;
            line-height: 1;
            color: #ffffff;
        }

        .context p {
            color: var(--text-muted);
            font-size: 19px;
            line-height: 1.45;
            font-weight: 600;
        }

        .label {
            position: absolute;
            padding: 10px 14px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 0.45s ease-out forwards;
        }

        .label--one {
            top: 178px;
            left: 492px;
            color: #a5f3fc;
            border: 1px solid rgba(34,211,238,0.25);
            background: rgba(34,211,238,0.08);
            animation-delay: 2.15s;
        }

        .label--two {
            top: 360px;
            left: 318px;
            color: #ddd6fe;
            border: 1px solid rgba(139,92,246,0.25);
            background: rgba(139,92,246,0.08);
            animation-delay: 2.35s;
        }

        .label--three {
            top: 360px;
            right: 308px;
            color: #bbf7d0;
            border: 1px solid rgba(16,185,129,0.25);
            background: rgba(16,185,129,0.08);
            animation-delay: 2.55s;
        }

        .legend {
            position: absolute;
            left: 50%;
            bottom: -2px;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
            opacity: 0;
            animation: fadeUpCenter 0.7s ease-out 2.7s forwards;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 18px;
            border-radius: 999px;
            background: rgba(17,24,39,0.88);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 700;
        }

        .legend-swatch {
            width: 26px;
            height: 3px;
            border-radius: 999px;
        }

        .legend-swatch--up { background: rgba(34,211,238,0.72); }
        .legend-swatch--side { background: rgba(139,92,246,0.72); }
        .legend-swatch--team { background: rgba(16,185,129,0.72); }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUpCenter {
            from { opacity: 0; transform: translate(-50%, 24px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 100;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="accent accent--left"></div>
        <div class="accent accent--right"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <main class="content">
            <header class="header">
                <div class="eyebrow"><i class="ti ti-map-2"></i> Context Mapping</div>
                <h1 class="title">Mapa pokazuje <span class="highlight">relacje między kontekstami</span></h1>
            </header>

            <section class="map-wrap" aria-label="Prosta mapa kontekstów z relacjami">
                <div class="map-surface"></div>

                <svg class="map-svg" viewBox="0 0 1240 620" preserveAspectRatio="xMidYMid meet">
                    <path class="relation relation--cyan" d="M332 142 C450 110 548 110 908 142" />
                    <path class="relation relation--violet" d="M270 398 C386 354 490 330 620 312" />
                    <path class="relation relation--emerald" d="M970 398 C854 354 750 330 620 312" />
                    <path class="relation relation--orange" d="M908 194 C850 266 796 314 690 386" />
                    <path class="relation relation--rose" d="M332 194 C390 266 444 314 550 386" />
                </svg>

                <article class="context context--sales">
                    <div class="context-head">
                        <i class="ti ti-shopping-cart"></i>
                        <strong>Sprzedaż</strong>
                    </div>
                </article>

                <article class="context context--booking">
                    <div class="context-head">
                        <i class="ti ti-calendar-check"></i>
                        <strong>Rezerwacje</strong>
                    </div>
                </article>

                <article class="context context--payments">
                    <div class="context-head">
                        <i class="ti ti-credit-card"></i>
                        <strong>Płatności</strong>
                    </div>
                </article>

                <article class="context context--support">
                    <div class="context-head">
                        <i class="ti ti-headset"></i>
                        <strong>Obsługa</strong>
                    </div>
                </article>

                <div class="label label--one">Wspólny klient</div>
                <div class="label label--two">Dane rozliczeń</div>
                <div class="label label--three">Zdarzenia operacyjne</div>

                <div class="legend">
                    <div class="legend-item"><span class="legend-swatch legend-swatch--up"></span> relacja biznesowa</div>
                    <div class="legend-item"><span class="legend-swatch legend-swatch--side"></span> integracja systemowa</div>
                    <div class="legend-item"><span class="legend-swatch legend-swatch--team"></span> współpraca zespołów</div>
                </div>
            </section>
        </main>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
