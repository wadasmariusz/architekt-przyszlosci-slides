<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 09 - Upstream vs Downstream</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --dark-bg: #030712;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --orange-500: #f59e0b;
            --emerald-500: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 26%, rgba(34,211,238,0.14), transparent 32%),
                radial-gradient(circle at 78% 60%, rgba(16,185,129,0.10), transparent 34%),
                radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 86px 130px 150px;
        }

        .header {
            text-align: center;
            max-width: 1180px;
            margin: 0 auto 36px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            color: var(--cyan-400);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.25s forwards;
        }

        .eyebrow i { font-size: 32px; }

        h1.title {
            color: #ffffff;
            font-size: 78px;
            font-weight: 800;
            line-height: 1.06;
            letter-spacing: -1px;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.45s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 27px;
            font-weight: 400;
            line-height: 1.4;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.7s forwards;
        }

        .river-scene {
            position: relative;
            width: 1360px;
            height: 590px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.95s forwards;
        }

        .river-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 36px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUpCenter {
            from { opacity: 0; transform: translate(-50%, 24px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 100;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <main class="content">
            <header class="header">
                <h1 class="title">Relacja płynie <span class="highlight">w jednym kierunku</span></h1>
                <p class="subtitle">Upstream jest bliżej źródła decyzji. Downstream pracuje z tym, co do niego dopłynie.</p>
            </header>

            <section class="river-scene" aria-label="Metafora rzeki: upstream, przepływ i downstream">
                <img src="images/rzeka-metafora.png" alt="Metafora rzeki: upstream, przepływ i downstream" class="river-img">
            </section>
        </main>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
