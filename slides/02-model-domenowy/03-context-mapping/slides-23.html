<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 23 - Ryzyko Shared Kernel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --dark-bg: #030712;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 1100px;
            height: 1100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 60%);
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bgPulse 6s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.85; }
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after { width: 2px; height: 24px; bottom: 0; right: 0; }

        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 82px 130px 150px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            max-width: 1260px;
            margin: 0 auto 50px;
        }

        h1.title {
            color: #ffffff;
            font-size: 78px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1px;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.9s ease-out 0.3s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 27px;
            font-weight: 400;
            line-height: 1.4;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.55s forwards;
        }

        /* ── Diagram ── */
        .diagram {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 80px;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.8s forwards;
        }

        /* ── Before / After venn ── */
        .phase {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            opacity: 0;
            animation: fadeUp 0.6s ease-out forwards;
        }

        .phase--before { animation-delay: 1.0s; }
        .phase--after { animation-delay: 1.3s; }

        .phase-label {
            color: var(--text-muted);
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .venn {
            position: relative;
            width: 440px;
            height: 320px;
        }

        .circle {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 2px solid rgba(34,211,238,0.18);
            background: rgba(17,24,39,0.5);
            top: 30px;
        }

        .circle--a { left: 0; }
        .circle--b { right: 0; }

        .kernel-overlap {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(34,211,238,0.08);
            border: 2px solid rgba(34,211,238,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .phase--before .kernel-overlap {
            width: 100px;
            height: 140px;
        }

        .phase--after .kernel-overlap {
            width: 260px;
            height: 280px;
        }

        .kernel-pct {
            color: var(--cyan-400);
            font-size: 32px;
            font-weight: 800;
        }

        /* ── Arrow between phases ── */
        .phase-arrow {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 1.5s forwards;
        }

        .phase-arrow i {
            color: var(--cyan-400);
            font-size: 36px;
        }

        .phase-arrow span {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 700;
        }

        /* ── Problems list ── */
        .problems {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 28px;
            opacity: 0;
            animation: fadeUpCenter 0.6s ease-out 1.7s forwards;
        }

        .problem {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 22px;
            border-radius: 16px;
            background: rgba(17,24,39,0.92);
            border: 1px solid rgba(34,211,238,0.14);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
        }

        .problem i {
            color: var(--cyan-400);
            font-size: 22px;
        }

        /* ── Callout ── */
        .callout {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 32px;
            border-radius: 999px;
            background: rgba(17,24,39,0.94);
            border: 1px solid rgba(34,211,238,0.2);
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            white-space: nowrap;
            z-index: 20;
            opacity: 0;
            animation: fadeUpCenter 0.65s ease-out 2.0s forwards;
        }

        .callout i {
            color: var(--cyan-400);
            font-size: 28px;
        }

        .callout span {
            color: var(--cyan-400);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUpCenter {
            from { opacity: 0; transform: translate(-50%, 24px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        .camera-box {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 480px;
            height: 270px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 100;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <main class="content">
            <header class="header">
                <h1 class="title">Kiedy kernel <span class="highlight">rośnie za bardzo</span></h1>
                <p class="subtitle">Zaczyna od kalkulatora rabatów, kończy na 40% wspólnego modelu.</p>
            </header>

            <section class="diagram">
                <div class="phase phase--before">
                    <span class="phase-label">Początek</span>
                    <div class="venn">
                        <div class="circle circle--a"></div>
                        <div class="circle circle--b"></div>
                        <div class="kernel-overlap">
                            <span class="kernel-pct">5%</span>
                        </div>
                    </div>
                </div>

                <div class="phase-arrow">
                    <i class="ti ti-arrow-right"></i>
                    <span>2 lata</span>
                </div>

                <div class="phase phase--after">
                    <span class="phase-label">Teraz</span>
                    <div class="venn">
                        <div class="circle circle--a"></div>
                        <div class="circle circle--b"></div>
                        <div class="kernel-overlap">
                            <span class="kernel-pct">40%</span>
                        </div>
                    </div>
                </div>
                
            </section>

            <div class="callout"><i class="ti ti-alert-triangle"></i> Kernel musi mieć <span>właściciela i granicę</span></div>
        </main>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
