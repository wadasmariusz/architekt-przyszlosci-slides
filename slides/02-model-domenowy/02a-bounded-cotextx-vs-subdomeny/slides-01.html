<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 01 - Subdomena a Bounded Context</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }

        .bg-glow {
            position: absolute; width: 900px; height: 900px; border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 65%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: pulse 6s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            background: var(--cyan-400); opacity: 0; animation: float 8s ease-in-out infinite;
        }
        .particle:nth-child(3) { top: 12%; left: 18%; animation-delay: 0s; }
        .particle:nth-child(4) { top: 65%; left: 80%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 25%; left: 70%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 75%; left: 25%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 45%; left: 55%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 18%; left: 42%; animation-delay: 2s; }

        @keyframes float {
            0%   { opacity: 0; transform: translateY(0) scale(1); }
            20%  { opacity: 0.8; } 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        /* === Corner accents === */
        .corner { position: absolute; width: 60px; height: 60px; z-index: 1; }
        .corner::before, .corner::after { content: ''; position: absolute; background: var(--cyan-700); }
        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }
        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative; z-index: 10; text-align: center;
            width: 100%; max-width: 1200px; padding: 0 3rem;
            display: flex; flex-direction: column; align-items: center;
        }

        /* === Two cards illustration === */
        .cards-illustration {
            display: flex;
            gap: 60px;
            margin-bottom: 3.5rem;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.3s forwards;
        }

        .concept-card {
            width: 260px;
            height: 120px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            backdrop-filter: blur(8px);
            opacity: 0;
        }

        .concept-card--subdomain {
            background: rgba(245,158,11,0.08);
            border: 2px solid rgba(245,158,11,0.35);
            animation: cardAppear 0.7s ease-out 0.5s forwards;
        }

        .concept-card--bc {
            background: rgba(6,182,212,0.08);
            border: 2px solid rgba(6,182,212,0.35);
            animation: cardAppear 0.7s ease-out 0.9s forwards;
        }

        .concept-card__label {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .concept-card--subdomain .concept-card__label { color: #f59e0b; }
        .concept-card--bc .concept-card__label { color: var(--cyan-400); }

        .concept-card__desc {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .concept-card--subdomain .concept-card__desc { color: rgba(245,158,11,0.6); }
        .concept-card--bc .concept-card__desc { color: rgba(6,182,212,0.6); }

        .cards-separator {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #475569;
            font-weight: 300;
            opacity: 0;
            animation: scaleIn 0.5s ease-out 1.2s forwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.7) translateY(10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.3); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* === Title === */
        h1.title {
            font-size: 78px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.4rem;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeUp 1s ease-out 1.5s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        /* === Subtitle bullets === */
        .subtitle-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 0.5rem;
        }

        .subtitle-list li {
            font-size: clamp(1rem, 1.8vw, 1.25rem);
            color: #94a3b8;
            font-weight: 300;
            line-height: 1.5;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .subtitle-list li:nth-child(1) { animation: fadeUp 0.8s ease-out 2.0s forwards; }
        .subtitle-list li:nth-child(2) { animation: fadeUp 0.8s ease-out 2.3s forwards; }
        .subtitle-list li:nth-child(3) { animation: fadeUp 0.8s ease-out 2.6s forwards; }

        .subtitle-list li::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--cyan-600);
            flex-shrink: 0;
        }

        /* === Animations === */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .camera-box {
            position: absolute;
            bottom: 40px; right: 40px;
            width: 480px; height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }

        .slide-logo {
            position: absolute; z-index: 100;
            bottom: 40px; left: 40px;
            height: 100px; width: auto;
            opacity: 0.85; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <!-- Two concept cards illustration -->
            <div class="cards-illustration">
                <div class="concept-card concept-card--subdomain">
                    <span class="concept-card__label">Subdomena</span>
                    <span class="concept-card__desc">= biznes</span>
                </div>
                <div class="cards-separator">≠</div>
                <div class="concept-card concept-card--bc">
                    <span class="concept-card__label">Bounded Context</span>
                    <span class="concept-card__desc">= model</span>
                </div>
            </div>

            <h1 class="title">Subdomena </br>a</br> <span class="highlight">Bounded Context</span></h1>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">

        <div class="camera-box">
            kamera 480 &times; 270
        </div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
