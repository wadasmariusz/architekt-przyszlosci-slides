<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 05 - Subdomena pomaga odpowiedzieć: co istnieje w biznesie?</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }

        .bg-glow {
            position: absolute; width: 750px; height: 750px; border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.10) 0%, transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: pulse 6s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            background: var(--cyan-400); opacity: 0; animation: float 8s ease-in-out infinite;
        }
        .particle:nth-child(3) { top: 18%; left: 14%; animation-delay: 0s; }
        .particle:nth-child(4) { top: 68%; left: 88%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 25%; left: 78%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 82%; left: 15%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 55%; left: 45%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 14%; left: 55%; animation-delay: 2s; }

        @keyframes float {
            0%   { opacity: 0; transform: translateY(0) scale(1); }
            20%  { opacity: 0.8; } 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        /* === Corner accents === */
        .corner { position: absolute; width: 60px; height: 60px; z-index: 1; }
        .corner::before, .corner::after { content: ''; position: absolute; background: var(--cyan-700); }
        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }
        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative; z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 1100px;
            padding: 0 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* === Eyebrow === */
        .eyebrow {
            font-size: 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--cyan-400);
            margin-bottom: 1.6rem;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        /* === Title === */
        h1.title {
            font-size: 58px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 3.5rem;
            opacity: 0;
            animation: fadeUp 1s ease-out 0.6s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        /* === Points === */
        .points {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 860px;
        }

        .point {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 24px 32px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            background: rgba(17,24,39,0.62);
            backdrop-filter: blur(6px);
            text-align: left;
            opacity: 0;
        }

        .point:nth-child(1) { animation: fadeUp 0.7s ease-out 1.0s forwards; }
        .point:nth-child(2) { animation: fadeUp 0.7s ease-out 1.3s forwards; }
        .point:nth-child(3) { animation: fadeUp 0.7s ease-out 1.6s forwards; }

        .point-icon {
            flex: 0 0 auto;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(245,158,11,0.10);
            color: #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .point-text {
            font-size: 30px;
            font-weight: 600;
            color: #f0f4f8;
            line-height: 1.35;
        }

        .point-text strong {
            color: #f59e0b;
            font-weight: 800;
        }

        /* === Bottom note === */
        .bottom-note {
            margin-top: 3.5rem;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 2.0s forwards;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 2rem;
            border-radius: 100px;
            background: rgba(6,182,212,0.06);
            border: 1px solid rgba(6,182,212,0.2);
            font-size: 18px;
            font-weight: 300;
            color: #94a3b8;
        }

        .chip i {
            color: var(--cyan-400);
            font-size: 22px;
        }

        .chip strong {
            color: var(--cyan-400);
            font-weight: 600;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .camera-box {
            position: absolute;
            bottom: 40px; right: 40px;
            width: 480px; height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }

        .slide-logo {
            position: absolute; z-index: 100;
            bottom: 40px; left: 40px;
            height: 100px; width: auto;
            opacity: 0.85; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="eyebrow">Slajd 05 · Poziom Subdomen</div>

            <h1 class="title">Subdomena pomaga odpowiedzieć:<br><span class="highlight">co istnieje w biznesie?</span></h1>

            <div class="points">
                <div class="point">
                    <div class="point-icon"><i class="ti ti-map"></i></div>
                    <div class="point-text">Jakie <strong>obszary działalności</strong> istnieją</div>
                </div>

                <div class="point">
                    <div class="point-icon"><i class="ti ti-target"></i></div>
                    <div class="point-text">Za co <strong>odpowiadają</strong></div>
                </div>

                <div class="point">
                    <div class="point-icon"><i class="ti ti-separator"></i></div>
                    <div class="point-text">Gdzie przebiegają <strong>biznesowe odpowiedzialności</strong></div>
                </div>
            </div>

            <div class="bottom-note">
                <div class="chip">
                    <i class="ti ti-info-circle"></i>
                    Na tym etapie <strong>nie wyznaczamy granic modelu</strong> — analizujemy biznes
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">

        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
