<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 18 - DDD to rozmowa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --dark-bg: #0a0e17;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .corner { position: absolute; width: 60px; height: 60px; z-index: 1; }
        .corner::before, .corner::after { content: ''; position: absolute; background: var(--cyan-700); }
        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }
        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        .content {
            position: relative; z-index: 10; text-align: center;
            width: 100%; max-width: 1100px; padding: 0 3rem;
            display: flex; flex-direction: column; align-items: center;
        }

        .section-title {
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 5rem;
            letter-spacing: -0.5px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .section-title .highlight {
            color: var(--cyan-400);
        }

        /* === Two pairs side by side === */
        .pairs {
            display: flex;
            align-items: stretch;
            gap: 4rem;
            margin-bottom: 4rem;
        }

        .pair {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            opacity: 0;
            min-width: 380px;
        }

        .pair:nth-child(1) { animation: fadeUp 0.8s ease-out 0.7s forwards; }
        .pair:nth-child(3) { animation: fadeUp 0.8s ease-out 1.3s forwards; }

        .duo {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .person {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }

        .person-icon {
            font-size: 3.6rem;
            line-height: 1;
            color: #94a3b8;
        }

        .pair--ideal .person-icon { color: var(--cyan-400); }

        .person-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #64748b;
        }

        .link {
            font-size: 1.6rem;
            color: #475569;
            opacity: 0.6;
        }

        .pair-tag {
            font-size: 0.7rem;
            padding: 0.4em 1em;
            border-radius: 100px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #64748b;
            border: 1px solid rgba(100,116,139,0.25);
        }

        .pair--ideal .pair-tag {
            color: var(--cyan-400);
            border-color: rgba(34,211,238,0.3);
        }

        /* Vertical divider */
        .divider {
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(100,116,139,0.3), transparent);
            opacity: 0;
            animation: fadeIn 0.8s ease-out 1.0s forwards;
        }

        /* === Bottom takeaway === */
        .takeaway {
            font-size: 1.15rem;
            font-weight: 400;
            color: #94a3b8;
            line-height: 1.6;
            max-width: 720px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.7s forwards;
        }

        .takeaway .highlight {
            color: var(--cyan-400);
            font-weight: 600;
        }

        .takeaway s {
            color: #475569;
            text-decoration-color: rgba(100,116,139,0.4);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <h2 class="section-title">Odkyrwaj subdomeny wspólnie</h2>

            <div class="pairs">
                <div class="pair pair--ideal">
                    <div class="duo">
                        <div class="person">
                            <span class="person-icon"><i class="ti ti-user"></i></span>
                            <span class="person-label">Architekt</span>
                        </div>
                        <span class="link"><i class="ti ti-messages"></i></span>
                        <div class="person">
                            <span class="person-icon"><i class="ti ti-user-check"></i></span>
                            <span class="person-label">Domain Expert</span>
                        </div>
                    </div>
                    <span class="pair-tag">Ideał</span>
                </div>

                <div class="divider"></div>

                <div class="pair">
                    <div class="duo">
                        <div class="person">
                            <span class="person-icon"><i class="ti ti-user"></i></span>
                            <span class="person-label">Architekt</span>
                        </div>
                        <span class="link"><i class="ti ti-messages"></i></span>
                        <div class="person">
                            <span class="person-icon"><i class="ti ti-robot"></i></span>
                            <span class="person-label">AI</span>
                        </div>
                    </div>
                    <span class="pair-tag">Gdy nie masz z kim</span>
                </div>
            </div>

            <p class="takeaway">AI nie da Ci odpowiedzi, ale <span class="highlight">da Ci punkt startu</span>.</p>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">

        <div class="camera-box">
            kamera 480 &times; 270
        </div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
