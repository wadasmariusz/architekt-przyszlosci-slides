<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 09 - Zalety podejścia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }

        .bg-glow {
            position: absolute; width: 1000px; height: 1000px; border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 60%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: bgpulse 6s ease-in-out infinite;
        }
        @keyframes bgpulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            background: var(--cyan-400); opacity: 0; animation: float 8s ease-in-out infinite;
        }
        .particle:nth-child(3) { top: 12%; left: 8%;  animation-delay: 0s; }
        .particle:nth-child(4) { top: 65%; left: 88%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 25%; left: 72%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 78%; left: 15%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 45%; left: 55%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 18%; left: 42%; animation-delay: 2s; }

        @keyframes float {
            0%   { opacity: 0; transform: translateY(0) scale(1); }
            20%  { opacity: 0.8; } 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner { position: absolute; width: 60px; height: 60px; z-index: 1; }
        .corner::before, .corner::after { content: ''; position: absolute; background: var(--cyan-700); }
        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }
        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative; z-index: 10; text-align: center;
            width: 100%; max-width: 1200px; padding: 0 3rem;
            display: flex; flex-direction: column; align-items: center;
            gap: 3.5rem;
        }

        .section-title {
            font-size: clamp(2.2rem, 4vw, 3.4rem);
            font-weight: 800;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .section-title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        /* === Pillars === */
        .pillars {
            display: flex;
            gap: 3rem;
            width: 100%;
            justify-content: center;
        }

        .pillar {
            flex: 1;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(6,182,212,0.15);
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        .pillar:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(6,182,212,0.12);
        }

        .pillar:nth-child(1) { animation: scaleIn 0.7s ease-out 0.6s forwards; }
        .pillar:nth-child(2) { animation: scaleIn 0.7s ease-out 1.0s forwards; }
        .pillar:nth-child(3) { animation: scaleIn 0.7s ease-out 1.4s forwards; }

        .pillar:nth-child(1):hover { border-color: var(--cyan-400); }
        .pillar:nth-child(2):hover { border-color: #a78bfa; }
        .pillar:nth-child(3):hover { border-color: #4ade80; }

        @keyframes scaleIn {
            0%   { opacity: 0; transform: scale(0.8) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Icon */
        .pillar-icon {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .pillar-icon i { font-size: 1.6rem; }

        .pillar:nth-child(1) .pillar-icon {
            background: rgba(6,182,212,0.1);
            border: 2px solid rgba(6,182,212,0.3);
            box-shadow: 0 0 24px rgba(6,182,212,0.12);
        }
        .pillar:nth-child(1) .pillar-icon i { color: var(--cyan-400); }

        .pillar:nth-child(2) .pillar-icon {
            background: rgba(167,139,250,0.1);
            border: 2px solid rgba(167,139,250,0.3);
            box-shadow: 0 0 24px rgba(167,139,250,0.12);
        }
        .pillar:nth-child(2) .pillar-icon i { color: #a78bfa; }

        .pillar:nth-child(3) .pillar-icon {
            background: rgba(74,222,128,0.1);
            border: 2px solid rgba(74,222,128,0.3);
            box-shadow: 0 0 24px rgba(74,222,128,0.12);
        }
        .pillar:nth-child(3) .pillar-icon i { color: #4ade80; }

        /* Number badge */
        .pillar-num {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--dark-bg);
            border: 2px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: 800;
        }

        .pillar:nth-child(1) .pillar-num { border-color: var(--cyan-400); color: var(--cyan-400); }
        .pillar:nth-child(2) .pillar-num { border-color: #a78bfa; color: #a78bfa; }
        .pillar:nth-child(3) .pillar-num { border-color: #4ade80; color: #4ade80; }

        /* Text */
        .pillar-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #f0f4f8;
        }

        .pillar-desc {
            font-size: 1rem;
            font-weight: 300;
            color: #94a3b8;
            line-height: 1.6;
            text-align: center;
        }

        /* === Animations === */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .camera-box {
            position: absolute;
            bottom: 40px; right: 40px;
            width: 480px; height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }

        .slide-logo {
            position: absolute; z-index: 100;
            bottom: 40px; left: 40px;
            height: 100px; width: auto;
            opacity: 0.85; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <h2 class="section-title">Trzy filary <span class="highlight">Bounded Context</span></h2>

            <div class="pillars">
                <!-- 1. Jasne odpowiedzialności -->
                <div class="pillar">
                    <div class="pillar-icon">
                        <span class="pillar-num">1</span>
                        <i class="ti ti-target"></i>
                    </div>
                    <span class="pillar-title">Jasne odpowiedzialności</span>
                </div>

                <!-- 2. Lokalne zmiany -->
                <div class="pillar">
                    <div class="pillar-icon">
                        <span class="pillar-num">2</span>
                        <i class="ti ti-shield-lock"></i>
                    </div>
                    <span class="pillar-title">Lokalne zmiany</span>
                </div>

                <!-- 3. System jak klocki -->
                <div class="pillar">
                    <div class="pillar-icon">
                        <span class="pillar-num">3</span>
                        <i class="ti ti-puzzle"></i>
                    </div>
                    <span class="pillar-title">System jak klocki</span>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">

        <div class="camera-box">
            kamera 480 &times; 270
        </div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
