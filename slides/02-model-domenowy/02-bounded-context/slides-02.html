<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 02 - Problem: znajomy scenariusz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }

        .bg-glow {
            position: absolute; width: 1000px; height: 1000px; border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 60%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: bgpulse 6s ease-in-out infinite;
        }
        @keyframes bgpulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            background: var(--cyan-400); opacity: 0; animation: float 8s ease-in-out infinite;
        }
        .particle:nth-child(3) { top: 12%; left: 8%;  animation-delay: 0s; }
        .particle:nth-child(4) { top: 65%; left: 88%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 25%; left: 72%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 78%; left: 15%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 45%; left: 55%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 18%; left: 42%; animation-delay: 2s; }

        @keyframes float {
            0%   { opacity: 0; transform: translateY(0) scale(1); }
            20%  { opacity: 0.8; } 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        /* === Corner accents === */
        .corner { position: absolute; width: 60px; height: 60px; z-index: 1; }
        .corner::before, .corner::after { content: ''; position: absolute; background: var(--cyan-700); }
        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }
        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative; z-index: 10; text-align: center;
            width: 100%; max-width: 1200px; padding: 0 3rem;
            display: flex; flex-direction: column; align-items: center;
            gap: 2.5rem;
        }

        /* === Title === */
        .section-title {
            font-size: clamp(2.2rem, 4vw, 3.4rem);
            font-weight: 800;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .section-title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        /* === Bullet points === */
        .bullets {
            display: flex;
            gap: 2rem;
            justify-content: center;
        }

        .bullet {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1.4rem;
            border-radius: 100px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(6,182,212,0.15);
            font-size: 1.3rem;
            font-weight: 600;
            color: #94a3b8;
            opacity: 0;
        }

        .bullet i { font-size: 1.5rem; color: var(--cyan-400); }

        .bullet:nth-child(1) { animation: fadeUp 0.6s ease-out 0.7s forwards; }
        .bullet:nth-child(2) { animation: fadeUp 0.6s ease-out 1.0s forwards; }
        .bullet:nth-child(3) { animation: fadeUp 0.6s ease-out 1.3s forwards; }

        /* === Timeline === */
        .timeline {
            width: 100%;
            max-width: 1000px;
            position: relative;
            height: 320px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 1.6s forwards;
        }

        /* Horizontal axis */
        .timeline-axis {
            position: absolute;
            bottom: 140px;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(148,163,184,0.2);
        }

        .timeline-axis::after {
            content: '';
            position: absolute;
            left: 0; top: -1px;
            height: 4px;
            background: linear-gradient(90deg, var(--cyan-500), #ef4444);
            width: 0;
            animation: axisGrow 1.5s ease-out 1.8s forwards;
        }

        @keyframes axisGrow { to { width: 100%; } }

        /* Time labels */
        .time-label {
            position: absolute;
            bottom: 110px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
        }

        .time-label--start {
            left: 60px;
            color: var(--cyan-400);
            animation: fadeIn 0.4s ease-out 2.0s forwards;
        }

        .time-label--mid {
            left: 50%;
            transform: translateX(-50%);
            color: #94a3b8;
            animation: fadeIn 0.4s ease-out 2.6s forwards;
        }

        .time-label--end {
            right: 60px;
            color: #ef4444;
            animation: fadeIn 0.4s ease-out 3.2s forwards;
        }

        /* === Clean side (left) === */
        .side-clean {
            position: absolute;
            left: 30px;
            bottom: 160px;
            display: flex;
            gap: 12px;
            opacity: 0;
            animation: fadeUp 0.6s ease-out 2.2s forwards;
        }

        .clean-block {
            width: 70px;
            height: 55px;
            border-radius: 10px;
            border: 2px solid var(--cyan-500);
            background: rgba(6,182,212,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clean-block i {
            font-size: 1.6rem;
            color: var(--cyan-400);
        }

        /* Clean connections */
        .clean-lines {
            position: absolute;
            left: 30px;
            bottom: 160px;
            width: 240px;
            height: 60px;
            opacity: 0;
            animation: fadeIn 0.4s ease-out 2.5s forwards;
        }

        .clean-lines svg { width: 100%; height: 100%; }

        .clean-line {
            stroke: var(--cyan-700);
            stroke-width: 1.5;
            fill: none;
            opacity: 0.6;
        }

        /* === Chaotic side (right) === */
        .side-chaos {
            position: absolute;
            right: 20px;
            bottom: 148px;
            width: 320px;
            height: 160px;
            opacity: 0;
            animation: fadeUp 0.6s ease-out 2.8s forwards;
        }

        .chaos-block {
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 10px;
            border: 1.5px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .chaos-block i {
            font-size: 1.6rem;
        }

        /* Row 1 */
        .chaos-block:nth-child(1) { left: 10px;  top: 0;    border-color: rgba(239,68,68,0.5); background: rgba(239,68,68,0.08); color: rgba(239,68,68,0.6); transform: rotate(-2deg); }
        .chaos-block:nth-child(2) { left: 134px; top: 5px;   border-color: rgba(251,146,60,0.5); background: rgba(251,146,60,0.08); color: rgba(251,146,60,0.6); transform: rotate(1deg); }
        .chaos-block:nth-child(3) { left: 258px; top: 0;     border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.06); color: rgba(239,68,68,0.55); transform: rotate(-1deg); }
        /* Row 2 */
        .chaos-block:nth-child(4) { left: 0;    top: 80px;  border-color: rgba(251,146,60,0.4); background: rgba(251,146,60,0.06); color: rgba(251,146,60,0.55); transform: rotate(2deg); }
        .chaos-block:nth-child(5) { left: 124px; top: 85px;  border-color: rgba(239,68,68,0.5); background: rgba(239,68,68,0.08); color: rgba(239,68,68,0.6); transform: rotate(-1.5deg); }
        .chaos-block:nth-child(6) { left: 248px; top: 78px;  border-color: rgba(251,146,60,0.5); background: rgba(251,146,60,0.07); color: rgba(251,146,60,0.6); transform: rotate(1deg); }

        /* Chaotic connections */
        .chaos-lines {
            position: absolute;
            right: 20px;
            bottom: 148px;
            width: 320px;
            height: 160px;
            opacity: 0;
            z-index: 1;
        }

        .chaos-lines svg { width: 100%; height: 100%; }

        .chaos-line {
            stroke-width: 1.2;
            fill: none;
            opacity: 0;
        }

        .chaos-line--red    { stroke: rgba(239,68,68,0.35); }
        .chaos-line--orange { stroke: rgba(251,146,60,0.30); }
        .chaos-line--dim    { stroke: rgba(239,68,68,0.18); }

        /* Staggered line appearance for dramatic effect */
        .chaos-lines { animation: fadeIn 0.3s ease-out 3.0s forwards; }
        .chaos-line:nth-child(1)  { animation: lineIn 0.3s ease-out 3.1s forwards; }
        .chaos-line:nth-child(2)  { animation: lineIn 0.3s ease-out 3.2s forwards; }
        .chaos-line:nth-child(3)  { animation: lineIn 0.3s ease-out 3.25s forwards; }
        .chaos-line:nth-child(4)  { animation: lineIn 0.3s ease-out 3.3s forwards; }
        .chaos-line:nth-child(5)  { animation: lineIn 0.3s ease-out 3.4s forwards; }
        .chaos-line:nth-child(6)  { animation: lineIn 0.3s ease-out 3.45s forwards; }
        .chaos-line:nth-child(7)  { animation: lineIn 0.3s ease-out 3.5s forwards; }
        .chaos-line:nth-child(8)  { animation: lineIn 0.3s ease-out 3.55s forwards; }
        .chaos-line:nth-child(9)  { animation: lineIn 0.3s ease-out 3.6s forwards; }
        .chaos-line:nth-child(10) { animation: lineIn 0.3s ease-out 3.65s forwards; }
        .chaos-line:nth-child(11) { animation: lineIn 0.3s ease-out 3.7s forwards; }
        .chaos-line:nth-child(12) { animation: lineIn 0.3s ease-out 3.75s forwards; }
        .chaos-line:nth-child(13) { animation: lineIn 0.3s ease-out 3.8s forwards; }
        .chaos-line:nth-child(14) { animation: lineIn 0.3s ease-out 3.85s forwards; }
        .chaos-line:nth-child(15) { animation: lineIn 0.3s ease-out 3.9s forwards; }

        @keyframes lineIn { from { opacity: 0; } to { opacity: 1; } }

        /* === "A potem..." text === */
        .then-text {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.4rem;
            font-weight: 300;
            color: #64748b;
            font-style: italic;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 3.5s forwards;
        }

        .then-text strong {
            color: #ef4444;
            font-weight: 600;
        }

        /* === Animations === */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .camera-box {
            position: absolute;
            bottom: 40px; right: 40px;
            width: 480px; height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }

        .slide-logo {
            position: absolute; z-index: 100;
            bottom: 40px; left: 40px;
            height: 100px; width: auto;
            opacity: 0.85; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <h2 class="section-title">Zaczynamy <span class="highlight">świeży projekt...</span></h2>

            <!-- Bullet points -->
            <div class="bullets">
                <div class="bullet"><i class="ti ti-sparkles"></i> Czysta architektura</div>
                <div class="bullet"><i class="ti ti-rocket"></i> Nowe technologie</div>
                <div class="bullet"><i class="ti ti-thumb-up"></i> Wszystko działa</div>
            </div>

            <!-- Timeline visualization -->
            <div class="timeline">
                <div class="then-text">A potem... mija <strong>rok, dwa...</strong></div>

                <!-- Axis -->
                <div class="timeline-axis"></div>
                <span class="time-label time-label--start">Dzień 1</span>
                <span class="time-label time-label--mid">6 miesięcy</span>
                <span class="time-label time-label--end">2 lata</span>

                <!-- Clean side -->
                <div class="side-clean">
                    <div class="clean-block"><i class="ti ti-box"></i></div>
                    <div class="clean-block"><i class="ti ti-box"></i></div>
                    <div class="clean-block"><i class="ti ti-box"></i></div>
                </div>
                <div class="clean-lines">
                    <svg viewBox="0 0 240 60" preserveAspectRatio="xMidYMid meet">
                        <line class="clean-line" x1="70" y1="30" x2="82" y2="30" />
                        <line class="clean-line" x1="152" y1="30" x2="164" y2="30" />
                    </svg>
                </div>

                <!-- Chaotic side - 6 modules in grid with dense coupling -->
                <div class="side-chaos">
                    <!-- Row 1 -->
                    <div class="chaos-block"><i class="ti ti-users"></i></div>
                    <div class="chaos-block"><i class="ti ti-shopping-cart"></i></div>
                    <div class="chaos-block"><i class="ti ti-credit-card"></i></div>
                    <!-- Row 2 -->
                    <div class="chaos-block"><i class="ti ti-truck-delivery"></i></div>
                    <div class="chaos-block"><i class="ti ti-chart-bar"></i></div>
                    <div class="chaos-block"><i class="ti ti-mail"></i></div>
                </div>
                <div class="chaos-lines">
                    <svg viewBox="0 0 320 160" preserveAspectRatio="xMidYMid meet">
                        <!--
                            Block centers (52×52):
                            1: (36, 26)   2: (160, 31)   3: (284, 26)
                            4: (26, 106)  5: (150, 111)  6: (274, 104)
                        -->
                        <!-- 1-2 --> <path class="chaos-line chaos-line--red"    d="M62,26 C100,10 120,18 134,31" />
                        <!-- 1-3 --> <path class="chaos-line chaos-line--orange" d="M62,20 C140,-2 210,2 258,26" />
                        <!-- 1-4 --> <path class="chaos-line chaos-line--dim"    d="M36,52 C20,72 18,88 26,80" />
                        <!-- 1-5 --> <path class="chaos-line chaos-line--red"    d="M50,52 C75,75 110,95 150,85" />
                        <!-- 1-6 --> <path class="chaos-line chaos-line--orange" d="M62,40 C120,65 200,110 248,104" />
                        <!-- 2-3 --> <path class="chaos-line chaos-line--red"    d="M186,31 C215,15 245,18 258,26" />
                        <!-- 2-4 --> <path class="chaos-line chaos-line--dim"    d="M134,38 C95,58 50,82 52,106" />
                        <!-- 2-5 --> <path class="chaos-line chaos-line--orange" d="M160,57 C156,72 152,85 150,85" />
                        <!-- 2-6 --> <path class="chaos-line chaos-line--red"    d="M186,38 C220,58 248,78 274,82" />
                        <!-- 3-4 --> <path class="chaos-line chaos-line--orange" d="M258,52 C210,75 90,95 52,106" />
                        <!-- 3-5 --> <path class="chaos-line chaos-line--dim"    d="M270,52 C240,72 185,90 176,111" />
                        <!-- 3-6 --> <path class="chaos-line chaos-line--red"    d="M284,52 C282,68 278,82 274,82" />
                        <!-- 4-5 --> <path class="chaos-line chaos-line--orange" d="M52,106 C80,120 115,118 124,111" />
                        <!-- 4-6 --> <path class="chaos-line chaos-line--dim"    d="M52,106 C120,135 210,125 248,104" />
                        <!-- 5-6 --> <path class="chaos-line chaos-line--red"    d="M176,111 C205,120 240,115 248,104" />
                    </svg>
                </div>
            </div>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">

        <div class="camera-box">
            kamera 480 &times; 270
        </div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
