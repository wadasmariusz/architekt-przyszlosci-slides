<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 01 - Bounded Context</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }

        .bg-glow {
            position: absolute; width: 1000px; height: 1000px; border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 60%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: pulse 6s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            background: var(--cyan-400); opacity: 0; animation: float 8s ease-in-out infinite;
        }
        .particle:nth-child(3) { top: 15%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(4) { top: 70%; left: 85%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 30%; left: 75%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 80%; left: 20%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 50%; left: 50%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 20%; left: 60%; animation-delay: 2s; }

        @keyframes float {
            0%   { opacity: 0; transform: translateY(0) scale(1); }
            20%  { opacity: 0.8; } 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        /* === Corner accents === */
        .corner { position: absolute; width: 60px; height: 60px; z-index: 1; }
        .corner::before, .corner::after { content: ''; position: absolute; background: var(--cyan-700); }
        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }
        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative; z-index: 10; text-align: center;
            width: 100%; max-width: 1100px; padding: 0 3rem;
            display: flex; flex-direction: column; align-items: center;
        }

        /* === Boxes illustration === */
        .boxes-container {
            position: relative;
            width: 520px;
            height: 140px;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.2s forwards;
        }

        .box {
            position: absolute;
            border-radius: 12px;
            border: 2px solid;
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box i {
            font-size: 1.4rem;
            opacity: 0.7;
        }

        .box:nth-child(1) {
            width: 100px; height: 80px; top: 10px; left: 0;
            border-color: var(--cyan-500);
            background: rgba(6,182,212,0.08);
            animation: boxAppear 0.6s ease-out 0.4s forwards;
        }
        .box:nth-child(1) i { color: var(--cyan-400); }

        .box:nth-child(2) {
            width: 110px; height: 90px; top: 25px; left: 140px;
            border-color: var(--cyan-600);
            background: rgba(6,182,212,0.06);
            animation: boxAppear 0.6s ease-out 0.7s forwards;
        }
        .box:nth-child(2) i { color: var(--cyan-500); }

        .box:nth-child(3) {
            width: 90px; height: 75px; top: 0; left: 290px;
            border-color: #f59e0b;
            background: rgba(245,158,11,0.06);
            animation: boxAppear 0.6s ease-out 1.0s forwards;
        }
        .box:nth-child(3) i { color: #f59e0b; }

        .box:nth-child(4) {
            width: 105px; height: 85px; top: 30px; left: 415px;
            border-color: #8b5cf6;
            background: rgba(139,92,246,0.06);
            animation: boxAppear 0.6s ease-out 1.3s forwards;
        }
        .box:nth-child(4) i { color: #8b5cf6; }

        @keyframes boxAppear {
            from { opacity: 0; transform: scale(0.7); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* === Connection lines (SVG) === */
        .connections {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .connections svg {
            width: 100%;
            height: 100%;
        }

        .conn-line {
            stroke: var(--cyan-700);
            stroke-width: 1.5;
            fill: none;
            stroke-dasharray: 120;
            stroke-dashoffset: 120;
            opacity: 0.5;
        }

        .conn-line:nth-child(1) { animation: drawLine 0.8s ease-out 1.5s forwards; }
        .conn-line:nth-child(2) { animation: drawLine 0.8s ease-out 1.8s forwards; }
        .conn-line:nth-child(3) { animation: drawLine 0.8s ease-out 2.1s forwards; }

        @keyframes drawLine { to { stroke-dashoffset: 0; } }

        /* === Pulsing boxes === */
        .box {
            animation-fill-mode: forwards;
        }

        .box.pulsing {
            animation: boxPulse 3s ease-in-out infinite;
        }

        @keyframes boxPulse {
            0%, 100% { box-shadow: 0 0 0 rgba(6,182,212,0); }
            50%      { box-shadow: 0 0 18px rgba(6,182,212,0.12); }
        }

        /* === Title with typewriter === */
        h1.title {
            font-size: clamp(2.2rem, 5vw, 4.2rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.2rem;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeUp 1s ease-out 2.4s forwards;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        /* === Subtitle === */
        .subtitle {
            font-size: clamp(1rem, 1.8vw, 1.35rem);
            color: #94a3b8;
            font-weight: 300;
            letter-spacing: 2px;
            max-width: 750px;
            line-height: 1.6;
            opacity: 0;
            animation: fadeUp 1s ease-out 2.8s forwards;
        }

        .subtitle strong {
            color: var(--cyan-400);
            font-weight: 600;
        }

        /* === Animations === */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .camera-box {
            position: absolute;
            bottom: 40px; right: 40px;
            width: 480px; height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }

        .slide-logo {
            position: absolute; z-index: 100;
            bottom: 40px; left: 40px;
            height: 100px; width: auto;
            opacity: 0.85; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <!-- Abstract boxes illustration -->
            <div class="boxes-container">
                <div class="box"><i class="ti ti-box"></i></div>
                <div class="box"><i class="ti ti-box"></i></div>
                <div class="box"><i class="ti ti-box"></i></div>
                <div class="box"><i class="ti ti-box"></i></div>

                <!-- Connection lines between boxes -->
                <div class="connections">
                    <svg viewBox="0 0 520 140" preserveAspectRatio="xMidYMid meet">
                        <line class="conn-line" x1="100" y1="50" x2="140" y2="70" />
                        <line class="conn-line" x1="250" y1="70" x2="290" y2="38" />
                        <line class="conn-line" x1="380" y1="38" x2="415" y2="72" />
                    </svg>
                </div>
            </div>

            <h1 class="title"><span class="highlight">Bounded Context</span></h1>
            <p class="subtitle">klucz do utrzymania <strong>porządku</strong> w systemie</p>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">

        <div class="camera-box">
            kamera 480 &times; 270
        </div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();

            // Add pulsing after initial appear animations
            setTimeout(function () {
                document.querySelectorAll('.box').forEach(function (b) {
                    b.style.animation = 'boxPulse 3s ease-in-out infinite';
                    b.style.opacity = '1';
                });
            }, 2400);
        })();
    </script>
</body>
</html>
