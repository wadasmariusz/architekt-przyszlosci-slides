<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 14 - Zakończenie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #030712;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }

        .bg-glow {
            position: absolute; width: 1000px; height: 1000px; border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 60%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: bgpulse 6s ease-in-out infinite;
        }
        @keyframes bgpulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            background: var(--cyan-400); opacity: 0; animation: float 8s ease-in-out infinite;
        }
        .particle:nth-child(3) { top: 12%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(4) { top: 68%; left: 84%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 24%; left: 78%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 80%; left: 16%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 50%; left: 48%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 16%; left: 56%; animation-delay: 2s; }

        @keyframes float {
            0%   { opacity: 0; transform: translateY(0) scale(1); }
            20%  { opacity: 0.8; } 80% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        .corner { position: absolute; width: 60px; height: 60px; z-index: 1; }
        .corner::before, .corner::after { content: ''; position: absolute; background: var(--cyan-700); }
        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }
        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative; z-index: 10; text-align: center;
            width: 100%; max-width: 1100px; padding: 0 3rem;
            display: flex; flex-direction: column; align-items: center;
        }

        /* === Boxes callback from slide 01 === */
        .boxes-row {
            display: flex;
            gap: 10px;
            margin-bottom: 3rem;
        }

        .box {
            border-radius: 10px;
            border: 2px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
        }

        .box i { font-size: 1rem; opacity: 0.6; }

        .box:nth-child(1) {
            width: 60px; height: 50px;
            border-color: var(--cyan-500); background: rgba(6,182,212,0.06);
            animation: boxLight 0.5s ease-out 0.4s forwards;
        }
        .box:nth-child(1) i { color: var(--cyan-400); }

        .box:nth-child(2) {
            width: 70px; height: 55px;
            border-color: var(--cyan-600); background: rgba(6,182,212,0.03);
            animation: boxLight 0.5s ease-out 0.7s forwards;
        }
        .box:nth-child(2) i { color: var(--cyan-500); }

        .box:nth-child(3) {
            width: 55px; height: 48px;
            border-color: #f59e0b; background: rgba(245,158,11,0.04);
            animation: boxLight 0.5s ease-out 1.0s forwards;
        }
        .box:nth-child(3) i { color: #f59e0b; }

        .box:nth-child(4) {
            width: 65px; height: 52px;
            border-color: #8b5cf6; background: rgba(139,92,246,0.04);
            animation: boxLight 0.5s ease-out 1.3s forwards;
        }
        .box:nth-child(4) i { color: #8b5cf6; }

        @keyframes boxLight {
            0%   { opacity: 0; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Pulsing after appear */
        .box.pulsing { animation: boxPulse 3s ease-in-out infinite; }
        @keyframes boxPulse {
            0%, 100% { box-shadow: 0 0 0 transparent; }
            50%      { box-shadow: 0 0 16px rgba(6,182,212,0.12); }
        }

        /* === Title === */
        h1.title {
            font-size: clamp(2.4rem, 5vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeUp 1s ease-out 1.6s forwards;
            letter-spacing: -1px;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .subtitle {
            font-size: clamp(1.2rem, 2vw, 1.6rem);
            color: #94a3b8;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeUp 1s ease-out 2.0s forwards;
        }

        /* === Animations === */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .camera-box {
            position: absolute;
            bottom: 40px; right: 40px;
            width: 480px; height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }

        .slide-logo {
            position: absolute; z-index: 100;
            bottom: 40px; left: 40px;
            height: 100px; width: auto;
            opacity: 0.85; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <!-- Boxes callback from slide 01 -->
            <div class="boxes-row">
                <div class="box"><i class="ti ti-box"></i></div>
                <div class="box"><i class="ti ti-box"></i></div>
                <div class="box"><i class="ti ti-box"></i></div>
                <div class="box"><i class="ti ti-box"></i></div>
            </div>

            <h1 class="title"><span class="highlight">Dziękuję!</span></h1>
            <p class="subtitle">Pytania?</p>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png" alt="Architekt Przyszłości" class="slide-logo">

        <div class="camera-box">
            kamera 480 &times; 270
        </div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();

            // Add pulsing after boxes appear
            setTimeout(function () {
                document.querySelectorAll('.box').forEach(function (b) {
                    b.style.animation = 'boxPulse 3s ease-in-out infinite';
                    b.style.opacity = '1';
                });
            }, 1800);
        })();
    </script>
</body>
</html>
