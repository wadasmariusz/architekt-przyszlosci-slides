<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 12 - Kaskada awarii w łańcuchu synchronicznym</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
            --fail: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.74), rgba(10,14,23,0.84)),
                url('../../../images/background-1.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.18) 48%, rgba(3,7,18,0.58) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 80px 130px 150px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            max-width: 1400px;
            margin: 0 auto 56px;
        }

        .eyebrow {
            font-size: 22px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--cyan-400);
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        h1.title {
            font-size: 80px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.15;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .highlight.fail {
            background: linear-gradient(135deg, var(--fail), #fb7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === User waiting === */
        .user-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 0 auto 28px;
            padding: 14px 26px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(17,24,39,0.55);
            width: fit-content;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.7s forwards;
        }

        .user-bar i {
            font-size: 24px;
            color: var(--fail);
        }

        .user-bar span {
            font-size: 18px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .user-bar .blink {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--fail);
            margin-left: 6px;
            animation: blink 1.4s ease-in-out infinite;
        }

        /* === Chain === */
        .chain {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            align-items: stretch;
            position: relative;
        }

        .chain-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 6px;
            opacity: 0;
        }

        .chain-item:nth-child(1) { animation: fadeUp 0.7s ease-out 0.85s forwards; }
        .chain-item:nth-child(2) { animation: fadeUp 0.7s ease-out 1.00s forwards; }
        .chain-item:nth-child(3) { animation: fadeUp 0.7s ease-out 1.15s forwards; }
        .chain-item:nth-child(4) { animation: fadeUp 0.7s ease-out 1.30s forwards; }
        .chain-item:nth-child(5) { animation: fadeUp 0.7s ease-out 1.45s forwards; }

        .chain-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chain-status.ok {
            color: var(--cyan-400);
            background: rgba(34,211,238,0.10);
            border: 1px solid rgba(34,211,238,0.20);
        }

        .chain-status.down {
            color: var(--fail);
            background: rgba(248,113,113,0.12);
            border: 1px solid rgba(248,113,113,0.30);
        }

        .chain-status.stuck {
            color: #64748b;
            background: rgba(148,163,184,0.08);
            border: 1px solid rgba(148,163,184,0.20);
        }

        .chain-status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .chain-node {
            width: 100%;
            padding: 26px 18px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(17,24,39,0.66);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-height: 220px;
            justify-content: center;
        }

        .chain-node.failed {
            background: rgba(248,113,113,0.06);
        }

        .chain-node.stuck {
            opacity: 0.55;
        }

        .chain-icon {
            width: 62px;
            height: 62px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background: rgba(34,211,238,0.10);
            color: var(--cyan-400);
        }

        .chain-node.failed .chain-icon {
            background: rgba(248,113,113,0.14);
            color: var(--fail);
        }

        .chain-node.stuck .chain-icon {
            background: rgba(148,163,184,0.08);
            color: #64748b;
        }

        .chain-name {
            font-size: 22px;
            font-weight: 700;
            color: #f0f4f8;
            letter-spacing: -0.2px;
        }

        .chain-node.stuck .chain-name { color: #94a3b8; }

        .chain-role {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }

        /* arrows between */
        .chain-arrow {
            position: absolute;
            top: 50%;
            right: -22px;
            transform: translateY(-50%);
            width: 44px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        .chain-arrow svg { width: 100%; height: 100%; }

        /* === Quote === */
        .quote {
            margin: 56px auto 0;
            max-width: 1500px;
            padding: 28px 36px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(17,24,39,0.55);
            text-align: center;
            font-size: 26px;
            font-weight: 400;
            color: #f0f4f8;
            line-height: 1.5;
            font-style: italic;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.7s forwards;
        }

        .quote strong {
            color: var(--cyan-400);
            font-weight: 700;
            font-style: normal;
        }

        .quote em {
            color: var(--fail);
            font-style: normal;
            font-weight: 600;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="header">
                <div class="eyebrow">Direct Call</div>
                <h1 class="title">Kaskada awarii</br> w <span class="highlight fail">łańcuchu synchronicznym</span></h1>
            </div>

            <div class="user-bar">
                <i class="ti ti-user"></i>
                <span>Użytkownik czeka na response<span class="blink"></span></span>
            </div>

            <div class="chain">
                <div class="chain-item">
                    <span class="chain-status ok"><span class="dot"></span> OK</span>
                    <div class="chain-node">
                        <div class="chain-icon"><i class="ti ti-shopping-cart"></i></div>
                        <div class="chain-name">Checkout</div>
                        <div class="chain-role">entry point</div>
                    </div>
                    <div class="chain-arrow">
                        <svg viewBox="0 0 44 24">
                            <line x1="0" y1="12" x2="34" y2="12"
                                  stroke="#22d3ee" stroke-width="2.5" />
                            <polygon points="34,5 44,12 34,19" fill="#22d3ee" />
                        </svg>
                    </div>
                </div>

                <div class="chain-item">
                    <span class="chain-status ok"><span class="dot"></span> OK</span>
                    <div class="chain-node">
                        <div class="chain-icon"><i class="ti ti-package"></i></div>
                        <div class="chain-name">Inventory</div>
                        <div class="chain-role">dostępność</div>
                    </div>
                    <div class="chain-arrow">
                        <svg viewBox="0 0 44 24">
                            <line x1="0" y1="12" x2="34" y2="12"
                                  stroke="#22d3ee" stroke-width="2.5" />
                            <polygon points="34,5 44,12 34,19" fill="#22d3ee" />
                        </svg>
                    </div>
                </div>

                <div class="chain-item">
                    <span class="chain-status down"><span class="dot"></span> DOWN</span>
                    <div class="chain-node failed">
                        <div class="chain-icon"><i class="ti ti-alert-octagon"></i></div>
                        <div class="chain-name">Pricing</div>
                        <div class="chain-role">cena bazowa</div>
                    </div>
                    <div class="chain-arrow">
                        <svg viewBox="0 0 44 24">
                            <line x1="0" y1="12" x2="34" y2="12"
                                  stroke="#f87171" stroke-width="2.5"
                                  stroke-dasharray="4 4" stroke-opacity="0.6" />
                            <polygon points="34,5 44,12 34,19" fill="#f87171" fill-opacity="0.4" />
                        </svg>
                    </div>
                </div>

                <div class="chain-item">
                    <span class="chain-status stuck"><span class="dot"></span> Zablokowane</span>
                    <div class="chain-node stuck">
                        <div class="chain-icon"><i class="ti ti-discount"></i></div>
                        <div class="chain-name">Discount</div>
                        <div class="chain-role">promocje</div>
                    </div>
                    <div class="chain-arrow">
                        <svg viewBox="0 0 44 24">
                            <line x1="0" y1="12" x2="34" y2="12"
                                  stroke="#64748b" stroke-width="2.5"
                                  stroke-dasharray="4 4" stroke-opacity="0.5" />
                            <polygon points="34,5 44,12 34,19" fill="#64748b" fill-opacity="0.35" />
                        </svg>
                    </div>
                </div>

                <div class="chain-item">
                    <span class="chain-status stuck"><span class="dot"></span> Zablokowane</span>
                    <div class="chain-node stuck">
                        <div class="chain-icon"><i class="ti ti-receipt-tax"></i></div>
                        <div class="chain-name">Tax</div>
                        <div class="chain-role">VAT</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
