<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 14 - Distributed Big Ball of Mud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
            --fail: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.74), rgba(10,14,23,0.84)),
                url('../../../images/background-6.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.18) 48%, rgba(3,7,18,0.58) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 70px 130px 150px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            max-width: 1500px;
            margin: 0 auto 44px;
        }

        .eyebrow {
            font-size: 22px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--fail);
            margin-bottom: 14px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        h1.title {
            font-size: 80px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.15;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .highlight.fail {
            background: linear-gradient(135deg, var(--fail), #fb7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Main layout === */
        .main {
            display: flex;
            justify-content: center;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
        }

        /* === Graph === */
        .graph-wrap {
            position: relative;
            padding: 24px;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(17,24,39,0.55);
            backdrop-filter: blur(6px);
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.75s forwards;
            min-height: 520px;
            width: min(920px, 100%);
        }

        .graph-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .graph-caption {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #64748b;
            background: rgba(10,14,23,0.7);
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .node-label {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            fill: #f0f4f8;
            text-anchor: middle;
        }

        /* === Description panel === */
        .desc-panel {
            padding: 32px 36px;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(17,24,39,0.62);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            gap: 22px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.95s forwards;
        }

        .desc-block {
            padding: 22px 24px;
            border-radius: 14px;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .desc-kicker {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 16px;
        }

        .desc-block.wady .desc-kicker  { color: var(--fail); }
        .desc-block.zera .desc-kicker  { color: #94a3b8; }

        .desc-block.wady .desc-kicker i,
        .desc-block.zera .desc-kicker i { font-size: 18px; }

        .desc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .desc-list li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 19px;
            font-weight: 500;
            color: #f0f4f8;
            line-height: 1.4;
        }

        .desc-block.zera .desc-list li {
            color: #94a3b8;
            text-decoration: line-through;
            text-decoration-color: rgba(148,163,184,0.35);
            text-decoration-thickness: 1px;
        }

        .desc-list .marker {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            margin-top: 3px;
        }

        .desc-block.wady .marker {
            background: rgba(248,113,113,0.12);
            color: var(--fail);
        }

        .desc-block.zera .marker {
            background: rgba(148,163,184,0.10);
            color: #64748b;
        }

        /* === Verdict === */
        .verdict {
            margin: 38px auto 0;
            max-width: 1500px;
            padding: 26px 36px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(17,24,39,0.55);
            display: flex;
            align-items: center;
            gap: 24px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.25s forwards;
        }

        .verdict-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--fail);
            white-space: nowrap;
            padding-right: 22px;
            border-right: 1px solid rgba(255,255,255,0.10);
        }

        .verdict-badge i { font-size: 22px; }

        .verdict-text {
            font-size: 26px;
            font-weight: 500;
            color: #f0f4f8;
            line-height: 1.4;
            font-style: italic;
        }

        .verdict-text strong {
            color: var(--fail);
            font-weight: 700;
            font-style: normal;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes graphPulse {
            0%, 100% { opacity: 0.55; }
            50%      { opacity: 0.85; }
        }

        .graph-line {
            animation: graphPulse 3.5s ease-in-out infinite;
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="header">
                <div class="eyebrow"><i class="ti ti-alert-triangle"></i>Direct Call</div>
                <h1 class="title">Distributed <span class="highlight fail">Big Ball of Mud</span></h1>
            </div>

            <div class="main">
                <div class="graph-wrap">
                    <svg class="graph-svg" viewBox="0 0 700 480" preserveAspectRatio="xMidYMid meet">
                        <defs>
                            <marker id="arrMud" viewBox="0 0 10 10" refX="9" refY="5"
                                    markerWidth="7" markerHeight="7" orient="auto">
                                <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee" fill-opacity="0.6" />
                            </marker>
                        </defs>

                        <!-- chaotic connections -->
                        <g stroke="#22d3ee" stroke-width="1.4" stroke-opacity="0.55" fill="none" marker-end="url(#arrMud)">
                            <line class="graph-line" x1="170" y1="110" x2="520" y2="120" />
                            <line class="graph-line" x1="350" y1="60"  x2="170" y2="380" />
                            <line class="graph-line" x1="520" y1="120" x2="170" y2="380" />
                            <line class="graph-line" x1="600" y1="240" x2="120" y2="240" />
                            <line class="graph-line" x1="540" y1="380" x2="170" y2="110" />
                            <line class="graph-line" x1="350" y1="430" x2="350" y2="60"  />
                            <line class="graph-line" x1="170" y1="240" x2="540" y2="380" />
                            <line class="graph-line" x1="600" y1="240" x2="170" y2="380" />
                            <line class="graph-line" x1="350" y1="60"  x2="540" y2="380" />
                            <line class="graph-line" x1="120" y1="240" x2="350" y2="430" />
                            <line class="graph-line" x1="170" y1="110" x2="540" y2="380" />
                            <line class="graph-line" x1="540" y1="380" x2="170" y2="240" />
                            <line class="graph-line" x1="520" y1="120" x2="350" y2="430" />
                            <line class="graph-line" x1="170" y1="380" x2="600" y2="240" />
                            <line class="graph-line" x1="350" y1="240" x2="170" y2="110" />
                            <line class="graph-line" x1="350" y1="240" x2="520" y2="120" />
                            <line class="graph-line" x1="350" y1="240" x2="170" y2="380" />
                            <line class="graph-line" x1="350" y1="240" x2="540" y2="380" />
                            <line class="graph-line" x1="350" y1="240" x2="350" y2="430" />
                            <line class="graph-line" x1="350" y1="240" x2="120" y2="240" />
                            <line class="graph-line" x1="350" y1="240" x2="600" y2="240" />
                            <line class="graph-line" x1="120" y1="240" x2="520" y2="120" />
                            <line class="graph-line" x1="600" y1="240" x2="170" y2="110" />
                            <line class="graph-line" x1="170" y1="380" x2="540" y2="120" />
                        </g>

                        <!-- nodes -->
                        <g>
                            <!-- top -->
                            <circle cx="350" cy="60"  r="30" fill="#111827" stroke="#22d3ee" stroke-width="2" />
                            <text class="node-label" x="350" y="64">Auth</text>

                            <!-- upper-left -->
                            <circle cx="170" cy="110" r="30" fill="#111827" stroke="#22d3ee" stroke-width="2" />
                            <text class="node-label" x="170" y="114">Orders</text>

                            <!-- upper-right -->
                            <circle cx="520" cy="120" r="30" fill="#111827" stroke="#22d3ee" stroke-width="2" />
                            <text class="node-label" x="520" y="124">Pricing</text>

                            <!-- center -->
                            <circle cx="350" cy="240" r="32" fill="#111827" stroke="#f87171" stroke-width="2" />
                            <text class="node-label" x="350" y="244" fill="#fca5a5">Checkout</text>

                            <!-- left -->
                            <circle cx="120" cy="240" r="30" fill="#111827" stroke="#22d3ee" stroke-width="2" />
                            <text class="node-label" x="120" y="244">Cart</text>

                            <!-- right -->
                            <circle cx="600" cy="240" r="30" fill="#111827" stroke="#22d3ee" stroke-width="2" />
                            <text class="node-label" x="600" y="244">Inventory</text>

                            <!-- lower-left -->
                            <circle cx="170" cy="380" r="30" fill="#111827" stroke="#22d3ee" stroke-width="2" />
                            <text class="node-label" x="170" y="384">Notify</text>

                            <!-- lower-right -->
                            <circle cx="540" cy="380" r="30" fill="#111827" stroke="#22d3ee" stroke-width="2" />
                            <text class="node-label" x="540" y="384">Discount</text>

                            <!-- bottom -->
                            <circle cx="350" cy="430" r="30" fill="#111827" stroke="#22d3ee" stroke-width="2" />
                            <text class="node-label" x="350" y="434">Tax</text>
                        </g>
                    </svg>
                </div>
            </div>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
