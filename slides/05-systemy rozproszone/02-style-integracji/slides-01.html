<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 01 - Cztery style integracji modułów</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.72), rgba(10,14,23,0.82)),
                url('../../../images/background-3.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.18) 48%, rgba(3,7,18,0.58) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 86px 130px 150px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            max-width: 1280px;
            margin: 0 auto 56px;
        }

        .eyebrow {
            font-size: 22px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--cyan-400);
            margin-bottom: 18px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        h1.title {
            font-size: 80px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.15;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Styles grid === */
        .styles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
        }

        .style-card {
            position: relative;
            padding: 36px 40px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(17,24,39,0.62);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 26px;
            opacity: 0;
        }

        .style-card:nth-child(1) { animation: fadeUp 0.7s ease-out 0.75s forwards; }
        .style-card:nth-child(2) { animation: fadeUp 0.7s ease-out 0.90s forwards; }
        .style-card:nth-child(3) { animation: fadeUp 0.7s ease-out 1.05s forwards; }
        .style-card:nth-child(4) { animation: fadeUp 0.7s ease-out 1.20s forwards; }

        .style-icon {
            flex: 0 0 auto;
            width: 76px;
            height: 76px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            background: rgba(34,211,238,0.10);
            color: var(--cyan-400);
        }

        .style-body {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .style-name {
            font-size: 34px;
            font-weight: 700;
            color: #f0f4f8;
            letter-spacing: -0.3px;
        }

        .style-label {
            font-size: 21px;
            font-weight: 400;
            color: #94a3b8;
        }

        /* === Thesis === */
        .thesis {
            margin: 56px auto 0;
            max-width: 1180px;
            text-align: center;
            font-size: 26px;
            font-weight: 300;
            font-style: italic;
            color: #cbd5e1;
            line-height: 1.45;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.4s forwards;
        }

        .thesis strong {
            color: var(--cyan-400);
            font-weight: 600;
            font-style: normal;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="header">
                <div class="eyebrow">Systemy rozproszone</div>
                <h1 class="title">Cztery style <span class="highlight">integracji modułów</span></h1>
            </div>

            <div class="styles-grid">
                <div class="style-card">
                    <div class="style-icon"><i class="ti ti-file-export"></i></div>
                    <div class="style-body">
                        <div class="style-name">File Transfer</div>
                        <div class="style-label">plik jako medium wymiany</div>
                    </div>
                </div>

                <div class="style-card">
                    <div class="style-icon"><i class="ti ti-database"></i></div>
                    <div class="style-body">
                        <div class="style-name">Shared Database</div>
                        <div class="style-label">wspólny schemat danych</div>
                    </div>
                </div>

                <div class="style-card">
                    <div class="style-icon"><i class="ti ti-arrow-bounce"></i></div>
                    <div class="style-body">
                        <div class="style-name">Direct Call</div>
                        <div class="style-label">synchroniczne wywołanie</div>
                    </div>
                </div>

                <div class="style-card">
                    <div class="style-icon"><i class="ti ti-broadcast"></i></div>
                    <div class="style-body">
                        <div class="style-name">Messaging</div>
                        <div class="style-label">zdarzenia przez brokera</div>
                    </div>
                </div>
            </div>

            <p class="thesis">
                Każdy z tych stylów odpowiada na <strong>to samo pytanie</strong>, ale w różnej sytuacji.
            </p>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
