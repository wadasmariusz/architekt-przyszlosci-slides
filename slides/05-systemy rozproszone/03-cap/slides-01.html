<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 01 - Trójkąt CAP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.70), rgba(10,14,23,0.82)),
                url('../../../images/background-5.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.18) 48%, rgba(3,7,18,0.58) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 78px 130px 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            max-width: 1320px;
            margin: 0 auto 34px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--cyan-400);
            margin-bottom: 18px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.2s forwards;
        }

        .eyebrow::before,
        .eyebrow::after {
            content: '';
            width: 54px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(34,211,238,0.55), transparent);
        }

        .title {
            font-size: 80px;
            font-weight: 800;
            letter-spacing: 0;
            line-height: 1.08;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.4s forwards;
        }

        .title .accent {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === CAP triangle === */
        .cap-wrap {
            position: relative;
            width: 1180px;
            height: 610px;
            margin-top: 4px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.65s forwards;
        }

        .triangle-lines {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .triangle-lines path {
            fill: none;
            stroke: rgba(34,211,238,0.28);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 10 16;
        }

        .cap-node {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 34px;
            background:
                radial-gradient(circle at 50% 34%, rgba(34,211,238,0.18), rgba(34,211,238,0.04) 46%, rgba(17,24,39,0.78) 100%),
                rgba(17,24,39,0.74);
            box-shadow: 0 26px 70px rgba(0,0,0,0.34), 0 0 80px rgba(34,211,238,0.08);
            backdrop-filter: blur(9px);
        }

        .cap-node--c {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: breathe 4.8s ease-in-out infinite;
        }

        .cap-node--a {
            left: 165px;
            bottom: 18px;
            animation: breathe 4.8s ease-in-out 0.8s infinite;
        }

        .cap-node--p {
            right: 165px;
            bottom: 18px;
            animation: breathe 4.8s ease-in-out 1.6s infinite;
        }

        .cap-letter {
            font-size: 74px;
            font-weight: 800;
            line-height: 1;
            color: var(--cyan-400);
            margin-bottom: 18px;
            text-shadow: 0 0 26px rgba(34,211,238,0.28);
        }

        .cap-name {
            font-size: 28px;
            font-weight: 700;
            color: #f0f4f8;
            line-height: 1.12;
        }

        .cap-note {
            margin-top: 10px;
            font-size: 17px;
            font-weight: 400;
            color: #94a3b8;
            line-height: 1.35;
        }

        .center-note {
            position: absolute;
            left: 50%;
            top: 58%;
            width: 390px;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #cbd5e1;
            font-size: 24px;
            font-weight: 500;
            line-height: 1.35;
        }

        .center-note strong {
            display: block;
            margin-bottom: 4px;
            color: #f0f4f8;
            font-size: 32px;
            font-weight: 800;
        }

        .footer-thought {
            margin-top: 22px;
            color: #cbd5e1;
            font-size: 26px;
            font-weight: 300;
            line-height: 1.45;
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.95s forwards;
        }

        .footer-thought b {
            color: var(--cyan-400);
            font-weight: 700;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes breathe {
            0%, 100% { box-shadow: 0 26px 70px rgba(0,0,0,0.34), 0 0 80px rgba(34,211,238,0.08); }
            50%      { box-shadow: 0 26px 70px rgba(0,0,0,0.34), 0 0 96px rgba(34,211,238,0.14); }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="header">
                <h1 class="title">Twierdzenie <span class="accent">CAP</span></h1>
            </div>

            <div class="cap-wrap" aria-label="Trójkąt CAP">
                <svg class="triangle-lines" viewBox="0 0 1180 610" aria-hidden="true">
                    <path d="M590 158 L315 430 L865 430 Z"></path>
                </svg>

                <div class="cap-node cap-node--c">
                    <div class="cap-letter">C</div>
                    <div class="cap-name">Consistency</div>
                </div>

                <div class="cap-node cap-node--a">
                    <div class="cap-letter">A</div>
                    <div class="cap-name">Availability</div>
                </div>

                <div class="cap-node cap-node--p">
                    <div class="cap-letter">P</div>
                    <div class="cap-name">Partition Tolerance</div>
                </div>

                <div class="center-note">
                    <strong>CAP</strong>
                </div>
            </div>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
