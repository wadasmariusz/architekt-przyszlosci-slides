<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 03 - C — Consistency</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
            --danger: #f43f5e;
            --warn: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.70), rgba(10,14,23,0.82)),
                url('../../../images/background-1.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.18) 48%, rgba(3,7,18,0.58) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 80px 130px 170px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 36px;
            max-width: 1500px;
            margin: 0 auto 40px;
        }

        .letter-mark {
            font-size: 180px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-700));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -6px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.2s forwards;
        }

        .header-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.35s forwards;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--cyan-400);
            margin-bottom: 14px;
        }

        .eyebrow .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--cyan-400);
        }

        .title {
            font-size: 80px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.05;
            margin-bottom: 8px;
        }

        .title .accent {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 26px;
            font-weight: 300;
            color: #cbd5e1;
            font-style: italic;
        }

        /* === Definition === */
        .definition {
            max-width: 1500px;
            margin: 0 auto 40px;
            padding: 32px 44px;
            background: rgba(17,24,39,0.62);
            backdrop-filter: blur(8px);
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 26px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.55s forwards;
        }

        .definition-icon {
            flex: 0 0 auto;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: var(--cyan-400);
            background: rgba(34,211,238,0.12);
        }

        .definition-text {
            font-size: 30px;
            font-weight: 500;
            color: #f0f4f8;
            line-height: 1.4;
        }

        .definition-text b {
            font-weight: 700;
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Comparison === */
        .comparison {
            max-width: 1500px;
            margin: 0 auto 32px;
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 28px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.8s forwards;
        }

        .node-card {
            flex: 1;
            max-width: 540px;
            background: rgba(17,24,39,0.60);
            backdrop-filter: blur(8px);
            border-radius: 18px;
            padding: 26px 32px;
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .node-card-icon {
            flex: 0 0 auto;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #94a3b8;
            background: rgba(148,163,184,0.10);
        }

        .node-card-body {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .node-card-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #94a3b8;
        }

        .node-card-state {
            font-size: 36px;
            font-weight: 800;
            color: #f0f4f8;
            line-height: 1.1;
        }

        .node-card-state .quote {
            color: var(--warn);
        }

        .node-card-state .quote--ok {
            color: var(--cyan-400);
        }

        /* Conflict divider (between cards) */
        .conflict-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 140px;
            color: var(--danger);
        }

        .conflict-divider-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(244,63,94,0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .conflict-divider-text {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            line-height: 1.25;
        }

        /* === Insight footnote === */
        .insight {
            max-width: 1500px;
            margin: 0 auto;
            padding: 22px 32px;
            background: rgba(34,211,238,0.08);
            backdrop-filter: blur(6px);
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 18px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.0s forwards;
        }

        .insight-icon {
            flex: 0 0 auto;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--cyan-400);
            background: rgba(34,211,238,0.14);
        }

        .insight-text {
            font-size: 20px;
            font-weight: 500;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .insight-text b {
            color: #f0f4f8;
            font-weight: 700;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="header">
                <div class="letter-mark">C</div>
                <div class="header-text">
                    <div class="eyebrow">
                    </div>
                    <h1 class="title"><span class="accent">Consistency</span></h1>
                    <div class="subtitle">spójność liniowa <span style="opacity:0.7"></span></div>
                </div>
            </div>

            <div class="definition">
                <div class="definition-icon"><i class="ti ti-equal"></i></div>
                <div class="definition-text">
                    Wszystkie węzły systemu widzą <b>te&nbsp;same dane</b>
                    w&nbsp;<b>tej samej kolejności</b>.
                </div>
            </div>

            <div class="comparison">
                <div class="node-card">
                    <div class="node-card-icon"><i class="ti ti-building-store"></i></div>
                    <div class="node-card-body">
                        <div class="node-card-label">Panel pracownika</div>
                        <div class="node-card-state"><span class="quote">„wypożyczony"</span></div>
                    </div>
                </div>

                <div class="conflict-divider">
                    <div class="conflict-divider-icon"><i class="ti ti-circle-x"></i></div>
                    <div class="conflict-divider-text">Niedopusz&shy;czalne</div>
                </div>

                <div class="node-card">
                    <div class="node-card-icon"><i class="ti ti-device-mobile"></i></div>
                    <div class="node-card-body">
                        <div class="node-card-label">Aplikacja klienta</div>
                        <div class="node-card-state"><span class="quote--ok">„dostępny"</span></div>
                    </div>
                </div>
            </div>

            <div class="insight">
                <div class="insight-icon"><i class="ti ti-bulb"></i></div>
                <div class="insight-text">
                    <b>C</b> w&nbsp;CAP oznacza zgodność widoku między węzłami —
                    nie poprawność reguł biznesowych.
                </div>
            </div>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
