<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 04 - CAP vs PACELC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f172a;
            --muted: #64748b;
            --paper: #f8fafc;
            --paper-soft: #eef7f5;
            --cap-red: #c81e1e;
            --pacelc-green: #108a00;
            --consistency: #f472b6;
            --availability: #8ceec4;
            --partition: #f6e8a8;
            --latency: #b8acf6;
            --cyan-400: #22d3ee;
            --cyan-700: #0e7490;
            --dark-bg: #0a0e17;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(5,10,18,0.70), rgba(5,10,18,0.90)),
                url('../../../images/background-3.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(3,7,18,0.10) 0%, rgba(3,7,18,0.42) 100%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 96px);
            opacity: 0.72;
        }

        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 58px 92px 168px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: end;
            gap: 26px;
            margin-bottom: 26px;
        }

        .eyebrow {
            justify-self: start;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--cyan-400);
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.15s forwards;
        }

        .eyebrow::before {
            content: '';
            width: 52px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(34,211,238,0.65));
        }

        .title {
            justify-self: center;
            font-size: 58px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: 0;
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.3s forwards;
        }

        .title span {
            color: var(--cyan-400);
        }

        .legend {
            justify-self: end;
            display: flex;
            gap: 12px;
            color: #cbd5e1;
            font-size: 15px;
            font-weight: 700;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.45s forwards;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .comparison {
            width: 1736px;
            height: 560px;
            flex: 0 0 560px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.55s forwards;
        }

        .panel {
            position: relative;
            height: 100%;
            background: rgba(248,250,252,0.96);
            border: 2px dashed rgba(15,23,42,0.82);
            color: var(--ink);
            box-shadow: 0 30px 80px rgba(0,0,0,0.34);
            overflow: hidden;
        }

        .panel--cap {
            background:
                radial-gradient(circle at 50% 48%, rgba(34,211,238,0.13), transparent 58%),
                linear-gradient(145deg, rgba(4,10,20,0.98), rgba(1,7,15,0.98));
        }

        .panel--pacelc {
            background:
                radial-gradient(circle at 50% 48%, rgba(34,211,238,0.12), transparent 58%),
                linear-gradient(145deg, rgba(4,10,20,0.98), rgba(1,7,15,0.98));
        }

        .panel-tab {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 272px;
            height: 62px;
            padding: 0 36px;
            border-radius: 0 0 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 35px;
            font-weight: 800;
            letter-spacing: 0;
            box-shadow: 0 14px 26px rgba(15,23,42,0.22);
            z-index: 5;
        }

        .panel--cap .panel-tab { background: var(--cap-red); }
        .panel--pacelc .panel-tab { background: var(--pacelc-green); }

        .panel-note {
            position: absolute;
            left: 32px;
            right: 32px;
            bottom: 18px;
            height: 58px;
            padding: 10px 22px;
            background: rgba(255,255,255,0.78);
            color: #334155;
            font-size: 18px;
            line-height: 1.35;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .panel-note b {
            color: var(--ink);
            font-weight: 800;
        }

        .diagram-figure {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .diagram-figure--cap {
            inset: 78px 38px 34px;
        }

        .diagram-figure--pacelc {
            inset: 74px 24px 24px;
        }

        .diagram-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 18px 28px rgba(0,0,0,0.34));
        }

        .takeaway {
            width: 860px;
            margin-top: 20px;
            padding: 15px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: rgba(8,13,24,0.72);
            border: 1px solid rgba(34,211,238,0.34);
            box-shadow: 0 22px 60px rgba(0,0,0,0.26);
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.75s forwards;
        }

        .takeaway i {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(34,211,238,0.13);
            color: var(--cyan-400);
            font-size: 27px;
        }

        .takeaway-text {
            color: #e2e8f0;
            font-size: 22px;
            font-weight: 500;
            line-height: 1.34;
            text-align: center;
        }

        .takeaway-text b {
            color: var(--cyan-400);
            font-weight: 800;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg-image"></div>

        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <div class="content">
            <header class="header">
                <div class="eyebrow">Porównanie modeli</div>
                <h1 class="title"><span>CAP</span> VS <span>PACELC</span></h1>
            </header>

            <main class="comparison">
                <section class="panel panel--cap" aria-label="CAP Theorem">
                    <div class="panel-tab">CAP Theorem</div>
                    <div class="diagram-figure diagram-figure--cap">
                        <img class="diagram-image"
                             src="images/diagram cap.png"
                             alt="Diagram CAP: Consistency, Availability i Partition Tolerance">
                    </div>
                </section>

                <section class="panel panel--pacelc" aria-label="PACELC">
                    <div class="panel-tab">PACELC</div>
                    <div class="diagram-figure diagram-figure--pacelc">
                        <img class="diagram-image"
                             src="images/diagram pacelc.png"
                             alt="Diagram PACELC: wybór PAC przy partycji albo ELC bez partycji">
                    </div>
                </section>
            </main>
        </div>

        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
