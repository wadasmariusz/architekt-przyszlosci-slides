<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 03 - Coupling ≠ problem</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.66), rgba(10,14,23,0.76)),
                url('../../../images/background-6.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.16) 48%, rgba(3,7,18,0.56) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 86px 130px 150px;
        }

        .header {
            text-align: center;
            max-width: 1300px;
            margin: 0 auto 40px;
        }

        .title {
            font-size: 76px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 22px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .neq {
            color: var(--cyan-400);
            font-weight: 800;
            margin: 0 12px;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lede {
            font-size: 26px;
            font-weight: 300;
            line-height: 1.5;
            color: #cbd5e1;
            max-width: 1100px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s forwards;
        }

        .lede strong {
            color: var(--cyan-400);
            font-weight: 600;
        }

        /* === Natural dependencies === */
        .deps {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            max-width: 1500px;
            margin: 40px auto 44px;
        }

        .dep-card {
            padding: 28px 32px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            background: rgba(17,24,39,0.62);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
        }

        .dep-card:nth-child(1) { animation: fadeUp 0.8s ease-out 0.7s forwards; }
        .dep-card:nth-child(2) { animation: fadeUp 0.8s ease-out 0.9s forwards; }
        .dep-card:nth-child(3) { animation: fadeUp 0.8s ease-out 1.1s forwards; }

        .dep-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: rgba(34,211,238,0.11);
            color: var(--cyan-400);
            flex: 0 0 auto;
        }

        .dep-text {
            font-size: 24px;
            font-weight: 600;
            color: #e2e8f0;
            line-height: 1.3;
        }

        /* === Quote === */
        .quote {
            max-width: 1400px;
            margin: 0 auto;
            padding: 44px 60px;
            border: 1px solid rgba(34,211,238,0.18);
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(14,116,144,0.18), rgba(17,24,39,0.55));
            backdrop-filter: blur(6px);
            position: relative;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.3s forwards;
        }

        .quote-mark {
            position: absolute;
            top: 18px;
            left: 30px;
            font-size: 56px;
            color: var(--cyan-400);
            opacity: 0.45;
            line-height: 1;
        }

        .quote-text {
            font-size: 30px;
            font-weight: 400;
            font-style: italic;
            line-height: 1.4;
            color: #f0f4f8;
            text-align: center;
        }

        .quote-text em {
            color: var(--cyan-400);
            font-style: normal;
            font-weight: 600;
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="header">
                <h2 class="title">Coupling <span class="neq">≠</span> <span class="highlight">problem</span></h2>
                <p class="lede">
                    Zależności między modułami są <strong>naturalne i nieuniknione</strong>.
                </p>
            </div>

            <div class="deps">
                <div class="dep-card">
                    <div class="dep-icon"><i class="ti ti-arrows-exchange"></i></div>
                    <div class="dep-text">Wymiana danych</div>
                </div>
                <div class="dep-card">
                    <div class="dep-icon"><i class="ti ti-function"></i></div>
                    <div class="dep-text">Wywołania funkcji</div>
                </div>
                <div class="dep-card">
                    <div class="dep-icon"><i class="ti ti-bolt"></i></div>
                    <div class="dep-text">Reakcje na zdarzenia</div>
                </div>
            </div>

            <div class="quote">
                <div class="quote-mark"><i class="ti ti-quote"></i></div>
                <p class="quote-text">
                    Dobra architektura nie polega na <em>usuwaniu</em> wszystkich zależności,</br> ale na tym, żeby były <em>świadome</em>, <em>ograniczone</em>, <em>czytelne</em> i <em>stabilne</em>.
                </p>
            </div>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
