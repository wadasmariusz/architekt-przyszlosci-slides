<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 06 - Common coupling</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
            --warn: #f59e0b;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.66), rgba(10,14,23,0.76)),
                url('../../../images/background-5.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.16) 48%, rgba(3,7,18,0.56) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 76px 130px 150px;
        }

        .header {
            text-align: center;
            max-width: 1400px;
            margin: 0 auto 36px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--warn);
            padding: 8px 18px;
            border: 1px solid rgba(245,158,11,0.35);
            border-radius: 999px;
            background: rgba(245,158,11,0.08);
            margin-bottom: 18px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.2s forwards;
        }

        .title {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.15;
            margin-bottom: 18px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.4s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, #fbbf24, var(--warn));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lede {
            font-size: 24px;
            font-weight: 300;
            line-height: 1.5;
            color: #cbd5e1;
            max-width: 1200px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.55s forwards;
        }

        .lede strong { color: var(--cyan-400); font-weight: 600; }

        /* === Main body: diagram + consequences === */
        .body {
            display: grid;
            grid-template-columns: 1fr 520px;
            gap: 48px;
            max-width: 1640px;
            margin: 0 auto;
            align-items: stretch;
        }

        .diagram {
            position: relative;
            height: 480px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            background: rgba(17,24,39,0.55);
            backdrop-filter: blur(6px);
            padding: 16px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.75s forwards;
        }

        .diagram-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .module-label {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            fill: #f0f4f8;
        }

        .module-sub {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            fill: #94a3b8;
            font-size: 12px;
        }

        .state-label {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            fill: var(--warn);
            letter-spacing: 0.5px;
        }

        .state-sub {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            fill: #fcd34d;
        }

        .flow-r { stroke: #94a3b8; }
        .flow-w { stroke: #22d3ee; }
        .flow-danger {
            stroke: var(--danger);
            animation: dashFlow 1s linear infinite;
        }

        .legend-text {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            fill: #cbd5e1;
        }

        /* Consequences panel */
        .panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.95s forwards;
        }

        .panel-card {
            padding: 22px 26px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            background: rgba(17,24,39,0.62);
            backdrop-filter: blur(6px);
        }

        .panel-card--accent {
            border: 1px solid rgba(245,158,11,0.3);
            background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(17,24,39,0.55));
        }

        .panel-head {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        .panel-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(34,211,238,0.13);
            color: var(--cyan-400);
            flex: 0 0 auto;
        }

        .panel-icon--warn {
            background: rgba(245,158,11,0.15);
            color: var(--warn);
        }

        .panel-title {
            font-size: 22px;
            font-weight: 700;
            color: #f0f4f8;
        }

        .panel-text {
            font-size: 19px;
            font-weight: 400;
            line-height: 1.45;
            color: #cbd5e1;
        }

        .panel-text em {
            font-style: italic;
            color: #f0f4f8;
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes dashFlow {
            from { stroke-dashoffset: 24; }
            to   { stroke-dashoffset: 0; }
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 0 rgba(245,158,11,0)); }
            50%      { filter: drop-shadow(0 0 14px rgba(245,158,11,0.6)); }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="header">
                <div class="eyebrow"><i class="ti ti-alert-circle-filled"></i>Sprzężenie przez wspólny stan</div>
                <h2 class="title">Common coupling<span class="highlight"></span></h2>
                <p class="lede">
                    Wiele modułów <strong>czyta i modyfikuje</strong> ten sam globalny obiekt.
                </p>
            </div>

            <div class="body">
                <div class="diagram">
                    <svg class="diagram-svg" viewBox="0 0 900 450" preserveAspectRatio="xMidYMid meet">
                        <defs>
                            <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5"
                                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                                <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
                            </marker>
                            <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5"
                                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                                <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee" />
                            </marker>
                            <marker id="arrowDanger" viewBox="0 0 10 10" refX="9" refY="5"
                                    markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                                <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
                            </marker>
                            <radialGradient id="stateGlow" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
                                <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.08"/>
                                <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
                            </radialGradient>
                        </defs>

                        <!-- Glow halo around shared state -->
                        <circle cx="450" cy="225" r="180" fill="url(#stateGlow)"/>

                        <!-- Shared state (center) -->
                        <g style="animation: pulseGlow 2.6s ease-in-out infinite;">
                            <rect x="335" y="160" width="230" height="130" rx="20"
                                  fill="rgba(245,158,11,0.14)"
                                  stroke="#f59e0b" stroke-width="2.5"/>
                            <text x="450" y="200" text-anchor="middle" font-size="24" class="state-label">SHARED STATE</text>
                            <text x="450" y="226" text-anchor="middle" font-size="15" class="state-sub">global · singleton · config</text>
                            <text x="450" y="252" text-anchor="middle" font-size="13" class="module-sub">mutowalny · współdzielony</text>
                        </g>

                        <!-- Module A (top-left) -->
                        <rect x="60" y="40" width="160" height="80" rx="14"
                              fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="2"/>
                        <text x="140" y="78" text-anchor="middle" font-size="20" class="module-label">Moduł A</text>
                        <text x="140" y="100" text-anchor="middle" class="module-sub">read · write</text>

                        <!-- Module B (top-right) -->
                        <rect x="680" y="40" width="160" height="80" rx="14"
                              fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="2"/>
                        <text x="760" y="78" text-anchor="middle" font-size="20" class="module-label">Moduł B</text>
                        <text x="760" y="100" text-anchor="middle" class="module-sub">read · write</text>

                        <!-- Module C (bottom-left) — niekontrolowana modyfikacja -->
                        <rect x="60" y="330" width="160" height="80" rx="14"
                              fill="rgba(239,68,68,0.1)" stroke="#ef4444" stroke-width="2"/>
                        <text x="140" y="368" text-anchor="middle" font-size="20" class="module-label">Moduł C</text>
                        <text x="140" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#fca5a5">niekontrolowany zapis</text>

                        <!-- Module D (bottom-right) -->
                        <rect x="680" y="330" width="160" height="80" rx="14"
                              fill="rgba(34,211,238,0.08)" stroke="#22d3ee" stroke-width="2"/>
                        <text x="760" y="368" text-anchor="middle" font-size="20" class="module-label">Moduł D</text>
                        <text x="760" y="390" text-anchor="middle" class="module-sub">read</text>

                        <!-- A: read (out) + write (in) -->
                        <path d="M 220 70 Q 320 110 340 175"
                              fill="none" stroke-width="2" stroke-dasharray="5 5"
                              class="flow-r" marker-end="url(#arrowGray)"/>
                        <path d="M 335 200 Q 280 130 220 100"
                              fill="none" stroke-width="2.5"
                              class="flow-w" marker-end="url(#arrowCyan)"/>

                        <!-- B: read + write -->
                        <path d="M 680 70 Q 580 110 560 175"
                              fill="none" stroke-width="2" stroke-dasharray="5 5"
                              class="flow-r" marker-end="url(#arrowGray)"/>
                        <path d="M 565 200 Q 620 130 680 100"
                              fill="none" stroke-width="2.5"
                              class="flow-w" marker-end="url(#arrowCyan)"/>

                        <!-- C: dangerous write (highlighted) -->
                        <path d="M 220 370 Q 320 340 340 275"
                              fill="none" stroke-width="4"
                              stroke-dasharray="10 6"
                              class="flow-danger"
                              marker-end="url(#arrowDanger)"/>

                        <!-- D: read only -->
                        <path d="M 680 370 Q 580 340 560 275"
                              fill="none" stroke-width="2" stroke-dasharray="5 5"
                              class="flow-r" marker-end="url(#arrowGray)"/>

                        <!-- Legend -->
                        <g transform="translate(310, 410)">
                            <line x1="0" y1="0" x2="30" y2="0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
                            <text x="38" y="4" font-size="13" class="legend-text">read</text>

                            <line x1="100" y1="0" x2="130" y2="0" stroke="#22d3ee" stroke-width="2.5"/>
                            <text x="138" y="4" font-size="13" class="legend-text">write</text>

                            <line x1="200" y1="0" x2="230" y2="0" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 4"/>
                            <text x="238" y="4" font-size="13" class="legend-text" style="fill:#fca5a5;">niekontrolowany zapis</text>
                        </g>
                    </svg>
                </div>

                <div class="panel">
                    <div class="panel-card panel-card--accent">
                        <div class="panel-head">
                            <div class="panel-icon panel-icon--warn"><i class="ti ti-ghost-2"></i></div>
                            <div class="panel-title">Ukryte zależności</div>
                        </div>
                    </div>

                    <div class="panel-card">
                        <div class="panel-head">
                            <div class="panel-icon"><i class="ti ti-arrows-sort"></i></div>
                            <div class="panel-title">Zależność od kolejności</div>
                        </div>
                    </div>

                    <div class="panel-card">
                        <div class="panel-head">
                            <div class="panel-icon"><i class="ti ti-bug"></i></div>
                            <div class="panel-title">Trudny debug</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
