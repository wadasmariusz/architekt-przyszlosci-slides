<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 15 - DRY to zasada o wiedzy, nie o wyglądzie kodu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.72), rgba(10,14,23,0.82)),
                url('../../../images/background-6.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.22) 48%, rgba(3,7,18,0.66) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.45) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.45) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 80px 130px 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Eyebrow: "Zapamiętaj jedną rzecz" */
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 36px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .eyebrow-line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--cyan-400));
        }

        .eyebrow-line--right {
            background: linear-gradient(90deg, var(--cyan-400), transparent);
        }

        .eyebrow-text {
            font-size: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--cyan-400);
        }

        /* === Dominant statement === */
        .statement {
            text-align: center;
            max-width: 1620px;
            margin-bottom: 70px;
            opacity: 0;
            animation: fadeUp 1.0s ease-out 0.6s forwards;
        }

        .statement-line {
            font-size: 88px;
            font-weight: 800;
            letter-spacing: -2.5px;
            line-height: 1.05;
            color: #f0f4f8;
        }

        .statement-line:not(:last-child) {
            margin-bottom: 6px;
        }

        .statement-line .knowledge {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }

        .statement-line .strike {
            color: #475569;
            text-decoration: line-through;
            text-decoration-color: rgba(239,68,68,0.55);
            text-decoration-thickness: 5px;
            font-weight: 700;
        }

        /* === Supporting sentences === */
        .support {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 44px;
            width: 100%;
            max-width: 1480px;
        }

        .support-card {
            display: flex;
            align-items: flex-start;
            gap: 22px;
            padding: 26px 30px;
            border-radius: 18px;
            background: rgba(17,24,39,0.62);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(8px);
            opacity: 0;
        }

        .support-card:nth-child(1) {
            border-left: 3px solid var(--cyan-500);
            animation: slideFromLeft 0.8s ease-out 1.1s forwards;
        }

        .support-card:nth-child(2) {
            border-left: 3px solid var(--cyan-500);
            animation: slideFromRight 0.8s ease-out 1.1s forwards;
        }

        .support-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(6,182,212,0.14);
            color: var(--cyan-400);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .support-text {
            font-size: 22px;
            font-weight: 300;
            font-style: italic;
            line-height: 1.5;
            color: #cbd5e1;
        }

        .support-text .em {
            color: #f0f4f8;
            font-weight: 600;
            font-style: normal;
        }

        .support-text .accent {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-style: normal;
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(50px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <!-- Eyebrow with decorative lines -->
            <div class="eyebrow">
                <div class="eyebrow-line"></div>
                <div class="eyebrow-text">Podsumowanie</div>
                <div class="eyebrow-line eyebrow-line--right"></div>
            </div>

            <!-- Dominant statement -->
            <div class="statement">
                <div class="statement-line">
                    DRY to zasada o <span class="knowledge">wiedzy</span>,
                </div>
                <div class="statement-line">
                    nie o <span class="strike">wyglądzie</span> kodu.
                </div>
            </div>

            <!-- Two supporting sentences -->
            <div class="support">
                <div class="support-card">
                    <div class="support-icon"><i class="ti ti-fence"></i></div>
                    <div class="support-text">
                        Kod wyglądający podobnie w osobnych kontekstach to <span class="em">nie naruszenie DRY</span> &mdash; to <span class="accent">szacunek dla granic</span>.
                    </div>
                </div>
                <div class="support-card">
                    <div class="support-icon"><i class="ti ti-compass"></i></div>
                    <div class="support-text">
                        Projektując domeny, myśl o <span class="accent">autonomii i usuwalności</span>. Przedwczesna abstrakcja odbiera ci <span class="em">tę swobodę</span>.
                    </div>
                </div>
            </div>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
