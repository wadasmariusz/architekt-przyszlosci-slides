<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 12 - Open Host Service — DRY przez publiczny kontrakt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
            --emerald: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.66), rgba(10,14,23,0.76)),
                url('../../../images/background-5.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.16) 48%, rgba(3,7,18,0.56) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 60px 110px 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            max-width: 1320px;
            margin: 0 auto 26px;
        }

        .eyebrow {
            font-size: 22px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--cyan-400);
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .title {
            font-size: 78px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.15;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Comparison === */
        .comparison {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 30px;
            width: 100%;
            max-width: 1680px;
            align-items: stretch;
            margin-bottom: 28px;
        }

        .panel {
            padding: 24px 28px 26px;
            border-radius: 22px;
            background: rgba(17,24,39,0.62);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
        }

        .panel--chaos {
            border-left: 4px solid var(--red);
            animation: slideFromLeft 0.8s ease-out 0.8s forwards;
        }

        .panel--ohs {
            border-left: 4px solid var(--emerald);
            animation: slideFromRight 0.8s ease-out 0.8s forwards;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .panel-badge {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .panel--chaos .panel-badge {
            background: rgba(239,68,68,0.14);
            color: var(--red);
        }

        .panel--ohs .panel-badge {
            background: rgba(16,185,129,0.14);
            color: var(--emerald);
        }

        .panel-label {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #64748b;
        }

        .panel-title {
            font-size: 22px;
            font-weight: 700;
            color: #f0f4f8;
            line-height: 1.2;
        }

        .panel--chaos .panel-title strong { color: #fca5a5; }
        .panel--ohs .panel-title strong { color: #a7f3d0; }

        .diagram-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 360px;
        }

        .diagram-svg {
            width: 100%;
            height: 360px;
        }

        /* Bullet list under diagram */
        .panel-bullets {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .bullet {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(10,14,23,0.45);
        }

        .bullet i {
            font-size: 17px;
            flex-shrink: 0;
        }

        .panel--chaos .bullet i { color: var(--red); }
        .panel--ohs .bullet i { color: var(--emerald); }

        .bullet .em {
            color: #f0f4f8;
            font-weight: 600;
        }

        /* Versus divider */
        .versus {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 1.1s forwards;
        }

        .versus-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(10,14,23,0.85);
            border: 2px solid var(--cyan-600);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: var(--cyan-400);
            letter-spacing: 1px;
            box-shadow: 0 0 24px rgba(6,182,212,0.25);
        }

        /* === Bottom annotation === */
        .annotation {
            width: 100%;
            max-width: 1680px;
            padding: 24px 36px;
            border-radius: 18px;
            background: linear-gradient(90deg, rgba(34,211,238,0.10), rgba(6,182,212,0.05));
            border: 1px solid rgba(6,182,212,0.32);
            border-left: 5px solid var(--cyan-500);
            backdrop-filter: blur(6px);
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 26px;
            align-items: center;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.3s forwards;
        }

        .annotation-icon {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(6,182,212,0.16);
            color: var(--cyan-400);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            flex-shrink: 0;
        }

        .annotation-text {
            font-size: 22px;
            font-weight: 400;
            line-height: 1.42;
            color: #f0f4f8;
        }

        .annotation-text .accent {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .annotation-text .em {
            color: #f0f4f8;
            font-weight: 600;
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(60px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulseHost {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(16,185,129,0.4)); }
            50% { filter: drop-shadow(0 0 18px rgba(16,185,129,0.7)); }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="header">
                <div class="eyebrow">Open Host Service</div>
                <h2 class="title">DRY przez <span class="highlight">publiczny kontrakt</span></h2>
            </div>

            <div class="comparison">
                <!-- BEZ OHS: chaos -->
                <div class="panel panel--chaos">
                    <div class="panel-header">
                        <div class="panel-badge"><i class="ti ti-alert-triangle"></i></div>
                        <div>
                            <div class="panel-label">Bez Open Host Service</div>
                            <div class="panel-title">Rozproszona <strong>logika do walut</strong></div>
                        </div>
                    </div>
                    <div class="diagram-wrap">
                        <svg class="diagram-svg" viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="chaosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#ef4444" stop-opacity="0.22"/>
                                    <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.10"/>
                                </linearGradient>
                            </defs>

                            <!-- Orders Service with own currency logic -->
                            <g>
                                <rect x="40" y="40" width="180" height="120" rx="14"
                                      fill="url(#chaosGrad)" stroke="#ef4444" stroke-width="2"/>
                                <text x="130" y="68" text-anchor="middle" fill="#f0f4f8"
                                      font-family="Inter" font-size="16" font-weight="700">Orders</text>
                                <line x1="60" y1="84" x2="200" y2="84" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
                                <text x="130" y="104" text-anchor="middle" fill="#fca5a5"
                                      font-family="JetBrains Mono" font-size="11">round(HALF_UP, 2)</text>
                                <text x="130" y="122" text-anchor="middle" fill="#fca5a5"
                                      font-family="JetBrains Mono" font-size="11">źródło: NBP API</text>
                                <text x="130" y="140" text-anchor="middle" fill="#fca5a5"
                                      font-family="JetBrains Mono" font-size="11">edge: brak waluty?</text>
                            </g>

                            <!-- Invoicing Service with own currency logic -->
                            <g>
                                <rect x="300" y="40" width="180" height="120" rx="14"
                                      fill="url(#chaosGrad)" stroke="#ef4444" stroke-width="2"/>
                                <text x="390" y="68" text-anchor="middle" fill="#f0f4f8"
                                      font-family="Inter" font-size="16" font-weight="700">Invoicing</text>
                                <line x1="320" y1="84" x2="460" y2="84" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
                                <text x="390" y="104" text-anchor="middle" fill="#fca5a5"
                                      font-family="JetBrains Mono" font-size="11">round(HALF_EVEN, 4)</text>
                                <text x="390" y="122" text-anchor="middle" fill="#fca5a5"
                                      font-family="JetBrains Mono" font-size="11">źródło: ECB feed</text>
                                <text x="390" y="140" text-anchor="middle" fill="#fca5a5"
                                      font-family="JetBrains Mono" font-size="11">edge: weekend?</text>
                            </g>

                            <!-- Reporting Service with own currency logic -->
                            <g>
                                <rect x="170" y="200" width="180" height="120" rx="14"
                                      fill="url(#chaosGrad)" stroke="#ef4444" stroke-width="2"/>
                                <text x="260" y="228" text-anchor="middle" fill="#f0f4f8"
                                      font-family="Inter" font-size="16" font-weight="700">Reporting</text>
                                <line x1="190" y1="244" x2="330" y2="244" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
                                <text x="260" y="264" text-anchor="middle" fill="#fca5a5"
                                      font-family="JetBrains Mono" font-size="11">round(HALF_DOWN, 2)</text>
                                <text x="260" y="282" text-anchor="middle" fill="#fca5a5"
                                      font-family="JetBrains Mono" font-size="11">źródło: scraped XML</text>
                                <text x="260" y="300" text-anchor="middle" fill="#fca5a5"
                                      font-family="JetBrains Mono" font-size="11">edge: stary kurs</text>
                            </g>

                            <text x="260" y="350" text-anchor="middle" fill="#ef4444"
                                  font-family="Inter" font-size="13" font-weight="600"
                                  letter-spacing="2">TRZY ŚWIATY, TRZY PRAWDY</text>
                        </svg>
                    </div>
                    <div class="panel-bullets">
                        <div class="bullet"><i class="ti ti-x"></i><span class="em">Rozjazd zaokrągleń</span></div>
                        <div class="bullet"><i class="ti ti-x"></i><span class="em">Różne źródła kursów</span></div>
                    </div>
                </div>

                <!-- VS -->
                <div class="versus">
                    <div class="versus-circle">vs</div>
                </div>

                <!-- Z OHS: star with Currency Service -->
                <div class="panel panel--ohs">
                    <div class="panel-header">
                        <div class="panel-badge"><i class="ti ti-check"></i></div>
                        <div>
                            <div class="panel-label">Z Open Host Service</div>
                            <div class="panel-title">Jeden host, <strong>publiczny kontrakt</strong></div>
                        </div>
                    </div>
                    <div class="diagram-wrap">
                        <svg class="diagram-svg" viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#10b981" stop-opacity="0.30"/>
                                    <stop offset="100%" stop-color="#059669" stop-opacity="0.14"/>
                                </linearGradient>
                                <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
                                    <stop offset="100%" stop-color="#0e7490" stop-opacity="0.10"/>
                                </linearGradient>
                                <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5"
                                        markerWidth="7" markerHeight="7" orient="auto">
                                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
                                </marker>
                            </defs>

                            <!-- Connections (clients -> host) -->
                            <g stroke="#10b981" stroke-width="2" fill="none" opacity="0.85" marker-end="url(#arrowHead)">
                                <line x1="120" y1="80" x2="232" y2="160"/>
                                <line x1="400" y1="80" x2="288" y2="160"/>
                                <line x1="260" y1="290" x2="260" y2="220"/>
                            </g>

                            <!-- Endpoint label on connections -->
                            <text x="170" y="125" fill="#a7f3d0"
                                  font-family="JetBrains Mono" font-size="11">GET /convert</text>
                            <text x="312" y="125" fill="#a7f3d0"
                                  font-family="JetBrains Mono" font-size="11">GET /convert</text>
                            <text x="270" y="262" fill="#a7f3d0"
                                  font-family="JetBrains Mono" font-size="11">GET /convert</text>

                            <!-- Central Currency Service (host) -->
                            <g style="animation: pulseHost 3s ease-in-out infinite">
                                <circle cx="260" cy="190" r="58"
                                        fill="url(#hostGrad)" stroke="#10b981" stroke-width="3"/>
                                <text x="260" y="184" text-anchor="middle" fill="#f0f4f8"
                                      font-family="Inter" font-size="16" font-weight="700">Currency</text>
                                <text x="260" y="204" text-anchor="middle" fill="#a7f3d0"
                                      font-family="Inter" font-size="13">Service</text>
                                <text x="260" y="222" text-anchor="middle" fill="#6ee7b7"
                                      font-family="Inter" font-size="10" font-weight="600"
                                      letter-spacing="1.5">HOST</text>
                            </g>

                            <!-- Orders client -->
                            <g>
                                <rect x="40" y="40" width="160" height="60" rx="12"
                                      fill="url(#clientGrad)" stroke="#22d3ee" stroke-width="2"/>
                                <text x="120" y="65" text-anchor="middle" fill="#f0f4f8"
                                      font-family="Inter" font-size="15" font-weight="700">Orders</text>
                                <text x="120" y="86" text-anchor="middle" fill="#94a3b8"
                                      font-family="Inter" font-size="11">klient</text>
                            </g>

                            <!-- Invoicing client -->
                            <g>
                                <rect x="320" y="40" width="160" height="60" rx="12"
                                      fill="url(#clientGrad)" stroke="#22d3ee" stroke-width="2"/>
                                <text x="400" y="65" text-anchor="middle" fill="#f0f4f8"
                                      font-family="Inter" font-size="15" font-weight="700">Invoicing</text>
                                <text x="400" y="86" text-anchor="middle" fill="#94a3b8"
                                      font-family="Inter" font-size="11">klient</text>
                            </g>

                            <!-- Reporting client -->
                            <g>
                                <rect x="180" y="290" width="160" height="60" rx="12"
                                      fill="url(#clientGrad)" stroke="#22d3ee" stroke-width="2"/>
                                <text x="260" y="315" text-anchor="middle" fill="#f0f4f8"
                                      font-family="Inter" font-size="15" font-weight="700">Reporting</text>
                                <text x="260" y="336" text-anchor="middle" fill="#94a3b8"
                                      font-family="Inter" font-size="11">klient</text>
                            </g>
                        </svg>
                    </div>
                    <div class="panel-bullets">
                        <div class="bullet"><i class="ti ti-check"></i><span><span class="em">Jedna logika zaokrągleń</span></span></div>
                        <div class="bullet"><i class="ti ti-check"></i><span><span class="em">Klienci są decoupled</span></span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
