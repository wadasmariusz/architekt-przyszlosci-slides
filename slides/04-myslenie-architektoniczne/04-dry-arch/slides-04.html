<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 04 - DRY — oryginalna definicja</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Lora:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.66), rgba(10,14,23,0.76)),
                url('../../../images/background-6.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.16) 48%, rgba(3,7,18,0.56) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 80px 130px 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            max-width: 1280px;
            margin: 0 auto 40px;
        }

        .eyebrow {
            font-size: 22px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--cyan-400);
            margin-bottom: 14px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .title {
            font-size: 78px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Quote block === */
        .quote-block {
            max-width: 1380px;
            width: 100%;
            padding: 50px 70px 44px;
            border-radius: 24px;
            background: rgba(17,24,39,0.72);
            border: 1px solid rgba(6,182,212,0.25);
            backdrop-filter: blur(8px);
            position: relative;
            text-align: center;
            margin-bottom: 44px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.8s forwards;
        }

        .quote-mark {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--dark-bg);
            border: 2px solid var(--cyan-500);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cyan-400);
            font-size: 30px;
        }

        .quote-text {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 42px;
            font-weight: 400;
            line-height: 1.45;
            color: #f0f4f8;
            margin-bottom: 28px;
        }

        .quote-text .hl {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 500;
            font-style: italic;
        }

        .quote-source {
            display: inline-flex;
            align-items: center;
            gap: 18px;
            padding-top: 22px;
            border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 22px;
            color: #94a3b8;
        }

        .quote-source strong {
            color: #f0f4f8;
            font-weight: 600;
        }

        .quote-source .book {
            font-style: italic;
            color: #cbd5e1;
        }

        .quote-source .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #475569;
        }

        .authors {
            display: inline-flex;
            align-items: center;
            gap: 14px;
        }

        .author {
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .author-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--cyan-500);
            box-shadow: 0 0 28px rgba(6,182,212,0.35);
        }

        .author-amp {
            color: #64748b;
            font-weight: 400;
        }

        /* === Reframe key insight === */
        .reframe {
            display: flex;
            align-items: center;
            gap: 36px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.2s forwards;
        }

        .reframe-arrow {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--cyan-400);
        }

        .reframe-arrow i {
            font-size: 48px;
        }

        .reframe-arrow-label {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #64748b;
        }

        .reframe-pair {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .reframe-chip {
            padding: 22px 44px;
            border-radius: 18px;
            font-size: 44px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .reframe-chip--strike {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            color: #94a3b8;
            text-decoration: line-through;
            text-decoration-color: rgba(239,68,68,0.7);
            text-decoration-thickness: 3px;
        }

        .reframe-chip--keep {
            background: linear-gradient(135deg, rgba(34,211,238,0.15), rgba(6,182,212,0.08));
            border: 2px solid var(--cyan-500);
            color: #f0f4f8;
            box-shadow: 0 0 40px rgba(6,182,212,0.25);
        }

        .reframe-chip--keep .chip-accent {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .reframe-chip i {
            font-size: 38px;
        }

        .reframe-chip--strike i { color: #ef4444; }
        .reframe-chip--keep i { color: var(--cyan-400); }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseCyan {
            0%, 100% { box-shadow: 0 0 40px rgba(6,182,212,0.25); }
            50% { box-shadow: 0 0 60px rgba(6,182,212,0.45); }
        }

        .reframe-chip--keep {
            animation: pulseCyan 3s ease-in-out 1.6s infinite;
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="header">
                <div class="eyebrow">definicja</div>
                <h2 class="title">Co znaczy <span class="highlight">DRY</span></h2>
            </div>

            <!-- The original quote -->
            <div class="quote-block">
                <div class="quote-mark"><i class="ti ti-quote"></i></div>
                <div class="quote-text">
                    Every piece of <span class="hl">knowledge</span> must have a <span class="hl">single, unambiguous, authoritative representation</span> within a system.
                </div>
                <div class="quote-source">
                    <span class="authors">
                        <span class="author">
                            <img src="images/Andy Hunt.png" alt="Andy Hunt" class="author-photo">
                            <strong>Andy Hunt</strong>
                        </span>
                        <span class="author-amp">&amp;</span>
                        <span class="author">
                            <img src="images/DaveThomas.png" alt="Dave Thomas" class="author-photo">
                            <strong>Dave Thomas</strong>
                        </span>
                    </span>
                    <span class="dot"></span>
                    <span class="book">The Pragmatic Programmer</span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
