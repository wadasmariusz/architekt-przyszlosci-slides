<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 04 - Skala spójności — Constantine & Yourdon</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.66), rgba(10,14,23,0.76)),
                url('../../../images/background-2.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.16) 48%, rgba(3,7,18,0.56) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 70px 130px 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            max-width: 1280px;
            margin: 0 auto 36px;
        }

        .eyebrow {
            font-size: 22px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--cyan-400);
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.15s forwards;
        }

        .title {
            font-size: 60px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.15;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Scale === */
        .scale {
            width: 1320px;
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 32px;
            align-items: stretch;
        }

        /* Axis */
        .axis {
            position: relative;
            width: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s forwards;
        }

        .axis-cap {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.25;
            padding: 6px 0;
        }

        .axis-cap--top {
            color: var(--cyan-400);
        }

        .axis-cap--bottom {
            color: #ef4444;
        }

        .axis-bar {
            flex: 1;
            width: 14px;
            margin: 6px 0;
            border-radius: 999px;
            background: linear-gradient(
                to bottom,
                #22d3ee 0%,
                #06b6d4 16%,
                #14b8a6 32%,
                #eab308 50%,
                #f59e0b 66%,
                #f43f5e 84%,
                #dc2626 100%
            );
            box-shadow: 0 0 24px rgba(34,211,238,0.15);
        }

        .axis-arrow {
            font-size: 22px;
            line-height: 1;
            color: var(--cyan-400);
        }

        .axis-arrow--down {
            color: #ef4444;
        }

        /* Rows */
        .rows {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row {
            display: grid;
            grid-template-columns: 70px 1fr 200px;
            align-items: center;
            gap: 22px;
            padding: 14px 26px;
            border-radius: 14px;
            background: rgba(17,24,39,0.62);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(6px);
            opacity: 0;
            animation: slideFromLeft 0.7s ease-out forwards;
        }

        .row-num {
            font-size: 30px;
            font-weight: 800;
            text-align: center;
            color: var(--row-accent, #f8fafc);
            opacity: 1;
            letter-spacing: -1px;
        }

        .row-names {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .row-name-pl {
            font-size: 28px;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.15;
        }

        .row-name-en {
            font-size: 16px;
            font-weight: 400;
            color: #94a3b8;
            font-style: italic;
            letter-spacing: 0.4px;
        }

        .row-badge {
            justify-self: end;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .row-badge i {
            font-size: 16px;
            line-height: 1;
        }

        /* Per-row accents (top = best, bottom = worst) */
        .row--7 { --row-accent: #22d3ee; animation-delay: 0.55s; }
        .row--6 { --row-accent: #06b6d4; animation-delay: 0.65s; }
        .row--5 { --row-accent: #14b8a6; animation-delay: 0.75s; }
        .row--4 { --row-accent: #eab308; animation-delay: 0.85s; }
        .row--3 { --row-accent: #f59e0b; animation-delay: 0.95s; }
        .row--2 { --row-accent: #f43f5e; animation-delay: 1.05s; }
        .row--1 { --row-accent: #dc2626; animation-delay: 1.15s; }

        .row--7 .row-badge {
            background: rgba(34,211,238,0.14);
            border: 1px solid rgba(34,211,238,0.45);
            color: var(--cyan-400);
        }

        .row--1 .row-badge {
            background: rgba(220,38,38,0.14);
            border: 1px solid rgba(220,38,38,0.45);
            color: #ef4444;
        }

        /* === Animations === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <main class="content">
            <header class="header">
                <div class="eyebrow">Larry Constantine &amp; Edward Yourdon  · lata 70.</div>
                <h2 class="title">Skala <span class="highlight">spójności</span> - 7 poziomów</h2>
            </header>

            <section class="scale">
                <div class="axis" aria-hidden="true">
                    <div class="axis-arrow">&uarr;</div>
                    <div class="axis-cap axis-cap--top">Wysoka<br>spójność</div>
                    <div class="axis-bar"></div>
                    <div class="axis-cap axis-cap--bottom">Niska<br>spójność</div>
                    <div class="axis-arrow axis-arrow--down">&darr;</div>
                </div>

                <div class="rows">
                    <article class="row row--7">
                        <div class="row-num">7</div>
                        <div class="row-names">
                            <div class="row-name-pl">Funkcyjna</div>
                            <div class="row-name-en">Functional</div>
                        </div>
                    </article>

                    <article class="row row--6">
                        <div class="row-num">6</div>
                        <div class="row-names">
                            <div class="row-name-pl">Sekwencyjna</div>
                            <div class="row-name-en">Sequential</div>
                        </div>
                        <div></div>
                    </article>

                    <article class="row row--5">
                        <div class="row-num">5</div>
                        <div class="row-names">
                            <div class="row-name-pl">Komunikacyjna</div>
                            <div class="row-name-en">Communicational</div>
                        </div>
                        <div></div>
                    </article>

                    <article class="row row--4">
                        <div class="row-num">4</div>
                        <div class="row-names">
                            <div class="row-name-pl">Proceduralna</div>
                            <div class="row-name-en">Procedural</div>
                        </div>
                        <div></div>
                    </article>

                    <article class="row row--3">
                        <div class="row-num">3</div>
                        <div class="row-names">
                            <div class="row-name-pl">Czasowa</div>
                            <div class="row-name-en">Temporal</div>
                        </div>
                        <div></div>
                    </article>

                    <article class="row row--2">
                        <div class="row-num">2</div>
                        <div class="row-names">
                            <div class="row-name-pl">Logiczna</div>
                            <div class="row-name-en">Logical</div>
                        </div>
                        <div></div>
                    </article>

                    <article class="row row--1">
                        <div class="row-num">1</div>
                        <div class="row-names">
                            <div class="row-name-pl">Przypadkowa</div>
                            <div class="row-name-en">Coincidental</div>
                        </div>
                    </article>
                </div>
            </section>
        </main>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
