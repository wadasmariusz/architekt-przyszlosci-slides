<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 11 - Cel modułowości</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.66), rgba(10,14,23,0.76)),
                url('../../../images/background-6.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.16) 48%, rgba(3,7,18,0.56) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 70px 130px 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            max-width: 1180px;
            margin: 0 auto 28px;
        }

        .eyebrow {
            font-size: 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--cyan-400);
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .title {
            font-size: 72px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Diagnostic question === */
        .diagnostic {
            max-width: 1180px;
            width: 100%;
            padding: 30px 56px;
            border-radius: 18px;
            background:
                radial-gradient(circle at 50% 0%, rgba(34,211,238,0.14), transparent 66%),
                rgba(17,24,39,0.72);
            border: 1px solid rgba(6,182,212,0.26);
            backdrop-filter: blur(8px);
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.7s forwards;
        }

        .diagnostic-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            color: var(--cyan-400);
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }

        .diagnostic-label i {
            font-size: 24px;
        }

        .diagnostic-question {
            font-size: 46px;
            font-weight: 300;
            line-height: 1.25;
            color: #f0f4f8;
            font-style: italic;
        }

        /* === Scenarios === */
        .scenarios {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            max-width: 1180px;
            width: 100%;
            margin-top: 20px;
        }

        .scenario-card {
            min-height: 136px;
            padding: 24px 30px;
            border-radius: 16px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 18px;
            opacity: 0;
        }

        .scenario-good {
            background: rgba(16,185,129,0.06);
            border: 1px solid rgba(16,185,129,0.24);
            animation: slideFromLeft 0.8s ease-out 1.0s forwards;
        }

        .scenario-bad {
            background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.22);
            animation: slideFromRight 0.8s ease-out 1.0s forwards;
        }

        .scenario-arrow {
            flex: 0 0 auto;
            font-size: 34px;
            font-weight: 800;
        }

        .scenario-good .scenario-arrow {
            color: #10b981;
        }

        .scenario-bad .scenario-arrow {
            color: #ef4444;
        }

        .scenario-text {
            font-size: 27px;
            font-weight: 400;
            line-height: 1.28;
            color: #cbd5e1;
        }

        .scenario-text strong {
            color: #f0f4f8;
            font-weight: 800;
        }

        .scenario-good .scenario-text em {
            color: #10b981;
            font-style: normal;
            font-weight: 700;
        }

        .scenario-bad .scenario-text em {
            color: #ef4444;
            font-style: normal;
            font-weight: 700;
        }

        .scenario-note {
            display: block;
            margin-top: 6px;
            font-size: 22px;
        }

        /* === Closing sentence === */
        .closing {
            margin-top: 18px;
            padding: 16px 38px;
            border-radius: 16px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(6,182,212,0.15);
            backdrop-filter: blur(8px);
            font-size: 26px;
            font-weight: 300;
            font-style: italic;
            line-height: 1.38;
            color: #cbd5e1;
            text-align: center;
            max-width: 1180px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.4s forwards;
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(60px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="header">
                <div class="eyebrow">Podsumowanie</div>
                <h2 class="title">Cel <span class="highlight">modułowości</span></h2>
            </div>

            <div class="diagnostic">
                <div class="diagnostic-label"><i class="ti ti-search"></i></div>
                <div class="diagnostic-question">Ile modułów musisz otworzyć, żeby wprowadzić następną zmianę?</div>
            </div>

            <div class="scenarios">
                <div class="scenario-card scenario-good">
                    <div class="scenario-arrow">→</div>
                    <div class="scenario-text"><strong>Jeden, może dwa</strong><span class="scenario-note"> granice pracują <em>na Twoją korzyść</em></span></div>
                </div>

                <div class="scenario-card scenario-bad">
                    <div class="scenario-arrow">→</div>
                    <div class="scenario-text"><strong>Pięć, i więcej ...</strong><span class="scenario-note"> granice pracują <em>przeciwko Tobie</em></span></div>
                </div>
            </div>

            <div class="closing">
                Modułowość to fundament architektury.
            </div>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
