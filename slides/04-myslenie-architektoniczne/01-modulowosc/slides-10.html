<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 10 - Cena modułowości</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0%   { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .bg-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--cyan-400);
            opacity: 0;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(3) { top: 18%; left: 8%;  animation-delay: 0s; }
        .particle:nth-child(4) { top: 72%; left: 88%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 28%; left: 78%; animation-delay: 3s; }
        .particle:nth-child(6) { top: 78%; left: 16%; animation-delay: 4.5s; }
        .particle:nth-child(7) { top: 52%; left: 55%; animation-delay: 6s; }
        .particle:nth-child(8) { top: 14%; left: 58%; animation-delay: 2s; }

        @keyframes float {
            0%   { opacity: 0; transform: translateY(0) scale(1); }
            20%  { opacity: 0.8; }
            80%  { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 86px 130px 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            max-width: 1180px;
            margin: 0 auto 44px;
        }

        .eyebrow {
            font-size: 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #f59e0b;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .title {
            font-size: 72px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Costs list === */
        .costs {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1100px;
            width: 100%;
        }

        .cost {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 20px 30px;
            border: 1px solid rgba(245,158,11,0.12);
            border-radius: 18px;
            background: rgba(17,24,39,0.62);
            backdrop-filter: blur(6px);
            opacity: 0;
        }

        .cost:nth-child(1) { animation: bounceIn 0.8s ease-out 0.7s forwards; }
        .cost:nth-child(2) { animation: bounceIn 0.8s ease-out 0.9s forwards; }
        .cost:nth-child(3) { animation: bounceIn 0.8s ease-out 1.1s forwards; }
        .cost:nth-child(4) { animation: bounceIn 0.8s ease-out 1.3s forwards; }
        .cost:nth-child(5) { animation: bounceIn 0.8s ease-out 1.5s forwards; }

        .cost-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(245,158,11,0.11);
            color: #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .cost-text {
            font-size: 26px;
            font-weight: 600;
            color: #f0f4f8;
        }

        /* === Key sentence === */
        .key-sentence {
            margin-top: 36px;
            padding: 20px 36px;
            border-radius: 16px;
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(6,182,212,0.15);
            backdrop-filter: blur(8px);
            font-size: 24px;
            font-weight: 300;
            font-style: italic;
            color: #94a3b8;
            text-align: center;
            max-width: 1100px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.8s forwards;
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0%   { opacity: 0; transform: translateY(30px) scale(0.95); }
            60%  { opacity: 1; transform: translateY(-6px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="header">
                <div class="eyebrow">Trade-off</div>
                <h2 class="title">Cena <span class="highlight">modułowości</span></h2>
            </div>

            <div class="costs">
                <!-- 1 -->
                <div class="cost">
                    <div class="cost-icon"><i class="ti ti-messages"></i></div>
                    <div class="cost-text">Projektowanie komunikacji między modułami</div>
                </div>

                <!-- 2 -->
                <div class="cost">
                    <div class="cost-icon"><i class="ti ti-shield-check"></i></div>
                    <div class="cost-text">Pilnowanie interfejsów</div>
                </div>

                <!-- 3 -->
                <div class="cost">
                    <div class="cost-icon"><i class="ti ti-eye-off"></i></div>
                    <div class="cost-text">Decyzje o widoczności (co publiczne, co prywatne)</div>
                </div>

                <!-- 4 -->
                <div class="cost">
                    <div class="cost-icon"><i class="ti ti-droplet-off"></i></div>
                    <div class="cost-text">Ryzyko przeciekania szczegółów implementacji</div>
                </div>

                <!-- 5 -->
                <div class="cost">
                    <div class="cost-icon"><i class="ti ti-arrows-move"></i></div>
                    <div class="cost-text">Potrzeba ewolucji granic w czasie: idealny podział rzadko istnieje od początku</div>
                </div>
            </div>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
