<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 06 - Filar 2: Wysoka spójność funkcjonalności</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.66), rgba(10,14,23,0.76)),
                url('../../../images/background-5.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.16) 48%, rgba(3,7,18,0.56) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 70px 130px 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            max-width: 1280px;
            margin: 0 auto 22px;
        }

        .level-tag {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
            border-radius: 999px;
            background: rgba(6,182,212,0.14);
            border: 1px solid rgba(6,182,212,0.50);
            color: var(--cyan-400);
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.2s forwards;
        }

        .level-tag .level-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            background: var(--cyan-500);
            color: #052430;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 800;
        }

        .title {
            font-size: 60px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.15;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.35s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Definition banner === */
        .def-banner {
            width: 1320px;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 28px;
            border-radius: 16px;
            background: rgba(17,24,39,0.62);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(6px);
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.5s forwards;
            margin-bottom: 28px;
        }

        .def-banner i.def-icon {
            font-size: 28px;
            color: var(--cyan-400);
            flex: 0 0 auto;
            line-height: 1;
        }

        .def-banner-text {
            font-size: 22px;
            font-weight: 300;
            line-height: 1.4;
            color: #f0f4f8;
        }

        .def-banner-text strong { font-weight: 700; color: #f8fafc; }
        .def-banner-text em { color: var(--cyan-400); font-style: normal; font-weight: 700; }

        /* === Example wrapper === */
        .example-wrap {
            width: 1320px;
            display: flex;
            justify-content: center;
            align-items: stretch;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.75s forwards;
        }

        .example-intro {
            padding: 24px 28px;
            border-radius: 18px;
            background: rgba(17,24,39,0.62);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .example-key {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--cyan-400);
        }

        .example-key i { font-size: 18px; line-height: 1; }

        .example-headline {
            font-size: 28px;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.3;
        }

        .example-headline em { font-style: normal; font-weight: 800; color: var(--cyan-400); }

        .example-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }

        .example-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 19px;
            font-weight: 600;
            color: #f0f4f8;
        }

        .example-list li i {
            font-size: 22px;
            line-height: 1;
            color: var(--cyan-400);
        }

        /* === Quantum diagram === */
        .quantum-wrap {
            position: relative;
            width: 100%;
            max-width: 1100px;
            border-radius: 28px;
            background: linear-gradient(140deg, rgba(6,182,212,0.16), rgba(6,182,212,0.04) 60%, rgba(17,24,39,0.65));
            border: 2px dashed rgba(34,211,238,0.55);
            box-shadow: 0 28px 90px rgba(0,0,0,0.32), 0 0 80px rgba(6,182,212,0.14);
            backdrop-filter: blur(6px);
            padding: 64px 56px 44px;
        }

        .quantum-label {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 26px;
            border-radius: 999px;
            background: var(--cyan-500);
            color: #052430;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.45);
            white-space: nowrap;
        }

        .quantum-nodes {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 28px;
            position: relative;
        }

        .node {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 34px 18px;
            border-radius: 18px;
            background: rgba(17,24,39,0.90);
            border: 1.5px solid rgba(34,211,238,0.55);
            box-shadow: 0 8px 26px rgba(0,0,0,0.45), 0 0 32px rgba(6,182,212,0.12);
            opacity: 0;
        }

        .node:nth-child(1) { animation: nodeIn 0.6s ease-out 0.95s forwards; }
        .node:nth-child(2) { animation: nodeIn 0.6s ease-out 1.15s forwards; }
        .node:nth-child(3) { animation: nodeIn 0.6s ease-out 1.35s forwards; }

        .node-icon {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: rgba(6,182,212,0.16);
            border: 1px solid rgba(6,182,212,0.50);
            color: var(--cyan-400);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            line-height: 1;
        }

        .node-name {
            font-size: 24px;
            font-weight: 800;
            color: #f8fafc;
            text-align: center;
            line-height: 1.2;
            font-family: 'JetBrains Mono', monospace;
        }

        .node-desc {
            font-size: 16px;
            font-weight: 500;
            color: #94a3b8;
            text-align: center;
            line-height: 1.3;
        }

        .quantum-footer {
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 24px;
            border-radius: 14px;
            background: rgba(0,0,0,0.30);
            border: 1px solid rgba(34,211,238,0.30);
            opacity: 0;
            animation: fadeUp 0.6s ease-out 1.55s forwards;
        }

        .quantum-footer i {
            font-size: 30px;
            line-height: 1;
            color: var(--cyan-400);
            flex: 0 0 auto;
        }

        .quantum-footer-text {
            font-size: 22px;
            font-weight: 600;
            color: #f0f4f8;
            line-height: 1.35;
        }

        .quantum-footer-text strong { color: var(--cyan-400); font-weight: 800; }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes nodeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.92); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <main class="content">
            <header class="header">
                <h2 class="title">Wysoka spójność <span class="highlight">funkcjonalności</span></h2>
            </header>

            <section class="def-banner">
                <i class="ti ti-puzzle def-icon"></i>
                <p class="def-banner-text">
                    Kwant realizuje <strong>spójny fragment</strong> funkcjonalności biznesowej, <em>konkretną część domeny</em>.
                </p>
            </section>

            <section class="example-wrap">
                <article class="quantum-wrap">
                    <div class="quantum-label">Kwant: Płatności</div>
                    <div class="quantum-nodes">
                        <div class="node">
                            <div class="node-icon"><i class="ti ti-server"></i></div>
                            <div class="node-name">Serwis</div>
                            <div class="node-desc">płatności</div>
                        </div>
                        <div class="node">
                            <div class="node-icon"><i class="ti ti-database"></i></div>
                            <div class="node-name">Baza</div>
                            <div class="node-desc">transakcje</div>
                        </div>
                        <div class="node">
                            <div class="node-icon"><i class="ti ti-credit-card"></i></div>
                            <div class="node-name">Bramka</div>
                            <div class="node-desc">payment gateway</div>
                        </div>
                    </div>
                    <div class="quantum-footer">
                        <i class="ti ti-circle-check-filled"></i>
                        <p class="quantum-footer-text">
                            Wszystko, czego trzeba, by płatność <strong>przeszła od początku do końca</strong>.
                        </p>
                    </div>
                </article>
            </section>
        </main>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
