<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 02 - Problem: na jakim poziomie definiować wymagania?</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --cyan-700: #0e7490;
            --cyan-900: #164e63;
            --dark-bg: #0a0e17;
            --dark-surface: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-bg);
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* === Background layers === */
        .bg-image {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(10,14,23,0.66), rgba(10,14,23,0.76)),
                url('../../../images/background-5.jpg') center / cover no-repeat;
        }

        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 0%, rgba(3,7,18,0.16) 48%, rgba(3,7,18,0.56) 100%),
                linear-gradient(90deg, rgba(3,7,18,0.42) 0%, transparent 24%, transparent 76%, rgba(3,7,18,0.42) 100%);
        }

        /* === Corners === */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--cyan-700);
        }

        .corner--tl { top: 30px; left: 30px; }
        .corner--tl::before { width: 24px; height: 2px; top: 0; left: 0; }
        .corner--tl::after  { width: 2px; height: 24px; top: 0; left: 0; }

        .corner--br { bottom: 30px; right: 30px; }
        .corner--br::before { width: 24px; height: 2px; bottom: 0; right: 0; }
        .corner--br::after  { width: 2px; height: 24px; bottom: 0; right: 0; }

        /* === Content === */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 86px 130px 150px;
        }

        .header {
            text-align: center;
            max-width: 1280px;
            margin: 0 auto 56px;
        }

        .title {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.3s forwards;
        }

        .highlight {
            background: linear-gradient(135deg, var(--cyan-400), var(--cyan-600));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Levels === */
        .levels {
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 1080px;
            margin: 0 auto;
        }

        .level-item {
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 26px 36px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            background: rgba(17,24,39,0.62);
            backdrop-filter: blur(6px);
            opacity: 0;
        }

        .level-item:nth-child(1) {
            animation: slideFromLeft 0.8s ease-out 0.7s forwards;
            border-left: 3px solid #f59e0b;
        }

        .level-item:nth-child(2) {
            animation: slideFromLeft 0.8s ease-out 1.0s forwards;
            border-left: 3px solid #f43f5e;
        }

        .level-item:nth-child(3) {
            animation: slideFromLeft 0.8s ease-out 1.3s forwards;
            border: 1px solid var(--cyan-500);
            border-left: 3px solid var(--cyan-400);
            background: rgba(6,182,212,0.08);
            box-shadow: 0 0 40px rgba(34,211,238,0.12);
        }

        .level-icon {
            flex: 0 0 auto;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .level-item:nth-child(1) .level-icon {
            background: rgba(245,158,11,0.11);
            color: #f59e0b;
        }

        .level-item:nth-child(2) .level-icon {
            background: rgba(244,63,94,0.11);
            color: #f43f5e;
        }

        .level-item:nth-child(3) .level-icon {
            background: rgba(34,211,238,0.14);
            color: var(--cyan-400);
        }

        .level-body {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .level-name {
            font-size: 30px;
            font-weight: 700;
            color: #f0f4f8;
        }

        .level-item:nth-child(3) .level-name {
            color: var(--cyan-400);
        }

        .level-desc {
            font-size: 20px;
            font-weight: 400;
            color: #94a3b8;
            line-height: 1.4;
        }

        .level-arrow {
            flex: 0 0 auto;
            font-size: 28px;
            color: rgba(255,255,255,0.35);
        }

        .level-item:nth-child(3) .level-arrow {
            color: var(--cyan-400);
        }

        /* === Animations === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* === Fixed elements === */
        .slide-logo {
            position: absolute;
            z-index: 100;
            bottom: 40px;
            left: 40px;
            height: 100px;
            width: auto;
            opacity: 0.85;
            pointer-events: none;
        }

        .camera-box {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 480px;
            height: 270px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- background layers -->
        <div class="bg-image"></div>

        <!-- corner accents -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--br"></div>

        <!-- slide content -->
        <div class="content">
            <div class="header">
                <h2 class="title">Na jakim <span class="highlight">poziomie</span> definiować wymagania?</h2>
            </div>

            <div class="levels">
                <div class="level-item">
                    <div class="level-icon"><i class="ti ti-world"></i></div>
                    <div class="level-body">
                        <div class="level-name">Cały system</div>
                        <div class="level-desc">Zbyt ogólne — jedno wymaganie nie pasuje do wszystkiego</div>
                    </div>
                    <div class="level-arrow"><i class="ti ti-x"></i></div>
                </div>
                <div class="level-item">
                    <div class="level-icon"><i class="ti ti-cube"></i></div>
                    <div class="level-body">
                        <div class="level-name">Pojedynczy serwis</div>
                        <div class="level-desc">Zbyt wąskie — serwis nie działa w izolacji</div>
                    </div>
                    <div class="level-arrow"><i class="ti ti-x"></i></div>
                </div>
                <div class="level-item">
                    <div class="level-icon"><i class="ti ti-question-mark"></i></div>
                    <div class="level-body">
                        <div class="level-name">??? &nbsp;(kwant)</div>
                        <div class="level-desc">Brakujący środek — właściwa jednostka analizy</div>
                    </div>
                    <div class="level-arrow"><i class="ti ti-arrow-right"></i></div>
                </div>
            </div>
        </div>

        <!-- logo -->
        <img src="../../../logo/Architekt_Przyszłości_horizontal_gradient_light.png"
             alt="Architekt Przyszłości" class="slide-logo">

        <!-- camera overlay -->
        <div class="camera-box">kamera 480 &times; 270</div>
    </div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            function rescale() {
                const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
                stage.style.transformOrigin = 'top left';
                stage.style.transform = 'scale(' + scale + ')';
                stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
                stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
            }
            window.addEventListener('resize', rescale);
            rescale();
        })();
    </script>
</body>
</html>
